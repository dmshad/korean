 살 кончается на согласную → **살이에요**.\nВопрос — **몇 살이에요?** «сколько лет?». 몇 — «сколько» перед счётным словом.\nВ Корее о возрасте спрашивают прямо и рано: от него зависят обращение и вежливость.","ex":[{"ko":"몇 살이에요?","ru":"Сколько тебе лет?"},{"ko":"스물다섯 살이에요.","ru":"25 лет."},{"ko":"서른 살이었어요.","ru":"Было 30 лет."}]},{"id":"s6","title":"6. Произношение","body":"Финальный ㅅ звучит [т]: 셋 [섿], 넷 [넫], 다섯 [다섣], 여섯 [여섣]. 여덟 [여덜].\nПеред 살 — напряжение: 다섯 살 [다섣쌀], 여섯 살 [여섣쌀], 여덟 살 [여덜쌀].\nㅎ после ㄹ ослабляется: 열한 в беглой речи звучит ближе к [여란].","ex":[]}],"usage":[{"id":"u1","sit":"Спросить возраст","phrase":"몇 살이에요?","note":"Нормальный вопрос при знакомстве.","ex":[{"ko":"몇 살이에요? — 스물다섯 살이에요.","ru":"Сколько тебе лет? — 25."},{"ko":"친구는 몇 살이에요? — 서른 살이에요.","ru":"Сколько лет другу? — 30."}]},{"id":"u2","sit":"Назвать свой возраст","phrase":"저는 서른두 살이에요.","note":"Сокращённая форма: 서른두, не 서른둘.","ex":[{"ko":"저는 스무 살이에요.","ru":"Мне 20 лет."},{"ko":"저는 마흔한 살이에요.","ru":"Мне 41 год."}]},{"id":"u3","sit":"Возраст другого","phrase":"그 학생은 열여덟 살이에요.","note":"Тема — человек, сказуемое — возраст.","ex":[{"ko":"선생님은 쉰 살이에요.","ru":"Учителю 50 лет."}]},{"id":"u4","sit":"Возраст в прошлом","phrase":"스무 살이었어요.","note":"Прошедшее связки: 살이었어요.","ex":[{"ko":"저는 학생이었어요. 스무 살이었어요.","ru":"Я был студентом. Мне было 20."}]},{"id":"u5","sit":"Считать вслух","phrase":"하나, 둘, 셋!","note":"Отсчёт перед фото, стартом — полные формы, без сокращения.","ex":[{"ko":"하나, 둘, 셋, 넷, 다섯","ru":"Раз, два, три, четыре, пять"}]},{"id":"u6","sit":"Сравнить возраст","phrase":"저는 마흔 살이에요. 친구는 서른다섯 살이에요.","note":"은/는 — сопоставление.","ex":[{"ko":"저는 스물두 살이에요. 친구는 스물네 살이에요.","ru":"Мне 22, а другу 24."}]},{"id":"u7","sit":"Поправить","phrase":"스물한 살이에요? — 아니요, 스물두 살이에요.","note":"Переспрос с числом и ответ с исправлением.","ex":[{"ko":"서른 살이에요? — 네, 서른 살이에요.","ru":"Тебе 30? — Да, 30."}]}],"rel":[{"id":"g10"},{"id":"g12"},{"id":"g16","label":"Тема 16: часы (고유어)"}],"new":[]},{"id":"g12","n":12,"title":"Счётные слова (개, 명, 마리, 잔, 권)","meaning":"По-корейски нельзя просто сказать «два яблока»: между числом и предметом нужно счётное слово, как русское «две штуки», «три головы скота».\nСхема: **существительное + число + счётное** — 사과 두 개 «яблоко, две штуки».\nЧисла — 고유어 в сокращённой форме (한, 두, 세, 네, 스무), свыше 99 — 한자어.","schema":[{"title":"Счётные слова","cols":["Счётное","Что считают","Пример"],"rows":[["개","предметы, штуки","사과 두 개"],["명","люди","학생 세 명"],["분","люди (уважительно)","선생님 한 분"],["마리","животные","고양이 두 마리"],["잔","порции напитка","커피 한 잔"],["권","книги, журналы","책 네 권"]],"note":"개 — самый общий: для вещей без своего счётного."},{"title":"Место в предложении","cols":["Схема","Пример"],"rows":[["N + число + счётное","사과 두 개"],["N을/를 + число + счётное + глагол","사과를 두 개 샀어요."],["N + число + счётное + 을/를 + глагол","사과 두 개를 샀어요."],["N이/가 + число + счётное + 있어요","고양이가 두 마리 있어요."]],"note":"Частица — либо на существительном, либо на счётном слове."},{"title":"Число перед счётным","cols":["Число","Форма"],"rows":[["1","한 개"],["2","두 개"],["3","세 개"],["4","네 개"],["5","다섯 개"],["10","열 개"],["20","스무 개"],["21","스물한 개"],["100","백 개"]],"note":"До 99 — 고유어, со 100 — 한자어."}],"sections":[{"id":"s1","title":"1. Зачем счётное слово","body":"Корейское число не присоединяется к существительному напрямую. Между ними — счётное слово, указывающее, что считают: штуки, людей, животных, чашки.\nРусский аналог — «три штуки», «пять человек», «две чашки кофе», только в корейском это обязательно почти всегда.","ex":[{"ko":"사과 세 개","ru":"три яблока"},{"ko":"학생 다섯 명","ru":"пять учеников"},{"ko":"커피 두 잔","ru":"две чашки кофе"}]},{"id":"s2","title":"2. Порядок и частицы","body":"Сначала существительное, потом число со счётным: 사과 두 개 — буквально «яблоко, две штуки».\nЧастицу можно поставить двумя способами:\nна существительное — 사과를 두 개 샀어요 (частый разговорный вариант);\nна счётное слово — 사과 두 개를 샀어요 (группа как единое целое).\nС 있다/없다: 고양이가 두 마리 있어요 — «кошек две», буквально «кошка есть — две головы».","ex":[{"ko":"바나나를 두 개 샀어요.","ru":"Купил два банана."},{"ko":"계란 열 개를 샀어요.","ru":"Купил десять яиц."},{"ko":"의자가 네 개 있어요.","ru":"Стульев четыре."}]},{"id":"s3","title":"3. Какое счётное выбрать","body":"**개** — вещи: фрукты, мячи, сумки, стулья. Общий по умолчанию.\n**명** — люди. **분** — люди уважительно (о гостях, старших); о себе и своих — только 명.\n**마리** — животные. Собаку (개) считают не 개, а 마리: 개 두 마리.\n**잔** — порции напитка: 커피 한 잔, 주스 두 잔. Сама чашка как предмет — 컵; но порции — 잔.\n**권** — книги и журналы.","ex":[{"ko":"개가 두 마리 있어요.","ru":"У меня две собаки."},{"ko":"주스를 한 잔 마셨어요.","ru":"Выпил стакан сока."},{"ko":"잡지 두 권이 있어요.","ru":"Есть два журнала."}]},{"id":"s4","title":"4. Какое число","body":"До 99 — 고유어 (тема 11) в сокращённой форме: 한, 두, 세, 네, 스무 (ровно 20), 스물한 и т.д.\nСо 100 — только 한자어: 백 개, 백 명.\nОшибка — полная форма перед счётным: *하나 개, *둘 명. Правильно 한 개, 두 명.","ex":[{"ko":"한 명","ru":"один человек"},{"ko":"스무 명","ru":"двадцать человек"},{"ko":"백 개","ru":"сто штук"}]},{"id":"s5","title":"5. Вопрос: 몇 + счётное","body":"몇 — «сколько» перед счётным словом: 몇 개, 몇 명, 몇 마리, 몇 잔, 몇 권.\nСо связкой: 몇 개예요? «сколько штук?», 몇 명이에요? «сколько человек?».\nС 있다: 사과가 몇 개 있어요? — «сколько яблок (есть)?».\n몇 без счётного не употребляется: для цены — 얼마.","ex":[{"ko":"몇 개예요?","ru":"Сколько штук?"},{"ko":"학생이 몇 명 있어요?","ru":"Сколько учеников?"},{"ko":"커피를 몇 잔 마셨어요?","ru":"Сколько чашек кофе выпил?"}]},{"id":"s6","title":"6. Произношение","body":"После 다섯, 여섯, 여덟 счётное напрягается: 다섯 개 [다섣깨], 여섯 권 [여섣꿘], 여덟 개 [여덜깨].\n몇 перед счётным: 몇 개 [멷깨], 몇 잔 [멷짠], 몇 권 [멷꿘]; перед носовым — 몇 명 [면명], 몇 마리 [면마리].","ex":[]}],"usage":[{"id":"u1","sit":"Сколько штук есть?","phrase":"사과가 몇 개 있어요?","note":"Ответ — число + счётное + 있어요.","ex":[{"ko":"사과가 몇 개 있어요? — 세 개 있어요.","ru":"Сколько яблок? — Три."},{"ko":"의자가 몇 개예요? — 다섯 개예요.","ru":"Сколько стульев? — Пять."}]},{"id":"u2","sit":"Сколько купил","phrase":"사과를 세 개 샀어요.","note":"Частица на существительном — самый разговорный вариант.","ex":[{"ko":"바나나를 두 개 샀어요.","ru":"Купил два банана."},{"ko":"가게에서 계란을 열 개 샀어요.","ru":"Купил в магазине десять яиц."}]},{"id":"u3","sit":"Сколько человек","phrase":"몇 명이에요?","note":"В ресторане вас спросят уважительно, через 분. О себе отвечают через 명: 두 명이에요.","ex":[{"ko":"학생이 몇 명 있어요? — 스무 명 있어요.","ru":"Сколько учеников? — Двадцать."},{"ko":"여자가 세 명 있어요.","ru":"Женщин трое."}]},{"id":"u4","sit":"Животные","phrase":"고양이가 두 마리 있어요.","note":"Собака — 개, но счёт через 마리.","ex":[{"ko":"개가 한 마리 있어요.","ru":"У меня одна собака."},{"ko":"고양이가 몇 마리 있어요?","ru":"Сколько у тебя кошек?"}]},{"id":"u5","sit":"Сколько выпил","phrase":"커피를 두 잔 마셨어요.","note":"잔 — порция, 컵 — посуда.","ex":[{"ko":"오늘 커피를 세 잔 마셨어요.","ru":"Сегодня выпил три чашки кофе."},{"ko":"주스 한 잔을 마셨어요.","ru":"Выпил стакан сока."}]},{"id":"u6","sit":"Книги, журналы","phrase":"책을 다섯 권 샀어요.","note":"권 — для печатного.","ex":[{"ko":"잡지가 두 권 있어요.","ru":"Есть два журнала."},{"ko":"책을 몇 권 읽었어요?","ru":"Сколько книг прочитал?"}]},{"id":"u7","sit":"Больше сотни","phrase":"사과가 백 개 있어요.","note":"Со 100 — 한자어.","ex":[{"ko":"학교에 학생이 삼백 명 있어요.","ru":"В школе триста учеников."}]}],"rel":[{"id":"g10"},{"id":"g11"},{"id":"g2"},{"id":"g16","label":"Тема 16: 시, 분 — часы и минуты"}],"new":[]},{"id":"g13","n":13,"title":"Отрицание 안 / 못 + -지 않다","meaning":"«Не иду», «не могу пойти», «не дорого». У глаголов и 형용사 два способа сказать «не» и отдельное «не могу».\n**안** + глагол — короткое отрицание: 안 가요. **-지 않다** — длинное, смысл тот же: 가지 않아요.\n**못** — «не могу»: мешают обстоятельства или нет умения. Там, где есть слова-антонимы (있다/없다, 알다/모르다, 이다/아니다), отрицание не строят — берут пару.","schema":[{"title":"Три отрицания","cols":["Форма","Смысл","Пример"],"rows":[["안 + V","не (делаю / не такой)","안 가요 · 안 비싸요"],["V-지 않아요","то же, нейтрально-письменно","가지 않아요 · 비싸지 않아요"],["못 + V","не могу","못 가요"]],"note":""},{"title":"하다-глаголы","cols":["Утверждение","Отрицание"],"rows":[["운동해요","운동 안 해요 · 운동하지 않아요"],["청소해요","청소 안 해요"],["요리해요","요리 못 해요"]],"note":"안/못 встают между частями: 운동 안 해요, не *안 운동해요."},{"title":"Пары вместо отрицания","cols":["Не говорят","Говорят"],"rows":[["안 있어요","없어요"],["안 알아요","몰라요"],["안 학생이에요","학생이 아니에요"]],"note":""},{"title":"Прошедшее","cols":["Форма","Пример"],"rows":[["안 + V-았/었어요","안 먹었어요"],["V-지 않았어요","먹지 않았어요"],["못 + V-았/었어요","못 갔어요"]],"note":"Прошедшее — на глаголе (или на 않다), 안/못 не меняются."}],"sections":[{"id":"s1","title":"1. 안 — короткое отрицание","body":"안 ставится прямо перед глаголом или 형용사: 안 가요, 안 먹어요, 안 비싸요.\nВсё остальное остаётся на месте: 저는 고기를 안 먹어요 — «я не ем мясо».\nСамый частый способ в разговоре.","ex":[{"ko":"저는 고기를 안 먹어요.","ru":"Я не ем мясо."},{"ko":"커피가 안 비싸요.","ru":"Кофе недорогой."},{"ko":"오늘은 회사에 안 가요.","ru":"Сегодня не иду на работу."}]},{"id":"s2","title":"2. -지 않다 — длинное отрицание","body":"К основе прибавляется 지, после него — 않다 в нужной форме: 가 + 지 않아요 → **가지 않아요**. Основа не меняется, поэтому типы основ здесь не мешают: 바쁘지 않아요, 모르지 않아요… и даже 쉽지 않아요, 어렵지 않아요 (ㅂ-основы, тема 18).\nСмысл тот же, что у 안. Звучит нейтральнее, чаще на письме и в более аккуратной речи.\n않아요 произносится [아나요].","ex":[{"ko":"술을 마시지 않아요.","ru":"Не пью алкоголь."},{"ko":"한국어는 쉽지 않아요.","ru":"Корейский непростой."},{"ko":"이 책은 어렵지 않아요.","ru":"Эта книга несложная."}]},{"id":"s3","title":"3. 못 — «не могу»","body":"못 + глагол — действие невозможно: мешают обстоятельства или нет умения. 못 가요 — «не могу пойти», 운전 못 해요 — «не умею водить».\n안 — не делаю (так решил, не хочу, так устроено). 못 — не могу, хотя бы и хотел.\n술을 안 마셔요 — «не пью» (не хочу, не пью вообще). 술을 못 마셔요 — «не могу пить» (здоровье, за рулём).\nС 형용사 못 не употребляется: только 안 비싸요.\nКак вежливый отказ 못 мягче 안: 못 가요 = «не получится», 안 가요 = «не пойду».","ex":[{"ko":"내일은 못 가요.","ru":"Завтра не смогу прийти."},{"ko":"저는 운전을 못 해요.","ru":"Я не умею водить."},{"ko":"아파요. 밥을 못 먹어요.","ru":"Болею. Не могу есть."}]},{"id":"s4","title":"4. 하다-глаголы","body":"У глаголов вида «существительное + 하다» отрицание встаёт МЕЖДУ частями: 운동 안 해요, 청소 안 해요, 요리 못 해요.\n*안 운동해요 — ошибка.\nМожно и с 을/를 на существительной части: 운동을 안 해요, 요리를 못 해요.\nДлинное отрицание — на весь глагол: 운동하지 않아요.\nКасается только таких составных. Простой 하다 («делать»): 안 해요, 못 해요.","ex":[{"ko":"청소 안 해요.","ru":"Не убираюсь."},{"ko":"요리를 못 해요.","ru":"Не умею готовить."},{"ko":"전화하지 않았어요.","ru":"Не звонил."}]},{"id":"s5","title":"5. Где отрицание не строят","body":"Для трёх пар есть готовые антонимы — ими и пользуются:\n있다 → **없다**: 돈이 없어요, не *안 있어요.\n알다 → **모르다**: 주소를 몰라요, не *안 알아요.\n이다 → **아니다**: 학생이 아니에요.","ex":[{"ko":"전화번호를 몰라요.","ru":"Не знаю номер телефона."},{"ko":"주소가 없어요.","ru":"Адреса нет."}]},{"id":"s6","title":"6. 전혀 и 별로 — только с отрицанием","body":"**전혀** — «совсем не, вовсе не», категорично: 술을 전혀 안 마셔요 — «совсем не пью».\n**별로** — «не особо, не очень», смягчение: 별로 안 비싸요 — «не особо дорого».\nБез отрицания оба не употребляются. Ставятся перед 안/глаголом.","ex":[{"ko":"담배를 전혀 안 피워요.","ru":"Совсем не курю."},{"ko":"채소는 별로 안 먹어요.","ru":"Овощи ем не особо."},{"ko":"별로 바쁘지 않아요.","ru":"Не особо занят."}]},{"id":"s7","title":"7. Прошедшее и вопросы","body":"Прошедшее — на глаголе: 안 먹었어요, 못 갔어요; в длинной форме — на 않다: 먹지 않았어요.\nОтрицательный вопрос: 안 먹어요? — «не ешь?». Ответ по-корейски подтверждает или опровергает сказанное: 네, 안 먹어요 — «да (верно), не ем»; 아니요, 먹어요 — «нет, ем».","ex":[{"ko":"아침을 안 먹었어요.","ru":"Не завтракал."},{"ko":"어제 청소를 못 했어요.","ru":"Вчера не смог убраться."},{"ko":"고기를 안 먹어요? — 네, 안 먹어요.","ru":"Не ешь мясо? — Да, не ем."}]},{"id":"s8","title":"8. Произношение","body":"못 перед согласной звучит [몯] и напрягает следующий звук: 못 가요 [몯까요], 못 자요 [몯짜요].\nПеред ㅁ, ㄴ — [몬]: 못 먹어요 [몬머거요], 못 만나요 [몬만나요].\nПеред 하다 — [모태요]: 못 해요 → ㅌ. Перед гласной: 못 와요 [모돠요].\n않아요 [아나요], 않았어요 [아나써요].","ex":[]},{"id":"s9","title":"9. -지 못하다","body":"У 못 тоже есть длинная форма: -지 못하다. 가지 못해요 — «не могу пойти». Смысл как у 못 가요, звучит книжнее.","ex":[{"ko":"가지 못해요.","ru":"Не могу пойти."},{"ko":"어제 운동하지 못했어요.","ru":"Вчера не смог позаниматься."}]}],"usage":[{"id":"u1","sit":"Не пью, не курю, не ем","phrase":"술을 안 마셔요.","note":"Привычка или принцип — 안.","ex":[{"ko":"담배를 안 피워요.","ru":"Не курю."},{"ko":"저는 고기를 안 먹어요.","ru":"Я не ем мясо."}]},{"id":"u2","sit":"Не могу (обстоятельства)","phrase":"못 가요.","note":"Вежливый отказ: «не получится».","ex":[{"ko":"내일은 바빠요. 못 가요.","ru":"Завтра занят. Не смогу."},{"ko":"오늘은 못 만나요.","ru":"Сегодня не смогу встретиться."}]},{"id":"u3","sit":"Не умею","phrase":"운전 못 해요.","note":"Отсутствие навыка — 못. 하다-глагол — 못 между частями.","ex":[{"ko":"저는 요리를 못 해요.","ru":"Я не умею готовить."},{"ko":"친구는 운전을 못 해요.","ru":"Друг не умеет водить."}]},{"id":"u4","sit":"Совсем не","phrase":"술을 전혀 안 마셔요.","note":"전혀 — категорично.","ex":[{"ko":"담배를 전혀 안 피워요.","ru":"Совсем не курю."},{"ko":"운동을 전혀 안 해요.","ru":"Вообще не занимаюсь спортом."}]},{"id":"u5","sit":"Не особо","phrase":"별로 안 비싸요.","note":"Смягчённое отрицание.","ex":[{"ko":"별로 안 바빠요.","ru":"Не особо занят."},{"ko":"채소는 별로 안 먹어요.","ru":"Овощи ем не особо."}]},{"id":"u6","sit":"Не так уж сложно","phrase":"어렵지 않아요.","note":"-지 않다 — единственный способ с ㅂ-основами до темы 18.","ex":[{"ko":"한국어는 쉽지 않아요.","ru":"Корейский непростой."},{"ko":"이 책은 어렵지 않아요.","ru":"Эта книга несложная."}]},{"id":"u7","sit":"Привычки: часто / иногда / нет","phrase":"저는 운동을 자주 해요. 친구는 운동을 안 해요.","note":"자주, 가끔, 항상 — перед сказуемым.","ex":[{"ko":"청소를 가끔 해요.","ru":"Убираюсь иногда."},{"ko":"저는 항상 아침을 먹어요. 친구는 아침을 안 먹어요.","ru":"Я всегда завтракаю, а друг не завтракает."}]},{"id":"u8","sit":"Не сделал","phrase":"전화를 안 했어요.","note":"안 — не стал; 못 — не получилось.","ex":[{"ko":"어제 청소를 못 했어요.","ru":"Вчера не успел убраться."},{"ko":"아침을 안 먹었어요.","ru":"Не завтракал."}]},{"id":"u9","sit":"Отрицательный вопрос","phrase":"안 먹어요?","note":"네 — «верно, не ем»; 아니요 — «нет, ем».","ex":[{"ko":"술을 안 마셔요? — 네, 안 마셔요.","ru":"Не пьёшь? — Да, не пью."},{"ko":"담배를 안 피워요? — 아니요, 피워요.","ru":"Не куришь? — Нет, курю."}]},{"id":"u10","sit":"Не знаю, нет","phrase":"주소를 몰라요.","note":"모르다 и 없다 — не 안 알아요, не 안 있어요.","ex":[{"ko":"전화번호를 몰라요.","ru":"Не знаю номер телефона."},{"ko":"돈이 없어요.","ru":"Денег нет."}]}],"rel":[{"id":"안"},{"id":"못"},{"id":"-지 않다"},{"id":"아니에요"},{"id":"g1"},{"id":"g2"},{"id":"g5"},{"id":"g6"},{"id":"g18","label":"Тема 18: ㅂ-불규칙"},{"id":"g38","label":"Тема 38: 못 vs 안 — тонкости"},{"id":"g14"}],"new":["s9"]},{"id":"g14","n":14,"title":"Частицы 도, 만, 하고 / 와 / 과","meaning":"«Тоже», «только», «и», «с».\n**도** — «тоже, и»; **만** — «только». Обе встают на место 은/는, 이/가, 을/를, но после 에/에서 не вытесняют их: 방에도, 저녁에만.\n**하고** — «и» при перечислении и «с» при совместном действии. **와/과** — то же в письменной речи.","schema":[{"title":"도 / 만 вместо 은/는, 이/가, 을/를","cols":["Было","С 도","С 만"],"rows":[["저는","저도","저만"],["커피가","커피도","커피만"],["밥을","밥도","밥만"]],"note":"Старая частица исчезает: *저는도, *밥을만 — ошибка."},{"title":"После 에 / 에서 — сохраняются","cols":["Было","С 도","С 만"],"rows":[["방에","방에도","방에만"],["저녁에","저녁에도","저녁에만"],["회사에서","회사에서도","회사에서만"]],"note":"Проверка: если без 도/만 слово стояло с 에/에서 — они остаются."},{"title":"하고 / 와 / 과","cols":["Форма","Когда","Пример"],"rows":[["하고","всегда; разговорная","빵하고 우유 · 친구하고"],["와","после гласной; письменная","사과와 우유 · 친구와"],["과","после согласной; письменная","빵과 우유 · 선생님과"]],"note":"Выбор 와/과 обратный привычному: 받침 нет → 와, есть → 과."},{"title":"Два значения 하고","cols":["Значение","Пример"],"rows":[["«и» — перечисление","빵하고 우유를 샀어요."],["«с» — вместе","친구하고 영화를 봤어요."]],"note":"Различает глагол и смысл фразы."}],"sections":[{"id":"s1","title":"1. 도 — «тоже, и»","body":"도 добавляет элемент к уже сказанному: «и это тоже». 저도 학생이에요 — «я тоже студент».\nВстаёт на место 은/는, 이/가, 을/를: 저는 → 저도, 커피가 → 커피도, 밥을 → 밥도.\nСо словами времени без 에: 오늘도 바빠요 — «и сегодня занят».","ex":[{"ko":"저도 학생이에요.","ru":"Я тоже студент."},{"ko":"빵도 샀어요.","ru":"Хлеб тоже купил."},{"ko":"오늘도 바빠요.","ru":"И сегодня занят."}]},{"id":"s2","title":"2. Куда ставить 도","body":"도 цепляется к тому, что именно добавляется — от этого меняется смысл:\n**저도** 술을 안 마셔요 — «я тоже не пью» (как и ты).\n저는 **술도** 안 마셔요 — «я и алкоголь не пью» (кроме прочего).","ex":[{"ko":"저도 고기를 안 먹어요.","ru":"Я тоже не ем мясо."},{"ko":"저는 고기도 안 먹어요.","ru":"Я и мясо не ем."}]},{"id":"s3","title":"3. 도…도 — «и… и…» / «ни… ни…»","body":"Два 도 в одной фразе охватывают оба элемента.\nС утверждением — «и… и…»: 형도 누나도 있어요 — «есть и брат, и сестра».\nС отрицанием — «ни… ни…»: 남자도 여자도 몰라요 — «не знаю ни мужчину, ни женщину».","ex":[{"ko":"아버지도 어머니도 집에 없어요.","ru":"Дома нет ни отца, ни матери."},{"ko":"고기도 채소도 먹어요.","ru":"Ем и мясо, и овощи."}]},{"id":"s4","title":"4. 만 — «только»","body":"만 ограничивает: «только это, и ничего больше». 커피만 마셔요 — «пью только кофе».\nПравило замещения — как у 도: 저만, 커피만, 밥만.\nС числом и счётным: 한 개만 있어요 — «есть только одна штука».","ex":[{"ko":"저는 채소만 먹어요.","ru":"Я ем только овощи."},{"ko":"딸만 두 명 있어요.","ru":"У меня только две дочери."},{"ko":"물만 마셨어요.","ru":"Пил только воду."}]},{"id":"s5","title":"5. 도 / 만 после 에 и 에서","body":"Частицы места и времени 에, 에서 не вытесняются — 도 и 만 встают после них:\n방에도 책이 있어요 — «и в комнате есть книги».\n저녁에만 운동해요 — «занимаюсь спортом только вечером».\n집에서도 일해요 — «работаю и дома».\nПроверка: убрать 도/만 — если остаётся 에/에서, их нельзя терять.","ex":[{"ko":"방에도 책이 있어요.","ru":"В комнате тоже есть книги."},{"ko":"저녁에만 운동해요.","ru":"Занимаюсь только вечером."},{"ko":"회사에서도 커피를 마셔요.","ru":"И на работе пью кофе."}]},{"id":"s6","title":"6. 저도요 — «я тоже»","body":"Короткий ответ-согласие: 저도 + 요. 요 делает обрывок фразы вежливым.\nГодится на любое утверждение собеседника о себе: 저는 커피를 마셔요. — 저도요.\nОтрицание тоже можно поддержать: 술을 안 마셔요. — 저도요. «Я тоже не пью».","ex":[{"ko":"저는 학생이에요. — 저도요.","ru":"Я студент. — Я тоже."},{"ko":"커피를 마셔요. — 저도요.","ru":"Пью кофе. — Я тоже."}]},{"id":"s7","title":"7. 하고 — «и» и «с»","body":"**Перечисление**: 하고 ставится между элементами, частица падежа — только на последнем: 빵하고 우유를 샀어요 — «купил хлеб и молоко».\nМожно и больше двух: 아버지하고 어머니하고 동생.\n**Совместное действие**: N하고 + глагол — «с N»: 친구하고 영화를 봤어요 — «смотрел фильм с другом».\nВопрос: 누구하고 …? — «с кем?».\nОт 받침 не зависит. Разговорная форма.","ex":[{"ko":"빵하고 우유를 샀어요.","ru":"Купил хлеб и молоко."},{"ko":"누나하고 점심을 먹었어요.","ru":"Обедал со старшей сестрой."},{"ko":"누구하고 영화를 봤어요?","ru":"С кем смотрел фильм?"}]},{"id":"s8","title":"8. 와 / 과 — письменные","body":"Смысл как у 하고, регистр — письменный и официальный: книги, объявления, заголовки.\nВыбор обратный привычному: гласная → **와** (친구와), согласная → **과** (선생님과).\nСравни: 은/는, 이/가, 을/를 — после согласной форма длиннее; у 와/과 — наоборот, после гласной 와.","ex":[{"ko":"사과와 바나나","ru":"яблоки и бананы"},{"ko":"책과 신문","ru":"книги и газеты"},{"ko":"아내와 공원에 갔어요.","ru":"Ходил в парк с женой."}]},{"id":"s9","title":"9. Произношение","body":"После 받침 ㄱ, ㅂ, ㅅ, ㄷ звук 도 напрягается: 밥도 [밥또], 책도 [책또], 옷도 [옫또].\n만 после ㄱ, ㅂ уподобляет 받침: 밥만 [밤만], 책만 [챙만].","ex":[]}],"usage":[{"id":"u1","sit":"«Я тоже»","phrase":"저도요.","note":"Короткое согласие.","ex":[{"ko":"저는 한국어를 공부해요. — 저도요.","ru":"Я учу корейский. — Я тоже."},{"ko":"저도 의사예요.","ru":"Я тоже врач."}]},{"id":"u2","sit":"И это тоже","phrase":"빵도 샀어요.","note":"Добавить к списку.","ex":[{"ko":"우유를 샀어요. 계란도 샀어요.","ru":"Купил молоко. И яйца тоже."},{"ko":"고기도 먹어요.","ru":"И мясо ем."}]},{"id":"u3","sit":"Только","phrase":"커피만 마셔요.","note":"Ограничить выбор.","ex":[{"ko":"저는 채소만 먹어요.","ru":"Я ем только овощи."},{"ko":"사과가 한 개만 있어요.","ru":"Есть только одно яблоко."}]},{"id":"u4","sit":"Ни… ни…","phrase":"아버지도 어머니도 집에 없어요.","note":"도…도 + отрицание.","ex":[{"ko":"남자도 여자도 몰라요.","ru":"Не знаю ни его, ни её."},{"ko":"술도 담배도 안 해요.","ru":"Не пью и не курю."}]},{"id":"u5","sit":"И то, и другое","phrase":"형도 누나도 있어요.","note":"도…도 без отрицания.","ex":[{"ko":"아들도 딸도 있어요.","ru":"Есть и сын, и дочь."}]},{"id":"u6","sit":"Перечислить","phrase":"빵하고 우유를 샀어요.","note":"Частица 을/를 — только на последнем.","ex":[{"ko":"가족은 아버지하고 어머니하고 저예요.","ru":"Моя семья — отец, мать и я."},{"ko":"사과하고 바나나가 있어요.","ru":"Есть яблоки и бананы."}]},{"id":"u7","sit":"С кем","phrase":"친구하고 영화를 봤어요.","note":"하고 = «с». 만나다 — и 친구를 만나요, и 친구하고 만나요.","ex":[{"ko":"누구하고 점심을 먹었어요? — 누나하고 먹었어요.","ru":"С кем обедал? — С сестрой."},{"ko":"아내하고 공원에서 걸었어요.","ru":"Гулял с женой в парке."}]},{"id":"u8","sit":"Письменно","phrase":"아버지와 어머니","note":"와/과 — в тексте, объявлении, подписи.","ex":[{"ko":"선생님과 학생","ru":"учитель и ученик"},{"ko":"남편과 아내","ru":"муж и жена"}]},{"id":"u9","sit":"Там тоже / тогда тоже","phrase":"집에서도 일해요.","note":"에도, 에서도 — 에/에서 сохраняются.","ex":[{"ko":"저녁에도 운동해요.","ru":"И вечером занимаюсь."},{"ko":"방에도 의자가 있어요.","ru":"В комнате тоже есть стул."}]},{"id":"u10","sit":"Только там / только тогда","phrase":"저녁에만 운동해요.","note":"에만, 에서만.","ex":[{"ko":"회사에서만 커피를 마셔요.","ru":"Пью кофе только на работе."},{"ko":"아침에만 신문을 읽어요.","ru":"Читаю газету только утром."}]},{"id":"u11","sit":"Только один / только такие","phrase":"동생만 있어요.","note":"만 + наличие.","ex":[{"ko":"딸만 두 명 있어요.","ru":"У меня только две дочери."}]},{"id":"u12","sit":"И сегодня тоже","phrase":"오늘도 바빠요.","note":"Слова времени без 에 принимают 도 напрямую.","ex":[{"ko":"어제도 회사에 갔어요.","ru":"Вчера тоже ходил на работу."}]}],"rel":[{"id":"도"},{"id":"만"},{"id":"하고"},{"id":"와/과"},{"id":"g1"},{"id":"g3"},{"id":"g9"},{"id":"g13"}],"new":[],"parts":[{"id":"q1","title":"도 — «тоже, и»","intro":"**도** — «тоже, и»: добавляет ещё один элемент к уже сказанному.\nВстаёт на место 은/는, 이/가, 을/를: 저는 → 저도, 커피를 → 커피도.","schema":[],"sections":["s1","s2","s3","s6"],"usage":["u1","u2","u4","u5","u12"],"ex":[[{"ru":"Я тоже врач.","ko":"저도 의사예요.","alt":[],"u":"u1"},{"ru":"— Я служащий. — Я тоже (коротко).","ko":"저도요.","alt":[],"u":"u1"},{"ru":"У меня есть и старший брат, и младший брат (говорит мужчина).","ko":"형도 동생도 있어요.","alt":["저는 형도 동생도 있어요."],"u":"u5"},{"ru":"Я и сегодня занят.","ko":"저는 오늘도 바빠요.","alt":["오늘도 바빠요."],"u":"u12"},{"ru":"Дома нет ни собаки, ни кошки.","ko":"집에 개도 고양이도 없어요.","alt":["개도 고양이도 집에 없어요."],"u":"u4"}]]},{"id":"q2","title":"만 — «только»","intro":"**만** — «только»: ограничивает, «это и ничего больше».\nВстаёт на место 은/는, 이/가, 을/를 так же, как 도: 저만, 커피만.","schema":[],"sections":["s4"],"usage":["u3","u11"],"ex":[[{"ru":"Я пью только воду.","ko":"저는 물만 마셔요.","alt":["물만 마셔요."],"u":"u3"},{"ru":"У меня есть только дочь.","ko":"딸만 있어요.","alt":["저는 딸만 있어요."],"u":"u11"},{"ru":"Я купил только хлеб.","ko":"빵만 샀어요.","alt":["저는 빵만 샀어요."],"u":"u3"},{"ru":"Только я не знаю.","ko":"저만 몰라요.","alt":[],"u":"u11"},{"ru":"Младший брат ест только мясо.","ko":"동생은 고기만 먹어요.","alt":["동생이 고기만 먹어요."],"u":"u3"}]]},{"id":"q3","title":"도 и 만 после 에 / 에서","intro":"Обе частицы вытесняют 은/는, 이/가, 을/를, но **не** 에 и 에서: те остаются, а 도/만 встают после них — 방에도, 저녁에만, 회사에서도.","schema":[0,1],"sections":["s5","s9"],"usage":["u9","u10"],"ex":[[{"ru":"Я занимаюсь спортом только утром.","ko":"저는 아침에만 운동해요.","alt":["아침에만 운동해요."],"u":"u10"},{"ru":"Я читаю книги и в библиотеке тоже.","ko":"도서관에서도 책을 읽어요.","alt":["저는 도서관에서도 책을 읽어요."],"u":"u9"},{"ru":"И в комнате тоже есть компьютер.","ko":"방에도 컴퓨터가 있어요.","alt":[],"u":"u9"},{"ru":"Я пью кофе только в кафе.","ko":"카페에서만 커피를 마셔요.","alt":["저는 카페에서만 커피를 마셔요."],"u":"u10"},{"ru":"Вечером я тоже работаю.","ko":"저녁에도 일해요.","alt":["저는 저녁에도 일해요."],"u":"u9"}]]},{"id":"q4","title":"하고, 와/과 — «и», «с»","intro":"**하고** — «и» при перечислении и «с» при совместном действии, разговорное.\n**와/과** — то же в письменной речи; выбор по 받침.","schema":[2,3],"sections":["s7","s8"],"usage":["u6","u7","u8"],"ex":[[{"ru":"Я купил яблоки и бананы.","ko":"사과하고 바나나를 샀어요.","alt":["사과와 바나나를 샀어요."],"u":"u6"},{"ru":"Вчера я смотрел фильм с женой.","ko":"어제 아내하고 영화를 봤어요.","alt":["어제 아내와 영화를 봤어요."],"u":"u7"},{"ru":"Я ем мясо и овощи.","ko":"고기하고 채소를 먹어요.","alt":["고기와 채소를 먹어요."],"u":"u6"},{"ru":"Я работаю с начальником.","ko":"사장님하고 일해요.","alt":["사장님과 일해요."],"u":"u7"},{"ru":"Учитель и ученик в библиотеке.","ko":"선생님과 학생이 도서관에 있어요.","alt":["선생님하고 학생이 도서관에 있어요."],"u":"u8"}]]}],"allEx":[[{"ru":"Младший брат тоже студент.","ko":"동생도 학생이에요.","alt":[],"u":"u1"},{"ru":"Я пил только чай.","ko":"저는 차만 마셨어요.","alt":["차만 마셨어요."],"u":"u3"},{"ru":"Дедушка и бабушка в парке.","ko":"할아버지하고 할머니가 공원에 있어요.","alt":["할아버지와 할머니가 공원에 있어요."],"u":"u6"},{"ru":"Я работаю и вечером.","ko":"저녁에도 일해요.","alt":["저는 저녁에도 일해요."],"u":"u9"},{"ru":"В магазине нет ни хлеба, ни молока.","ko":"가게에 빵도 우유도 없어요.","alt":[],"u":"u4"},{"ru":"Я встретил только соседа.","ko":"이웃만 만났어요.","alt":["저는 이웃만 만났어요."],"u":"u11"},{"ru":"Я тоже не пью алкоголь.","ko":"저도 술을 안 마셔요.","alt":["저도 술을 마시지 않아요."],"u":"u2"},{"ru":"Я готовлю с мамой.","ko":"엄마하고 요리해요.","alt":["엄마와 요리해요."],"u":"u7"}]]},{"id":"pr1","n":14.5,"short":"П1","label":"Практикум 1","norev":true,"open":false,"title":"Живые ситуации на темах 1–14","meaning":"Практикум — не новая грамматика, а сборка пройденного в реальные ситуации: знакомство, «кто и что где есть», магазин, кафе, договорённость, номера и адрес, разговор о дне, отказ.\nЗаодно отрабатываются модели тем 1–14, которые были в теории, но не тренировались: **N은/는요?**, **누가 / 뭐가 있어요?**, выпадение частиц (**우유 있어요?**, **커피 마셔요**, **어디 가요?**), **여기 있어요**, **에서 «из»**, **좋아요**, **알았어요**, **뭐 해요? / 뭐 했어요?**, **-지 못하다**.\nОдна новая функция: **해요-форма как предложение и указание** — различается интонацией и ситуацией.\nФормулы этикета — целиком и только в своей ситуации.","schema":[{"title":"Знакомство: вопрос → ответ","cols":["Вопрос","Ответ"],"rows":[["이름이 뭐예요?","지민이에요. · 저는 지민이에요."],["어디에서 왔어요?","러시아에서 왔어요."],["어디 사람이에요?","러시아 사람이에요."],["학생이에요?","네, 학생이에요. · 아니요, 회사원이에요."],["몇 살이에요?","서른 살이에요."],["선생님은요?","встречный вопрос «а вы?»"]],"note":"러시아 — Россия (не изучено, для знакомства)."},{"title":"누구 / 뭐 — по роли в фразе","cols":["Роль","누구","뭐"],"rows":[["«кто это? / что это?»","누구예요?","뭐예요?"],["подлежащее + 있어요","누가 있어요?","뭐가 있어요?"],["дополнение","누구를 만났어요?","뭐 먹어요?"]],"note":"누구 + 가 → 누가 (не *누구가). 뭐 + 가 → 뭐가."},{"title":"Магазин: цепочка","cols":["Кто","Фраза","Смысл"],"rows":[["продавец","어서 오세요.","добро пожаловать"],["покупатель","우유 있어요?","молоко есть?"],["продавец","네, 여기 있어요.","да, вот"],["покупатель","얼마예요?","сколько стоит?"],["продавец","천오백 원이에요.","1 500 вон"],["покупатель","여기 있어요. · 감사합니다.","вот (деньги) · спасибо"],["покупатель","안녕히 계세요.","до свидания (уходя)"]],"note":"여기 있어요 — «вот, пожалуйста», когда протягиваешь вещь или деньги."},{"title":"Кафе: цепочка","cols":["Момент","Фраза"],"rows":[["позвать","여기요!"],["заказать","커피 두 잔하고 빵 하나 주세요."],["«мне то же»","저도요."],["перед едой","잘 먹겠습니다."],["оценка","맛있어요!"],["после еды","잘 먹었습니다."]],"note":"В заказе 을/를 не нужна: 커피 주세요."},{"title":"Три функции 해요-формы","cols":["Интонация / ситуация","Функция","Пример"],"rows":[["ровная, о себе","сообщение","공원에 가요. «иду в парк»"],["ровная, собеседнику","предложение","공원에 가요! «пойдём в парк»"],["восходящая","вопрос-предложение","커피 마셔요? «выпьем кофе?»"],["ровная, от старшего","мягкое указание","여기에 이름을 써요. «пишите здесь имя»"]],"note":"Форма одна; смысл задают ситуация и интонация."},{"title":"Номера","cols":["Что","Как читать","Пример"],"rows":[["телефон","по цифрам, 0 = 공","010-3857 → 공일공 삼팔오칠"],["этаж","한자어 + 층","5층 → 오 층"],["номер комнаты","целым числом 한자어","207 → 이백칠"],["вопрос","몇 + счётное","몇 층? · 몇 번?"]],"note":"Дефис в телефоне читается паузой или звуком [에]. Комнату, квартиру в жизни чаще называют через 호: 305호 — 삼백오 호."},{"title":"Вопросы о дне","cols":["Вопрос","Смысл","Ответ"],"rows":[["뭐 해요?","что делаешь?","책을 읽어요."],["뭐 했어요?","что делал?","영화를 봤어요."],["어디 가요?","куда идёшь?","회사에 가요."]],"note":"В вопросе 을/를 и 에 опускаются; в ответе обычно стоят."},{"title":"Отказ и незнание","cols":["Смысл","Форма","Пример"],"rows":[["не знаю","모르다","몰라요. (не *안 알아요)"],["не делаю (по своей воле)","안 + глагол","술 안 마셔요."],["не могу","못 + глагол","내일 못 가요."],["не могу (книжно)","-지 못하다","가지 못해요."],["нет, спасибо","괜찮아요","아니요, 괜찮아요."]],"note":"Отказ старшему смягчают: 죄송합니다. 내일 못 가요."}],"sections":[{"id":"s1","title":"1. Схема знакомства","body":"Порядок: приветствие → имя → откуда → чем занимаешься → (возраст) → «рад знакомству».\nФормально при первой встрече: 처음 뵙겠습니다 в начале, 반갑습니다 в конце.\nИмя: 이름이 뭐예요? — 지민이에요 / 저는 지민이에요.\nПрофессия — вопросом-догадкой через 이다: 학생이에요? — 아니요, 의사예요.\nВозраст: 몇 살이에요? — 서른 살이에요 (고유어 + 살). В Корее спрашивают без неловкости: от возраста зависит вежливость.","ex":[{"ko":"처음 뵙겠습니다. 저는 민수예요.","ru":"Впервые вас вижу. Я Минсу."},{"ko":"이름이 뭐예요? — 지민이에요.","ru":"Как вас зовут? — Чжимин."},{"ko":"몇 살이에요? — 스물다섯 살이에요.","ru":"Сколько вам лет? — Двадцать пять."}]},{"id":"s2","title":"2. N은/는요? — «а вы?»","body":"Встречный вопрос без повтора сказуемого: «а как насчёт N?». 은/는 — тема, 요 — вежливость.\nСлов «ты / вы» в вежливой речи избегают: к собеседнику обращаются по статусу (선생님은요?, 사장님은요?) или по имени.\nРаботает и с вещами: 이것은 빵이에요. 저것은요? — «а вон то?».","ex":[{"ko":"저는 학생이에요. 선생님은요?","ru":"Я студент. А вы?"},{"ko":"저는 커피를 마셔요. 사장님은요?","ru":"Я пью кофе. А вы?"},{"ko":"이것은 우유예요. 저것은요?","ru":"Это молоко. А вон то?"}]},{"id":"s3","title":"3. 에서 — «из, от»","body":"에서 с глаголами движения 오다/가다 значит исходную точку: «из».\n어디에서 왔어요? — «откуда вы (приехали)?»: прошедшее, потому что человек уже приехал. Ответ: 러시아에서 왔어요.\nВ настоящем — «приезжает из»: 친구가 한국에서 와요.\nВариант вопроса о национальности: 어디 사람이에요? — 러시아 사람이에요.","ex":[{"ko":"어디에서 왔어요? — 러시아에서 왔어요.","ru":"Откуда вы? — Из России."},{"ko":"선생님은 한국에서 왔어요.","ru":"Учитель приехал из Кореи."},{"ko":"어디 사람이에요? — 한국 사람이에요.","ru":"Вы откуда? — Кореец."}]},{"id":"s4","title":"4. 누가 있어요? — «кто есть?»","body":"누구 + 가 сливаются в **누가** (не *누구가). 누가 있어요? — «кто есть / кто находится?»: про людей в месте.\n방에 누가 있어요? — «кто в комнате?». Ответ — с 이/가: 동생이 있어요.\nЭто НЕ «кто там?» у двери — для двери есть отдельная формула (позже).\n누구 без 가 остаётся в 누구예요? «кто это?» и как дополнение: 누구를 만났어요?","ex":[{"ko":"방에 누가 있어요? — 동생이 있어요.","ru":"Кто в комнате? — Младший брат."},{"ko":"학교에 누가 있어요? — 선생님이 있어요.","ru":"Кто в школе? — Учитель."},{"ko":"저 사람은 누구예요?","ru":"Кто тот человек?"}]},{"id":"s5","title":"5. 뭐가 있어요? — «что есть?»","body":"뭐 + 가 → **뭐가**. Спрашивают про содержимое, ассортимент, меню: 가방에 뭐가 있어요?\nОтвет — перечисление с 하고 и 이/가 на последнем: 빵하고 우유가 있어요.\n«Ничего нет» — пока просто 없어요 / N이/가 없어요.","ex":[{"ko":"가방에 뭐가 있어요? — 책이 있어요.","ru":"Что в сумке? — Книга."},{"ko":"집에 뭐가 있어요? — 빵하고 우유가 있어요.","ru":"Что есть дома? — Хлеб и молоко."}]},{"id":"s6","title":"6. Выпадение 이/가","body":"В живой речи 이/가 часто выпадает, особенно в магазине и кафе: 우유 있어요? вместо 우유가 있어요?\nОба варианта верны; в письме частицу сохраняют.\nНе выпадает в вопросах 누가 / 뭐가 — там она часть слова.","ex":[{"ko":"우유 있어요?","ru":"Молоко есть?"},{"ko":"주스 있어요? — 네, 있어요.","ru":"Сок есть? — Да."}]},{"id":"s7","title":"7. 얼마예요? и цены","body":"얼마예요? — «сколько стоит?». С предметом: 이 가방은 얼마예요? (в речи и 이 가방 얼마예요?).\nЦена — 한자어 + 원, разряды по 만: 15 000 → 만 오천 원, 30 000 → 삼만 원, 1 500 → 천오백 원.\nЕдиницу перед 백/천/만 не произносят: 만 원, не *일만 원.","ex":[{"ko":"이 우산은 얼마예요? — 만 오천 원이에요.","ru":"Сколько стоит этот зонт? — 15 000 вон."},{"ko":"커피는 얼마예요? — 사천 원이에요.","ru":"Сколько стоит кофе? — 4 000 вон."}]},{"id":"s8","title":"8. 여기 있어요 — «вот, пожалуйста»","body":"Буквально «здесь есть». Говорят, протягивая вещь или деньги: продавец — товар, покупатель — деньги.\nКороткий синоним — 여기요 (у него есть и второе значение: подозвать официанта).","ex":[{"ko":"우유 있어요? — 네, 여기 있어요.","ru":"Молоко есть? — Да, вот, пожалуйста."},{"ko":"얼마예요? — 삼천 원이에요. — 여기 있어요.","ru":"Сколько? — 3 000 вон. — Вот, пожалуйста."}]},{"id":"s9","title":"9. Покупка и заказ: N 주세요","body":"Формула просьбы: N 주세요 — «дайте N / N, пожалуйста». 을/를 перед 주세요 обычно опускают.\nС количеством: N + число + счётное + 주세요: 사과 두 개 주세요, 커피 한 잔 주세요.\nНесколько позиций — через 하고: 커피 두 잔하고 빵 하나 주세요.\n**Без счётного слова** — исконное число в полной форме: 빵 하나, 사과 둘, 사과 셋 (не 한/두/세 — усечённые формы только перед счётным). Смысл тот же, что с 개: 빵 하나 = 빵 한 개.\nМожно: предметы (где счётное — 개), малые числа, разговор, заказ и покупка.\nНельзя опускать: счётное — единица меры (커피 두 잔 — порции) или 한자어-единица (천 원, 삼 층): с 한자어 числом счётное обязательно всегда. Для книг, животных, людей (세 권, 두 마리, 두 명) счётное — норма; в живой речи бывает и 고양이 둘, 친구 둘, но в заданиях пиши со счётным.","ex":[{"ko":"사과 세 개 주세요.","ru":"Три яблока, пожалуйста."},{"ko":"커피 두 잔하고 주스 한 잔 주세요.","ru":"Два кофе и один сок, пожалуйста."},{"ko":"물 주세요.","ru":"Воды, пожалуйста."}]},{"id":"s10","title":"10. Выпадение 을/를: когда можно, когда нет","body":"В разговорной речи 을/를 часто опускают. Полная форма с частицей всегда правильна — опускать никогда не обязательно.\n**Можно опустить:**\n· дополнение стоит вплотную перед глаголом: 커피 마셔요, 밥 먹었어요, 영화 봤어요;\n· короткие бытовые вопросы: 뭐 해요?, 뭐 마셔요?, 뭐 먹었어요?;\n· просьба с 주세요: 물 주세요, 커피 두 잔 주세요;\n· 하다-глаголы: 공부해요 = 공부를 해요 (частица появляется, только когда именную часть отделяют).\n**Лучше оставить:**\n· письмо, официальная речь;\n· между дополнением и глаголом стоят другие слова: 커피를 아침에 두 잔 마셨어요;\n· в фразе два существительных-участника и без частиц неясно, кто кого: 민수가 지민을 만났어요;\n· дополнение выделено по смыслу («именно кофе»): 커피를 마셨어요, 차는 안 마셨어요.\n**Не путать:** 도, 만, 은/는 вытесняют 을/를 — это не выпадение, а замена: 커피도 마셔요.\nВ упражнениях принимается и полный вариант, и вариант без частицы там, где выпадение естественно. Эталон может показывать один из них — отличие от эталона в этом месте не ошибка.","ex":[{"ko":"뭐 마셔요? — 커피 마셔요.","ru":"Что пьёшь? — Кофе."},{"ko":"커피를 아침에 두 잔 마셨어요.","ru":"Утром выпил две чашки кофе. (частица нужна: между 커피 и глаголом другие слова)"},{"ko":"민수가 지민을 만났어요.","ru":"Минсу встретил Чжимин. (без частиц неясно, кто кого)"}]},{"id":"s11","title":"11. Реплики за столом","body":"**저도요** — «я тоже»: и «мне то же самое» при заказе.\n**맛있어요** — «вкусно»; с вопросом 맛있어요? — «вкусно?».\n**잘 먹겠습니다** — перед едой, **잘 먹었습니다** — после; говорит сам едящий тому, кто готовил или угощает.","ex":[{"ko":"커피 한 잔 주세요. — 저도요.","ru":"Один кофе, пожалуйста. — Мне тоже."},{"ko":"맛있어요? — 네, 아주 맛있어요.","ru":"Вкусно? — Да, очень."}]},{"id":"s12","title":"12. 해요 как предложение","body":"해요-форма, сказанная собеседнику о совместном действии, звучит как предложение: 공원에 가요! — «пойдём в парк!».\nС восходящей интонацией — вопрос-предложение: 커피 마셔요? — «выпьем кофе?».\n«Вместе с кем-то» — через 하고: 저하고 영화를 봐요 — «посмотри фильм со мной / давай посмотрим».\nОтдельные формы предложения (-(으)ㅂ시다, -(으)ㄹ까요?) — тема 26.","ex":[{"ko":"내일 공원에 가요! — 좋아요.","ru":"Пойдём завтра в парк! — Давай."},{"ko":"커피 마셔요? — 네, 좋아요.","ru":"Выпьем кофе? — Да, давай."},{"ko":"저하고 점심을 먹어요.","ru":"Давай пообедаем со мной."}]},{"id":"s13","title":"13. 해요 как указание","body":"От старшего к младшему, от учителя, врача, сотрудника — ровная 해요-форма звучит как мягкое указание: 여기에 이름을 써요 — «пишите здесь имя».\nВежливая просьба -(으)세요 — тема 25; пока указание только слышим и выполняем.","ex":[{"ko":"여기에 이름을 써요. — 네, 알았어요.","ru":"Пишите здесь имя. — Да, понял."},{"ko":"여기에서 기다려요.","ru":"Ждите здесь."}]},{"id":"s14","title":"14. Отклики: 좋아요, 알았어요","body":"**좋아요** — «хорошо, давай, отлично»: согласие на предложение.\n**알았어요** — «понял, принято» на просьбу или указание. Не «знал»! Вежливее и официальнее — 알겠습니다.\n«Знаю» — 알아요, «не знаю» — 몰라요.","ex":[{"ko":"내일 만나요. — 좋아요!","ru":"Встретимся завтра. — Отлично!"},{"ko":"내일 아침에 전화해요. — 네, 알았어요.","ru":"Позвони завтра утром. — Да, понял."},{"ko":"여기에서 기다려요. — 알겠습니다.","ru":"Ждите здесь. — Хорошо."}]},{"id":"s15","title":"15. Телефон","body":"전화번호가 뭐예요? / 전화번호가 몇 번이에요? — «какой номер телефона?».\nЧитают по цифрам 한자어, ноль — 공: 010-3857-2064 → 공일공 삼팔오칠 이공육사.\nДефис — пауза или звук [에].","ex":[{"ko":"전화번호가 뭐예요? — 공일공 삼팔오칠 이공육사예요.","ru":"Какой номер? — 010-3857-2064."},{"ko":"전화번호가 몇 번이에요?","ru":"Какой у вас номер телефона?"}]},{"id":"s16","title":"16. Этаж, комната, адрес","body":"Этаж: 한자어 + 층. 몇 층이에요? — 오 층이에요. «Где?» — N은/는 몇 층에 있어요?\nНомер комнаты — целым числом: 방 번호가 이백칠이에요.\n**В жизни** для комнат, квартир и гостиничных номеров обычно говорят счётное **호** («номер» помещения): 삼백오 호예요, 몇 호예요? — отсюда надписи 305호 на дверях. **번** — скорее номер по порядку: очередь, место в списке, автобус. 호 будет в ближайшей словарной теме; пока в упражнениях — 번.\nАдрес: 주소가 뭐예요? Записать — 주소를 써요.","ex":[{"ko":"식당은 몇 층이에요? — 이 층이에요.","ru":"На каком этаже столовая? — На втором."},{"ko":"방 번호가 몇 번이에요? — 삼백오 번이에요.","ru":"Какой номер комнаты? — 305."},{"ko":"주소가 뭐예요?","ru":"Какой адрес?"}]},{"id":"s17","title":"17. 뭐 해요? / 뭐 했어요?","body":"**뭐 해요?** — «что делаешь?» (сейчас, обычно). 뭐 без 를 — устойчиво.\n**뭐 했어요?** — «что делал?». Со словами времени: 어제 뭐 했어요?, 저녁에 뭐 해요?\nОтвет — полный глагол, частицы в ответе обычно есть: 책을 읽어요, 친구를 만났어요.","ex":[{"ko":"지금 뭐 해요? — 책을 읽어요.","ru":"Что сейчас делаешь? — Читаю."},{"ko":"어제 뭐 했어요? — 친구를 만났어요.","ru":"Что делал вчера? — Встретился с другом."},{"ko":"저녁에 뭐 해요? — 운동해요.","ru":"Что делаешь вечером? — Занимаюсь спортом."}]},{"id":"s18","title":"18. 어디 가요? — «куда идёшь?»","body":"В вопросе 에 опускается: 어디 가요? (полное 어디에 가요? тоже верно).\nЧастый вопрос при встрече знакомых — почти приветствие.\nОтвет с 에: 회사에 가요, 집에 가요.","ex":[{"ko":"어디 가요? — 도서관에 가요.","ru":"Куда идёшь? — В библиотеку."},{"ko":"어제 어디 갔어요? — 공원에 갔어요.","ru":"Куда ходил вчера? — В парк."}]},{"id":"s19","title":"19. Не знаю","body":"«Не знаю» — только **몰라요** (от 모르다). *안 알아요 — ошибка.\nПро человека, место, номер: 전화번호를 몰라요, 도서관이 어디예요? — 몰라요.","ex":[{"ko":"도서관이 어디예요? — 몰라요.","ru":"Где библиотека? — Не знаю."},{"ko":"주소를 몰라요.","ru":"Не знаю адрес."}]},{"id":"s20","title":"20. Не буду / не могу","body":"**안** — не делаю по своей воле: 술 안 마셔요.\n**못** — хочу, но не получается: 내일 못 가요.\n**-지 못하다** — длинная форма 못, смысл тот же, звучит книжнее/официальнее: 가지 못해요 = 못 가요.\nОтказ старшему смягчают извинением: 죄송합니다. 내일 못 가요.","ex":[{"ko":"죄송합니다. 내일 못 가요.","ru":"Извините, завтра не смогу прийти."},{"ko":"어제 운동하지 못했어요.","ru":"Вчера не смог позаниматься."},{"ko":"저는 담배를 안 피워요.","ru":"Я не курю."}]},{"id":"s21","title":"21. Вежливый отказ: 괜찮아요","body":"На предложение (кофе, помощь) — **아니요, 괜찮아요**: «нет, спасибо, не нужно».\nТа же фраза — «ничего» на извинение и «не за что» на благодарность.","ex":[{"ko":"커피 마셔요? — 아니요, 괜찮아요.","ru":"Выпьешь кофе? — Нет, спасибо."},{"ko":"죄송합니다. — 괜찮아요.","ru":"Извините. — Ничего."}]}],"usage":[{"id":"u1","sit":"Спросить имя","phrase":"이름이 뭐예요?","note":"Ответ — имя + 이에요/예요.","ex":[{"ko":"이름이 뭐예요? — 민수예요.","ru":"Как вас зовут? — Минсу."}]},{"id":"u2","sit":"«А вы?»","phrase":"선생님은요?","note":"N은/는요? — вернуть вопрос. Обращение по статусу или имени.","ex":[{"ko":"저는 학생이에요. 선생님은요?","ru":"Я студент. А вы?"},{"ko":"저는 서른 살이에요. 지민은요?","ru":"Мне тридцать. А Чжимин?"}]},{"id":"u3","sit":"Откуда вы?","phrase":"어디에서 왔어요?","note":"에서 = «из». Прошедшее — уже приехал.","ex":[{"ko":"어디에서 왔어요? — 러시아에서 왔어요.","ru":"Откуда вы? — Из России."}]},{"id":"u4","sit":"Профессия","phrase":"회사원이에요?","note":"Вопрос-догадка через 이다; ответ 네 / 아니요 + профессия.","ex":[{"ko":"의사예요? — 아니요, 회사원이에요.","ru":"Вы врач? — Нет, служащий."}]},{"id":"u5","sit":"Возраст","phrase":"몇 살이에요?","note":"고유어 + 살.","ex":[{"ko":"몇 살이에요? — 서른 살이에요.","ru":"Сколько вам лет? — Тридцать."}]},{"id":"u6","sit":"Кто есть в месте","phrase":"방에 누가 있어요?","note":"누구 + 가 → 누가. Не «кто там?» у двери.","ex":[{"ko":"집에 누가 있어요? — 할머니가 있어요.","ru":"Кто дома? — Бабушка."}]},{"id":"u7","sit":"Что есть","phrase":"가방에 뭐가 있어요?","note":"뭐 + 가 → 뭐가: содержимое, ассортимент.","ex":[{"ko":"가게에 뭐가 있어요? — 빵하고 우유가 있어요.","ru":"Что есть в магазине? — Хлеб и молоко."}]},{"id":"u8","sit":"Есть ли товар","phrase":"우유 있어요?","note":"이/가 в речи выпадает.","ex":[{"ko":"주스 있어요? — 네, 있어요.","ru":"Сок есть? — Да."}]},{"id":"u9","sit":"Цена","phrase":"이 가방은 얼마예요?","note":"Ответ — 한자어 + 원.","ex":[{"ko":"이 우산은 얼마예요? — 만 원이에요.","ru":"Сколько стоит зонт? — 10 000 вон."}]},{"id":"u10","sit":"«Вот, пожалуйста»","phrase":"여기 있어요.","note":"Протягивая вещь или деньги. Синоним — 여기요.","ex":[{"ko":"책 있어요? — 네, 여기 있어요.","ru":"Книга есть? — Да, вот."}]},{"id":"u11","sit":"Купить / заказать","phrase":"사과 두 개 주세요.","note":"N + число + счётное + 주세요; позиции через 하고.","ex":[{"ko":"커피 한 잔하고 빵 하나 주세요.","ru":"Один кофе и один хлеб, пожалуйста."}]},{"id":"u12","sit":"Позвать официанта","phrase":"여기요!","note":"В кафе и ресторане.","ex":[{"ko":"여기요! 물 주세요.","ru":"Извините! Воды, пожалуйста."}]},{"id":"u13","sit":"«Я тоже / мне тоже»","phrase":"저도요.","note":"Согласие и «мне то же» при заказе.","ex":[{"ko":"저는 차 마셔요. — 저도요.","ru":"Я пью чай. — Я тоже."}]},{"id":"u14","sit":"Вкусно","phrase":"맛있어요.","note":"Оценка; с вопросом — «вкусно?».","ex":[{"ko":"이 빵은 아주 맛있어요.","ru":"Этот хлеб очень вкусный."}]},{"id":"u15","sit":"Без 을/를","phrase":"커피 마셔요.","note":"Выпадение винительной частицы в речи.","ex":[{"ko":"뭐 먹어요? — 밥 먹어요.","ru":"Что ешь? — Рис."}]},{"id":"u16","sit":"Предложить","phrase":"내일 공원에 가요!","note":"해요 собеседнику о совместном действии = «пойдём».","ex":[{"ko":"저하고 영화를 봐요.","ru":"Давай посмотрим фильм (со мной)."}]},{"id":"u17","sit":"Предложить вопросом","phrase":"커피 마셔요?","note":"Восходящая интонация = «выпьем?».","ex":[{"ko":"점심 먹어요? — 네, 좋아요.","ru":"Пообедаем? — Да, давай."}]},{"id":"u18","sit":"Указание","phrase":"여기에 이름을 써요.","note":"От старшего / сотрудника: мягкое «пишите».","ex":[{"ko":"여기에서 기다려요.","ru":"Ждите здесь."}]},{"id":"u19","sit":"«Хорошо, давай!»","phrase":"좋아요.","note":"Согласие на предложение.","ex":[{"ko":"공원에 가요! — 좋아요!","ru":"Пойдём в парк! — Давай!"}]},{"id":"u20","sit":"«Понял»","phrase":"알았어요.","note":"На просьбу или указание. Вежливее — 알겠습니다.","ex":[{"ko":"여기에 이름을 써요. — 네, 알았어요.","ru":"Пишите здесь имя. — Да, понял."}]},{"id":"u21","sit":"Телефон","phrase":"전화번호가 뭐예요?","note":"Ответ по цифрам, 0 = 공.","ex":[{"ko":"전화번호가 뭐예요? — 공일공 이삼사오 육칠팔구예요.","ru":"Какой номер? — 010-2345-6789."}]},{"id":"u22","sit":"Этаж","phrase":"식당은 몇 층이에요?","note":"한자어 + 층.","ex":[{"ko":"도서관은 몇 층이에요? — 삼 층이에요.","ru":"На каком этаже библиотека? — На третьем."}]},{"id":"u23","sit":"Номер комнаты","phrase":"방 번호가 몇 번이에요?","note":"Целым числом 한자어. В жизни чаще 몇 호예요? — 이백칠 호예요 (호 — счётное для комнат и квартир; будет в словарной теме).","ex":[{"ko":"방 번호가 몇 번이에요? — 이백칠 번이에요.","ru":"Какой номер комнаты? — 207."}]},{"id":"u24","sit":"Адрес","phrase":"주소가 뭐예요?","note":"","ex":[{"ko":"주소가 뭐예요? — 여기에 써요.","ru":"Какой адрес? — Пишите здесь."}]},{"id":"u25","sit":"Что делаешь?","phrase":"지금 뭐 해요?","note":"뭐 без 를.","ex":[{"ko":"저녁에 뭐 해요? — 청소해요.","ru":"Что делаешь вечером? — Убираюсь."}]},{"id":"u26","sit":"Что делал?","phrase":"어제 뭐 했어요?","note":"Ответ — прошедшее.","ex":[{"ko":"오늘 뭐 했어요? — 한국어를 공부했어요.","ru":"Что делал сегодня? — Учил корейский."}]},{"id":"u27","sit":"Куда идёшь?","phrase":"어디 가요?","note":"에 в вопросе выпадает; в ответе есть.","ex":[{"ko":"어디 가요? — 집에 가요.","ru":"Куда идёшь? — Домой."}]},{"id":"u28","sit":"Не знаю","phrase":"몰라요.","note":"Не *안 알아요.","ex":[{"ko":"전화번호를 몰라요.","ru":"Не знаю номер телефона."}]},{"id":"u29","sit":"Не смогу","phrase":"죄송합니다. 내일 못 가요.","note":"못 + извинение — мягкий отказ.","ex":[{"ko":"오늘 못 만나요.","ru":"Сегодня не смогу встретиться."}]},{"id":"u30","sit":"Не смог (книжно)","phrase":"가지 못해요.","note":"-지 못하다 = 못 + глагол.","ex":[{"ko":"어제 운동하지 못했어요.","ru":"Вчера не смог позаниматься."}]},{"id":"u31","sit":"Нет, спасибо","phrase":"아니요, 괜찮아요.","note":"Отказ от предложения.","ex":[{"ko":"주스 마셔요? — 아니요, 괜찮아요.","ru":"Сока? — Нет, спасибо."}]},{"id":"u32","sit":"Не делаю","phrase":"술 안 마셔요.","note":"안 — по своей воле.","ex":[{"ko":"저는 고기를 안 먹어요.","ru":"Я не ем мясо."}]}],"rel":[{"id":"g1"},{"id":"g2"},{"id":"g3"},{"id":"g4"},{"id":"g6"},{"id":"g9"},{"id":"g10"},{"id":"g11"},{"id":"g12"},{"id":"g13"},{"id":"g14"}],"new":[],"parts":[{"id":"q1","title":"Знакомство","intro":"Первая встреча: приветствие, имя, откуда, кто по профессии, возраст.\nНовое: встречный вопрос **N은/는요?** («а вы?») и **에서 = «из»**: 어디에서 왔어요?","schema":[0],"sections":["s1","s2","s3"],"usage":["u1","u2","u3","u4","u5"],"unflag":["g1:u13","g3:s8","은/는:u4","에서:u2"],"ex":[[{"ru":"(Знакомишься) Как вас зовут?","ko":"이름이 뭐예요?","alt":["이름은 뭐예요?"],"traps":[{"a":"이름이 누구예요?","why":"Об имени спрашивают 뭐: 이름이 뭐예요? 누구 — «кто»."}],"u":"u1"},{"ru":"(Спрашиваешь учителя) Мне тридцать. А вам?","ko":"(저는) 서른 살이에요. 선생님은요?","alt":[],"traps":[{"a":"서른 살이에요. 선생님도요?","why":"도 — «тоже». «А вы?» — 은/는요."},{"a":"서른 살이에요. 너는요?","why":"«Ты / вы» в вежливой речи не говорят — обращаются по статусу или имени."}],"u":"u2"},{"ru":"Откуда вы?","ko":"[어디에서|어디서] 왔어요?","alt":[],"traps":[{"a":"어디에 왔어요?","why":"에 — «куда». «Откуда» — 에서: 어디에서 왔어요?"},{"a":"어디에서 와요?","why":"О происхождении — прошедшее: человек уже приехал. 어디에서 왔어요?"}],"u":"u3"},{"ru":"Я из Кореи.","ko":"(저는) 한국에서 왔어요.","alt":["(저는) 한국 사람이에요."],"traps":[{"a":"저는 한국에 왔어요.","why":"한국에 왔어요 — «приехал в Корею». «Из» — 에서: 한국에서 왔어요."}],"u":"u3"},{"ru":"— Вы врач? — Нет, я служащий.","ko":"의사예요? — 아니요, (저는) 회사원이에요.","alt":[],"traps":[{"a":"의사예요? — 아니요, 의사 아니에요, 회사원예요.","why":"회사원 кончается на согласную → 이에요."}],"u":"u4"}]]},{"id":"q2","title":"Кто и что где есть","intro":"Вопросы о наличии с вопросительным словом в роли подлежащего: **누가 있어요?** «кто есть?», **뭐가 있어요?** «что есть?».\n누구 + 가 → 누가, 뭐 + 가 → 뭐가.","schema":[1],"sections":["s4","s5"],"usage":["u6","u7"],"unflag":["g2:s6","g2:u9","g2:u10","이/가:u4"],"ex":[[{"ru":"Кто в комнате?","ko":"방에 누가 있어요?","alt":["누가 방에 있어요?"],"u":"u6"},{"ru":"— Кто в школе? — Учитель.","ko":"학교에 누가 있어요? — 선생님이 있어요.","alt":["학교에 누가 있어요? — 선생님이요."],"u":"u6"},{"ru":"Что в сумке?","ko":"가방에 뭐가 있어요?","alt":["뭐가 가방에 있어요?"],"u":"u7"},{"ru":"— Что есть дома? — Хлеб и молоко.","ko":"집에 뭐가 있어요? — 빵하고 우유가 있어요.","alt":["집에 뭐가 있어요? — 빵과 우유가 있어요."],"u":"u7"},{"ru":"Кто тот человек (вон там)?","ko":"저 사람은 누구예요?","alt":["저 사람이 누구예요?"],"u":"u6"}]]},{"id":"q3","title":"Магазин","intro":"Покупка от входа до выхода: 어서 오세요 → **우유 있어요?** (이/가 выпадает) → 얼마예요? → 주세요 → **여기 있어요** «вот, пожалуйста» → 안녕히 계세요.","schema":[2],"sections":["s6","s7","s8","s9"],"usage":["u8","u9","u10","u11"],"unflag":["g2:s6","g2:u11"],"ex":[[{"ru":"(В магазине.) Молоко есть?","ko":"우유(가) 있어요?","alt":[],"u":"u8"},{"ru":"Сколько стоит эта сумка?","ko":"이 가방은 얼마예요?","alt":["이 가방 얼마예요?","이 가방이 얼마예요?"],"u":"u9"},{"ru":"(Продавец отвечает.) Пятнадцать тысяч вон.","ko":"만 오천 원이에요.","alt":[],"u":"u9"},{"ru":"(Протягиваешь деньги.) Вот, пожалуйста.","ko":"여기 있어요.","alt":["여기요."],"u":"u10"},{"ru":"Два яблока, пожалуйста.","ko":"사과(를) 두 개 주세요.","alt":[],"u":"u11"}]]},{"id":"q4","title":"Кафе","intro":"Заказ и реплики за столом: 여기요 → заказ с **하고** и счётными → **저도요** → 잘 먹겠습니다 → **맛있어요** → 잘 먹었습니다.\nВ бытовых фразах **을/를 выпадает**: 커피 마셔요.","schema":[3],"sections":["s9","s10","s11"],"usage":["u12","u11","u13","u14","u15"],"unflag":["g3:s8"],"ex":[[{"ru":"(В кафе, зовёшь официанта.) Извините!","ko":"여기요!","alt":[],"u":"u12"},{"ru":"Два кофе и один сок, пожалуйста.","ko":"커피 두 잔하고 주스 한 잔 주세요.","alt":["커피 두 잔과 주스 한 잔 주세요."],"u":"u11"},{"ru":"— Я пью чай. — Я тоже.","ko":"차 마셔요. — 저도요.","alt":["저는 차 마셔요. — 저도요.","저는 차를 마셔요. — 저도요."],"u":"u13"},{"ru":"Этот хлеб очень вкусный.","ko":"이 빵은 아주 맛있어요.","alt":["이 빵 아주 맛있어요.","이 빵이 아주 맛있어요."],"u":"u14"},{"ru":"(Друг угощает, ты приступаешь к еде.) Спасибо, приступаю.","ko":"잘 먹겠습니다.","alt":[],"u":"u14"}]]},{"id":"q5","title":"Договориться","intro":"**해요-форма как предложение и указание**: 공원에 가요! — «пойдём в парк»; 여기에 이름을 써요 — «пишите здесь имя». Различает ситуация и интонация.\nОтклики: **좋아요** «давай», **알았어요** «понял» (вежливее — 알겠습니다).","schema":[4],"sections":["s12","s13","s14"],"usage":["u16","u17","u18","u19","u20"],"unflag":["g4:u7","g6:u9","g3:u14"],"ex":[[{"ru":"(Предлагаешь другу.) Пойдём завтра в парк!","ko":"내일 공원에 가요!","alt":["내일 공원에 가요."],"u":"u16"},{"ru":"(Друг соглашается.) Давай, отлично!","ko":"좋아요!","alt":["네, 좋아요!"],"u":"u19"},{"ru":"(Учитель ученику.) Пишите здесь имя.","ko":"여기에 이름(을) 써요.","alt":["이름을 여기에 써요."],"u":"u18"},{"ru":"(Отвечаешь на указание.) Да, понял.","ko":"네, 알았어요.","alt":["네, 알겠습니다."],"u":"u20"},{"ru":"(Предлагаешь коллеге, с вопросительной интонацией.) Выпьем кофе?","ko":"커피(를) 마셔요?","alt":[],"u":"u17"}]]},{"id":"q6","title":"Номера и адрес","intro":"Телефон — по цифрам, 0 = **공**; этаж и комната — целым числом 한자어; вопросы **몇 번 / 몇 층**; 주소.","schema":[5],"sections":["s15","s16"],"usage":["u21","u22","u23","u24"],"unflag":[],"ex":[[{"ru":"Какой у вас номер телефона?","ko":"전화번호가 뭐예요?","alt":["전화번호가 몇 번이에요?"],"u":"u21"},{"ru":"Номер телефона — 010-3857-2064.","ko":"전화번호는 공일공 삼팔오칠 이공육사예요.","alt":["공일공 삼팔오칠 이공육사예요.","전화번호는 공일공에 삼팔오칠에 이공육사예요."],"u":"u21"},{"ru":"На каком этаже столовая?","ko":"식당은 몇 층이에요?","alt":["식당이 몇 층이에요?","식당은 몇 층에 있어요?"],"u":"u22"},{"ru":"Библиотека на пятом этаже.","ko":"도서관은 오 층이에요.","alt":["도서관은 오 층에 있어요.","도서관이 오 층에 있어요."],"u":"u22"},{"ru":"Какой адрес?","ko":"주소가 뭐예요?","alt":["주소는 뭐예요?"],"u":"u24"}]]},{"id":"q7","title":"Разговор о дне","intro":"Самые частые бытовые вопросы: **뭐 해요?**, **뭐 했어요?**, **어디 가요?** В вопросах 을/를 и 에 выпадают, в ответах обычно стоят.","schema":[6],"sections":["s17","s18"],"usage":["u25","u26","u27"],"unflag":["g3:u1","g3:s8","g6:u1","g9:u2"],"ex":[[{"ru":"Что ты сейчас делаешь?","ko":"지금 뭐 해요?","alt":[],"u":"u25"},{"ru":"Что делал вчера вечером?","ko":"어제 저녁에 뭐 했어요?","alt":[],"u":"u26"},{"ru":"— Куда идёшь? — В библиотеку.","ko":"어디(에) 가요? — 도서관에 가요.","alt":[],"u":"u27"},{"ru":"Утром убирался. Вечером смотрел фильм.","ko":"아침에 청소했어요. 저녁에 영화를 봤어요.","alt":["아침에 청소를 했어요. 저녁에 영화를 봤어요."],"u":"u26"},{"ru":"Что делаешь вечером?","ko":"저녁에 뭐 해요?","alt":[],"u":"u25"}]]},{"id":"q8","title":"Отказ и незнание","intro":"«Не знаю» — **몰라요**; «не буду» — **안**; «не могу» — **못** и длинная форма **-지 못하다**; «нет, спасибо» — **괜찮아요**; смягчение — 죄송합니다.","schema":[7],"sections":["s19","s20","s21"],"usage":["u28","u29","u30","u31","u32"],"unflag":["g13:s9"],"ex":[[{"ru":"— Где библиотека? — Не знаю.","ko":"도서관이 어디예요? — 몰라요.","alt":["도서관은 어디예요? — 몰라요."],"u":"u28"},{"ru":"(Отказываешься от предложенного кофе.) Нет, спасибо.","ko":"아니요, 괜찮아요.","alt":[],"u":"u31"},{"ru":"(Извиняешься перед старшим.) Извините, завтра не смогу пойти.","ko":"죄송합니다. 내일 못 가요.","alt":["죄송합니다. 내일 가지 못해요."],"u":"u29"},{"ru":"Сегодня не смог позаниматься спортом. (длинной формой отрицания)","ko":"오늘 운동하지 못했어요.","alt":[],"u":"u30","strict":true},{"ru":"Я не курю.","ko":"저는 담배(를) 안 피워요.","alt":["담배 안 피워요.","저는 담배를 피우지 않아요."],"u":"u32"}]]}],"allEx":[[{"ru":"(Первая встреча, формально.) Впервые вас вижу. Рад знакомству.","ko":"처음 뵙겠습니다. 반갑습니다.","alt":[],"u":"u1"},{"ru":"Сколько вам лет?","ko":"몇 살이에요?","alt":[],"u":"u5"},{"ru":"Мне тридцать. А вам? (спрашиваешь начальника)","ko":"서른 살이에요. 사장님은요?","alt":["저는 서른 살이에요. 사장님은요?"],"u":"u2"},{"ru":"Кто в кафе?","ko":"카페에 누가 있어요?","alt":["누가 카페에 있어요?"],"u":"u6"},{"ru":"(В магазине.) Сок есть?","ko":"주스(가) 있어요?","alt":[],"u":"u8"},{"ru":"Один чай и один хлеб, пожалуйста.","ko":"차 한 잔하고 빵 하나 주세요.","alt":["차 한 잔하고 빵 한 개 주세요."],"u":"u11"},{"ru":"(Предлагаешь другу.) Давай посмотрим фильм!","ko":"영화(를) 봐요!","alt":[],"u":"u16"},{"ru":"Что делал сегодня?","ko":"오늘 뭐 했어요?","alt":[],"u":"u26"}],[{"ru":"— Откуда вы? — Из Кореи.","ko":"어디에서 왔어요? — 한국에서 왔어요.","alt":["어디서 왔어요? — 한국에서 왔어요."],"u":"u3"},{"ru":"Что есть в комнате?","ko":"방에 뭐가 있어요?","alt":["뭐가 방에 있어요?"],"u":"u7"},{"ru":"Сколько стоит этот зонт?","ko":"이 우산은 얼마예요?","alt":["이 우산 얼마예요?","이 우산이 얼마예요?"],"u":"u9"},{"ru":"(Протягиваешь книгу.) Вот, пожалуйста.","ko":"여기 있어요.","alt":["여기요."],"u":"u10"},{"ru":"(После еды у друга дома.) Спасибо, было вкусно.","ko":"잘 먹었습니다.","alt":[],"u":"u14"},{"ru":"На каком этаже фирма?","ko":"회사는 몇 층이에요?","alt":["회사가 몇 층이에요?","회사는 몇 층에 있어요?"],"u":"u22"},{"ru":"— Куда идёшь? — Домой.","ko":"어디(에) 가요? — 집에 가요.","alt":[],"u":"u27"},{"ru":"Я не знаю адрес.","ko":"주소(를) 몰라요.","alt":["저는 주소를 몰라요."],"u":"u28"}]]},{"id":"g15","n":15,"title":"Частицы 에게/한테, 부터/까지, 의 (+ 제/내)","meaning":"«Кому», «с… до…», «чей».\n**에게 / 한테** — адресат действия: кому дают, звонят, говорят; к кому идут; у кого что-то находится. Только люди и животные; места и организации — 에.\n**부터 / 까지** — границы во времени: 아침부터 저녁까지. О месте «от» — **에서**: 집에서 회사까지.\n**의** — «чей»: 친구의 이름. В речи чаще опускается (친구 이름) и звучит как [에]. 저의 → **제**, 나의 → **내**; заодно 저 + 가 → **제가**.","schema":[{"title":"Кому / куда: 에게, 한테, 에","cols":["Частица","Кому / чему","Пример"],"rows":[["에게","человеку, животному · нейтрально, письменно","친구에게 · 고양이에게"],["한테","то же · разговорно","친구한테 · 엄마한테"],["에","месту, организации","회사에 · 학교에"]],"note":"От 받침 не зависят. 친구에 전화해요 — ошибка: к человеку — 에게/한테."},{"title":"부터 / 까지","cols":["","«с, от»","«до»"],"rows":[["время","아침부터 · 오늘부터","저녁까지 · 내일까지"],["место","집에서 · 여기에서","회사까지 · 공원까지"]],"note":"부터/까지 встают на место 에: 아침부터, не 아침에부터. «От» места — 에서."},{"title":"의 и слияния с 저 / 나","cols":["Полная","В речи","Значение"],"rows":[["친구의 이름","친구 이름 [친구 이름]","имя друга"],["저의 가방","제 가방","моя сумка (вежл.)"],["나의 가방","내 가방","моя сумка (разг.)"],["저 + 가","제가","я (подлежащее, вежл.)"],["나 + 가","내가","я (подлежащее, разг.)"]],"note":"저 가방 — «вон та сумка», не «моя»."},{"title":"Цепочки с 도 / 만","cols":["Основа","+ 도","+ 만"],"rows":[["엄마한테","엄마한테도 — и маме","엄마한테만 — только маме"],["내일까지","내일까지도","내일까지만 — только до завтра"]],"note":"Как 에/에서: 한테, 에게, 까지 не вытесняются. 엄마도 전화했어요 — «мама тоже позвонила»."}],"sections":[{"id":"s1","title":"1. 에게 / 한테 — «кому»","body":"Отмечает того, **кому** направлено действие: дать, позвонить, сказать.\n친구에게 책을 줬어요 — «дал книгу другу». Предмет — с 을/를, получатель — с 에게.\n**에게** — нейтральная, книжная, в речи звучит официальнее. **한테** — разговорная, в живой речи основная. Смысл один, от 받침 не зависят.\nК уважаемому лицу в книжной речи — 께 (тема 44); пока 선생님한테 / 선생님에게 — нормально.","ex":[{"ko":"친구에게 책을 줬어요.","ru":"Я дал другу книгу."},{"ko":"엄마한테 전화해요.","ru":"Звоню маме."},{"ko":"선생님한테 말했어요.","ru":"Я сказал учителю."}]},{"id":"s2","title":"2. Люди и животные — 에게; места — 에","body":"에게/한테 — только для **живых**: людей и животных (고양이한테 물을 줘요).\nК месту, фирме, школе — **에**: 회사에 전화해요 — «звоню в фирму».\nОшибка в обе стороны: 친구에 전화해요, 회사한테 전화해요.","ex":[{"ko":"고양이한테 밥을 줘요.","ru":"Даю кошке еду."},{"ko":"회사에 전화했어요.","ru":"Позвонил в фирму."}]},{"id":"s3","title":"3. К кому идти, у кого находится","body":"С 가다/오다 한테 значит «к человеку»: 친구한테 가요 — «иду к другу». К месту — 에: 친구 집에 가요 («домой к другу»).\nС 있다/없다 한테 — «у кого (при ком) находится»: 우산은 동생한테 있어요 — «зонт у младшего брата». 지금 저한테 돈이 없어요 — «у меня сейчас (при себе) нет денег».","ex":[{"ko":"할머니한테 가요.","ru":"Иду к бабушке."},{"ko":"책은 저한테 있어요.","ru":"Книга у меня."}]},{"id":"s4","title":"4. 저한테 — «мне»","body":"저 + 한테 = 저한테 (저에게) — «мне»: 저한테 주세요 — «дайте мне». 저한테 전화해요 — «позвоните мне» (해요 как просьба).\nЕсли и так ясно, кому, — «мне» в корейском опускают: в кафе просто 커피 주세요.","ex":[{"ko":"저한테 주세요.","ru":"Дайте мне, пожалуйста."},{"ko":"내일 저한테 전화해요.","ru":"Позвоните мне завтра."}]},{"id":"s5","title":"5. 부터 / 까지 — время","body":"**부터** — «с, начиная с», **까지** — «до». Часто парой: 아침부터 저녁까지 — «с утра до вечера».\nВстают **на место 에**: 아침에 → 아침부터, 저녁에 → 저녁까지. Слова без 에 (오늘, 내일, 지금) принимают их напрямую: 오늘부터, 내일까지, 지금부터.\nМожно и по одной: 내일부터 운동해요 — «со завтра занимаюсь спортом»; 밤까지 일했어요 — «работал до ночи».\nВремя по часам и даты — тема 16.","ex":[{"ko":"아침부터 저녁까지 일해요.","ru":"Работаю с утра до вечера."},{"ko":"오늘부터 담배를 안 피워요.","ru":"С сегодняшнего дня не курю."},{"ko":"어제 밤까지 공부했어요.","ru":"Вчера учился до ночи."}]},{"id":"s6","title":"6. 에서 … 까지 — место","body":"О месте «от» — **에서** (уже знакомая частица «из, от»), «до» — **까지**: 집에서 회사까지 걸어요 — «иду пешком от дома до фирмы».\n까지 и здесь встаёт на место 에: 공원까지 걸었어요, не 공원에까지.\n부터 с местом в речи встречается (집부터), но обычная пара — 에서 … 까지.","ex":[{"ko":"집에서 회사까지 걸어요.","ru":"От дома до фирмы хожу пешком."},{"ko":"여기에서 공원까지 걸었어요.","ru":"Отсюда до парка шёл пешком."}]},{"id":"s7","title":"7. 부터 — «сначала, начиная с»","body":"부터 после предмета или занятия — «начиная с этого, сначала это»: 밥부터 먹어요 — «сначала поем». 이것부터 해요 — «начнём с этого».\n부터 замещает 을/를: 밥을 → 밥부터 (не 밥을부터).","ex":[{"ko":"밥부터 먹어요.","ru":"Сначала поем."},{"ko":"청소부터 해요.","ru":"Сначала уберусь."}]},{"id":"s8","title":"8. 의 — «чей»","body":"N1의 N2 — «N2 того, кто N1»: 친구의 이름 — «имя друга», 선생님의 책 — «книга учителя».\n**В речи 의 обычно опускают**, просто ставя слова рядом: 친구 이름, 회사 주소, 형 방. Полная форма — в письме и при подчёркивании.\nПорядок обратный русскому: владелец впереди. 이름 친구 — «друг Имя», бессмыслица.\nНе путать с 에: 친구에 이름 — ошибка, хотя 의 и звучит как [에].","ex":[{"ko":"친구 이름이 뭐예요?","ru":"Как зовут твоего друга?"},{"ko":"선생님의 책이에요.","ru":"Это книга учителя."},{"ko":"회사 주소를 몰라요.","ru":"Не знаю адрес фирмы."}]},{"id":"s9","title":"9. Как читается 의","body":"Частица 의 в обычной речи — **[에]**: 친구의 [친구에]. Допустимо и [의], но так говорят медленно, читая.\nСравни с правилами слова: в начале слова — [의] (의사), не в начале — [이] (회의). Частица — отдельный случай.","ex":[{"ko":"친구의 가방","ru":"сумка друга [친구에 가방]"}]},{"id":"s10","title":"10. 제 / 내 — «мой»","body":"저의 → **제**, 나의 → **내**: 제 이름, 제 가방, 내 친구. Полные 저의, 나의 — письменные, в речи почти не звучат.\n제 — к старшим и незнакомым (вежливо, как 저). 내 — в разговоре с близкими (как 나).\n**저 + существительное** = «вон тот»: 저 가방 — «вон та сумка». «Моя» — только 제 가방.\nО своей семье корейцы чаще говорят «наш» (우리 — позже); 제 동생, 제 남편, 제 아내 — нормально.","ex":[{"ko":"제 이름은 민수예요.","ru":"Меня зовут Минсу (имя)."},{"ko":"이것은 제 가방이에요.","ru":"Это моя сумка."},{"ko":"내 친구가 왔어요.","ru":"Мой друг пришёл (разг.)."}]},{"id":"s11","title":"11. 누구 — «чей»","body":"Вопрос «чей?» — 누구(의) + существительное: 누구 가방이에요? — «чья сумка?». В речи 의 опускают.\n누가 — это 누구 + 가, «кто» как подлежащее; «чей» так не выражается: 누가 가방 — ошибка.","ex":[{"ko":"이것은 누구 가방이에요?","ru":"Чья это сумка?"},{"ko":"누구 우산이에요? — 제 우산이에요.","ru":"Чей зонт? — Мой."}]},{"id":"s12","title":"12. 제가 / 내가 — «я» с 이/가","body":"С частицей 이/가 저 и 나 меняют форму: 저 + 가 → **제가**, 나 + 가 → **내가**. 저가, 나가 — ошибка.\nНужно там, где требуется 이/가: в ответе на 누가? — 누가 청소했어요? — 제가 했어요. Коротко — **제가요**.\nНе путать: **제** — «мой», **제가** — «я» (подлежащее).","ex":[{"ko":"누가 전화했어요? — 제가 했어요.","ru":"Кто звонил? — Я."},{"ko":"누가 빵을 샀어요? — 제가요.","ru":"Кто купил хлеб? — Я."}]},{"id":"s13","title":"13. Цепочки: 한테도, 한테만, 까지만","body":"도 и 만 не вытесняют 에게/한테 и 까지 — встают после них, как после 에/에서:\n엄마한테**도** 전화했어요 — «и маме позвонил»; 아내한테**만** 말했어요 — «сказал только жене»; 내일까지**만** 일해요 — «работаю только до завтра».\nПотеря частицы меняет роль: 엄마도 전화했어요 — «мама тоже позвонила», 아내만 말했어요 — «только жена сказала».\nПорядок фиксирован: 까지만, не 만까지.","ex":[{"ko":"엄마한테도 전화했어요.","ru":"И маме позвонил."},{"ko":"아내한테만 말했어요.","ru":"Сказал только жене."},{"ko":"내일까지만 일해요.","ru":"Работаю только до завтра."}]},{"id":"s14","title":"14. 의 + 한테: «моему другу»","body":"Частицы складываются цепочкой по своим ролям: 제 친구한테 전화해요 — «звоню моему другу» (제 — чей, 한테 — кому).\n친구 집에서 학교까지 — «от дома друга до школы».","ex":[{"ko":"제 친구한테 전화했어요.","ru":"Позвонил моему другу."},{"ko":"제 동생 방이 작아요.","ru":"Комната моего младшего брата маленькая."}]}],"usage":[{"id":"u1","sit":"Дать кому-то","phrase":"친구한테 책을 줬어요.","note":"Кому — 한테/에게, что — 을/를.","ex":[{"ko":"손님한테 커피를 줬어요.","ru":"Дал гостю кофе."},{"ko":"선생님이 학생에게 책을 줬어요.","ru":"Учитель дал ученику книгу."}]},{"id":"u2","sit":"Позвонить человеку / в место","phrase":"엄마한테 전화해요.","note":"Человеку — 한테; в фирму, школу — 에.","ex":[{"ko":"누구한테 전화했어요?","ru":"Кому звонил?"},{"ko":"식당에 전화했어요.","ru":"Позвонил в ресторан."}]},{"id":"u3","sit":"Сказать кому-то","phrase":"선생님한테 말했어요.","note":"","ex":[{"ko":"아내한테 말했어요.","ru":"Сказал жене."},{"ko":"엄마한테 말해요!","ru":"Скажи маме!"}]},{"id":"u4","sit":"Пойти к человеку","phrase":"친구한테 가요.","note":"К человеку — 한테; к месту — 에 (친구 집에).","ex":[{"ko":"할머니는 이웃한테 갔어요.","ru":"Бабушка пошла к соседке."}]},{"id":"u5","sit":"У кого вещь","phrase":"우산은 동생한테 있어요.","note":"한테 있어요 — «находится у / при ком».","ex":[{"ko":"책은 어디에 있어요? — 저한테 있어요.","ru":"Где книга? — У меня."},{"ko":"지금 저한테 돈이 없어요.","ru":"У меня сейчас (с собой) нет денег."}]},{"id":"u6","sit":"«Мне»","phrase":"저한테 주세요.","note":"Если и так ясно — «мне» опускают.","ex":[{"ko":"내일 저한테 전화해요.","ru":"Позвоните мне завтра."}]},{"id":"u7","sit":"Животным","phrase":"고양이한테 물을 줘요.","note":"Животные — тоже 에게/한테.","ex":[{"ko":"개한테 고기를 줬어요.","ru":"Дал собаке мяса."}]},{"id":"u8","sit":"С… до… (время)","phrase":"아침부터 저녁까지 일해요.","note":"Вместо 에, не после него.","ex":[{"ko":"아침부터 점심까지 공부했어요.","ru":"Учился с утра до обеда."},{"ko":"저녁부터 밤까지 영화를 봤어요.","ru":"С вечера до ночи смотрел фильмы."}]},{"id":"u9","sit":"Начиная с","phrase":"내일부터 운동해요.","note":"Решение, новая привычка.","ex":[{"ko":"오늘부터 물만 마셔요.","ru":"С сегодняшнего дня пью только воду."},{"ko":"지금부터 공부해요.","ru":"С этого момента учусь."}]},{"id":"u10","sit":"До какого момента","phrase":"내일까지 바빠요.","note":"Срок, конец действия.","ex":[{"ko":"친구가 저녁까지 기다렸어요.","ru":"Друг ждал до вечера."},{"ko":"내일까지 해요.","ru":"Сделайте до завтра."}]},{"id":"u11","sit":"Откуда докуда","phrase":"집에서 회사까지 걸어요.","note":"Место «от» — 에서.","ex":[{"ko":"아이가 집에서 학교까지 걸어요.","ru":"Ребёнок ходит пешком от дома до школы."}]},{"id":"u12","sit":"До какого места","phrase":"공원까지 걸었어요.","note":"까지 без 에.","ex":[{"ko":"카페까지 걸어요.","ru":"До кафе иду пешком."}]},{"id":"u13","sit":"Сначала это","phrase":"밥부터 먹어요.","note":"부터 вместо 을/를.","ex":[{"ko":"이것부터 해요.","ru":"Начнём с этого."},{"ko":"커피부터 마셔요.","ru":"Сначала выпью кофе."}]},{"id":"u14","sit":"Чьё","phrase":"친구 이름이 뭐예요?","note":"의 в речи обычно опускают.","ex":[{"ko":"형 방은 작아요.","ru":"Комната старшего брата маленькая."},{"ko":"회사 주소를 알아요?","ru":"Знаете адрес фирмы?"}]},{"id":"u15","sit":"Моё (вежливо)","phrase":"제 이름은 민수예요.","note":"제 = 저의. 저 가방 — «вон та сумка».","ex":[{"ko":"여기는 제 방이에요.","ru":"Это моя комната."},{"ko":"제 우산이 어디에 있어요?","ru":"Где мой зонт?"}]},{"id":"u16","sit":"Моё (разговорно)","phrase":"내 친구예요.","note":"내 = 나의; с близкими.","ex":[{"ko":"이것은 내 책이에요.","ru":"Это моя книга."}]},{"id":"u17","sit":"Чьё?","phrase":"누구 가방이에요?","note":"누구(의), не 누가.","ex":[{"ko":"누구 커피예요? — 제 커피예요.","ru":"Чей кофе? — Мой."}]},{"id":"u18","sit":"Кто? — Я.","phrase":"제가 했어요.","note":"저 + 가 → 제가. Коротко — 제가요.","ex":[{"ko":"누가 청소했어요? — 제가요.","ru":"Кто убирался? — Я."}]},{"id":"u19","sit":"И ему тоже","phrase":"엄마한테도 전화했어요.","note":"한테 + 도. Без 한테 — «мама тоже».","ex":[{"ko":"동생한테도 돈을 줬어요.","ru":"И младшему дал денег."}]},{"id":"u20","sit":"Только ему","phrase":"아내한테만 말했어요.","note":"한테 + 만.","ex":[{"ko":"고양이한테만 물을 줬어요.","ru":"Воды дал только кошке."}]},{"id":"u21","sit":"Только до","phrase":"내일까지만 일해요.","note":"까지 + 만.","ex":[{"ko":"점심까지만 커피를 마셔요.","ru":"Кофе пью только до обеда."}]},{"id":"u22","sit":"Моему / чьему-то","phrase":"제 친구한테 전화해요.","note":"의-группа + 한테.","ex":[{"ko":"제 아들한테 책을 줬어요.","ru":"Дал книгу моему сыну."}]}],"rel":[{"id":"에게/한테"},{"id":"부터"},{"id":"까지"},{"id":"의"},{"id":"에"},{"id":"에서"},{"id":"도"},{"id":"만"},{"id":"g2"},{"id":"g3"},{"id":"g9"},{"id":"g14"},{"id":"g16","label":"Тема 16: время"},{"id":"g44","label":"Тема 44: 께"}],"new":[],"open":true,"parts":[{"id":"q1","title":"에게 / 한테 — «кому»","intro":"**에게 / 한테** — тот, кому направлено действие: дать, позвонить, сказать; к кому идти; у кого вещь.\nТолько люди и животные. Места и фирмы — **에**: 회사에 전화해요.","schema":[0],"sections":["s1","s2","s3","s4"],"usage":["u1","u2","u3","u4","u5","u6","u7"],"ex":[[{"ru":"Я дал другу книгу.","ko":"친구[한테|에게] 책(을) 줬어요.","alt":["책(을) 친구[한테|에게] 줬어요."],"traps":[{"a":"친구에 책을 줬어요.","why":"Человеку и животному — 에게/한테; 에 — к месту. 친구한테."},{"a":"친구를 책을 줬어요.","why":"Кому — 에게/한테, не 을/를: 친구한테 책을."}],"u":"u1"},{"ru":"Я звоню маме.","ko":"[엄마|어머니][한테|에게] 전화해요.","alt":["[엄마|어머니][한테|에게] 전화(를) 해요."],"traps":[{"a":"엄마에 전화해요.","why":"Человеку и животному — 에게/한테; 에 — к месту. 엄마한테."},{"a":"엄마를 전화해요.","why":"Звонить кому — 에게/한테: 엄마한테 전화해요."}],"u":"u2"},{"ru":"Я звоню в фирму.","ko":"회사에 전화해요.","alt":["회사에 전화(를) 해요."],"traps":[{"a":"회사에게 전화해요.","why":"К месту, фирме — 에; 에게/한테 — только к людям и животным."},{"a":"회사한테 전화해요.","why":"К месту, фирме — 에; 에게/한테 — только к людям и животным."}],"u":"u2"},{"ru":"Дайте мне, пожалуйста.","ko":"저[한테|에게] 주세요.","alt":[],"traps":[{"a":"저에 주세요.","why":"«Мне» — 저한테 / 저에게."},{"a":"저를 주세요.","why":"저를 — «меня». «Мне» — 저한테."}],"u":"u6"},{"ru":"Зонт у младшего брата.","ko":"우산[은|이] 동생[한테|에게] 있어요.","alt":["동생[한테|에게] 우산(이) 있어요."],"traps":[{"a":"우산은 동생에 있어요.","why":"У человека — 한테/에게 있어요; 에 — в месте."}],"u":"u5"}],[{"ru":"Я дал кошке воды.","ko":"고양이[한테|에게] 물(을) 줬어요.","alt":[],"traps":[{"a":"고양이에 물을 줬어요.","why":"Животным — тоже 에게/한테: 고양이한테."}],"u":"u7"},{"ru":"Я иду к другу.","ko":"친구[한테|에게] 가요.","alt":["친구(의) 집에 가요."],"traps":[{"a":"친구에 가요.","why":"К человеку — 한테/에게: 친구한테 가요. 에 — к месту (친구 집에)."}],"u":"u4"},{"ru":"Кому вы позвонили?","ko":"누구[한테|에게] 전화했어요?","alt":[],"traps":[{"a":"누구에 전화했어요?","why":"Кому — 누구한테 / 누구에게."},{"a":"누구를 전화했어요?","why":"Звонить кому — 누구한테."}],"u":"u2"},{"ru":"(Просишь коллегу) Позвоните мне завтра.","ko":"내일 저[한테|에게] 전화해요.","alt":["내일 저[한테|에게] 전화(를) 주세요."],"traps":[{"a":"내일 저에 전화해요.","why":"«Мне» — 저한테 / 저에게."},{"a":"내일 저를 전화해요.","why":"Звонить кому — 저한테."}],"u":"u6"},{"ru":"Я сказал жене.","ko":"아내[한테|에게] 말했어요.","alt":[],"traps":[{"a":"아내에 말했어요.","why":"Человеку и животному — 에게/한테; 에 — к месту. 아내한테."}],"u":"u3"}]]},{"id":"q2","title":"부터 / 까지 — «с… до…»","intro":"**부터** — «с», **까지** — «до». Встают на место 에: 아침부터, 저녁까지.\nО месте «от» — **에서**: 집에서 회사까지. 부터 после предмета — «сначала»: 밥부터 먹어요.","schema":[1],"sections":["s5","s6","s7"],"usage":["u8","u9","u10","u11","u12","u13"],"ex":[[{"ru":"Я работаю с утра до вечера.","ko":"아침부터 저녁까지 일해요.","alt":[],"traps":[{"a":"아침에부터 저녁에까지 일해요.","why":"부터/까지 встают на место 에: 아침부터, 저녁까지."},{"a":"아침에서 저녁까지 일해요.","why":"Со времени — 부터; 에서 «от» — о месте."}],"u":"u8"}, 저녁부터, 밤까지."}],"u":"u8"},{"ru":"Я и младшему дал денег.","ko":"동생[한테|에게]도 돈(을) 줬어요.","alt":[],"traps":[{"a":"동생도 돈을 줬어요.","why":"동생도 — «брат тоже дал». «И брату» — 동생한테도."}],"u":"u19"}]]}],"morphs":[{"id":"은/는","kind":"particle","forms":[{"c":"после согласной","f":"은","ex":"선생님은 · 이것은 · 책은"},{"c":"после гласной","f":"는","ex":"저는 · 친구는 · 여기는"}],"func":"Тематическая частица. Помечает то, о чём дальше будет сказано («что касается X…»). При сопоставлении двух тем даёт контраст — русское «а». Тему можно опустить, если она ясна из ситуации.","usage":[{"id":"u1","sit":"Представиться","phrase":"저는 학생이에요.","note":"Тема — говорящий. В продолжении разговора 저는 опускают.","ex":[]},{"id":"u2","sit":"Спросить о предмете","phrase":"이것은 뭐예요?","note":"Тема — предмет, о котором спрашивают.","ex":[{"ko":"저 사람은 누구예요?","ru":"Кто вон тот человек?"}]},{"id":"u3","sit":"Противопоставить","phrase":"저는 학생이에요. 친구는 선생님이에요.","note":"Две темы рядом — «а».","ex":[{"ko":"이것은 차예요. 저것은 커피예요.","ru":"Это чай, а вон то — кофе."}]},{"id":"u4","sit":"Вернуть вопрос","phrase":"선생님은요?","note":"N은/는요? — «а как насчёт N?».","ex":[]}],"ex":[{"ko":"여기는 학교예요.","ru":"Здесь школа."},{"ko":"친구는 한국 사람이에요.","ru":"Друг — кореец."}],"topic":1,"rel":[{"id":"이/가","label":"이/가 · тема 2"},{"id":"도","label":"도 · тема 14"},{"id":"만","label":"만 · тема 14"},{"id":"g2"},{"id":"g4"}],"new":["u4"]},{"id":"이에요/예요","kind":"ending","forms":[{"c":"после согласной","f":"이에요","ex":"학생이에요 · 책이에요 · 물이에요"},{"c":"после гласной","f":"예요","ex":"친구예요 · 커피예요 · 뭐예요"}],"func":"Связка 이다, 해요-форма, настоящее время. Прирастает к существительному: «является X». Работает и с вопросительными словами (뭐예요, 누구예요, 어디예요), и с 여기/거기/저기. Вопрос — та же форма с подъёмом тона.","usage":[{"id":"u1","sit":"Что / кто / где","phrase":"뭐예요? 누구예요? 어디예요?","note":"Вопросительное слово + связка.","ex":[{"ko":"학교는 어디예요?","ru":"Где школа?"}]},{"id":"u2","sit":"Ответ одним словом","phrase":"빵이에요.","note":"Тема ясна из вопроса — остаётся только сказуемое.","ex":[{"ko":"이것은 뭐예요? — 빵이에요.","ru":"Что это? — Хлеб."}]},{"id":"u3","sit":"Указать место","phrase":"저기예요.","note":"여기예요 «здесь», 거기예요 «там (у тебя)», 저기예요 «вон там».","ex":[{"ko":"식당은 어디예요? — 저기예요.","ru":"Где ресторан? — Вон там."}]},{"id":"u4","sit":"Прошедшее (тема 8)","phrase":"학생이었어요. / 친구였어요.","note":"이 + 었 → 이었; после гласной → 였.","ex":[]}],"ex":[{"ko":"저는 학생이에요.","ru":"Я студент."},{"ko":"선생님이에요?","ru":"Вы учитель?"}],"topic":1,"rel":[{"id":"아니에요"},{"id":"아요/어요"},{"id":"았/었","label":"았/었 · прошедшее (темы 6–8)"},{"id":"g8"}],"new":[]},{"id":"아니에요","kind":"ending","forms":[{"c":"после согласной","f":"N이 아니에요","ex":"학생이 아니에요 · 책이 아니에요"},{"c":"после гласной","f":"N가 아니에요","ex":"친구가 아니에요 · 커피가 아니에요"}],"func":"Отрицание связки: «не является X». Форма 아니다 в 해요-стиле, отдельное слово. Существительное перед ним получает 이/가. Связку 이에요 уже содержит.","usage":[{"id":"u1","sit":"Отрицать","phrase":"저는 학생이 아니에요.","note":"","ex":[{"ko":"여기는 학교가 아니에요.","ru":"Здесь не школа."}]},{"id":"u2","sit":"Исправить: «не X, а Y»","phrase":"커피가 아니에요. 차예요.","note":"Две фразы подряд, без союза.","ex":[{"ko":"이것은 물이 아니에요. 우유예요.","ru":"Это не вода, а молоко."}]},{"id":"u3","sit":"Ответ «нет»","phrase":"아니요, 학생이 아니에요.","note":"아니요 — «нет» (ответное слово), 아니에요 — «не является» (сказуемое). Похожи, но это разные слова.","ex":[{"ko":"친구예요? — 아니요, 친구가 아니에요.","ru":"Это друг? — Нет, не друг."}]},{"id":"u4","sit":"Прошедшее (тема 8)","phrase":"학생이 아니었어요.","note":"","ex":[]}],"ex":[{"ko":"그 사람은 선생님이 아니에요.","ru":"Тот человек не учитель."}],"topic":1,"rel":[{"id":"이에요/예요"},{"id":"이/가","label":"이/가 · тема 2"},{"id":"-지 않다","label":"-지 않다 · тема 13 (отрицание глаголов)"},{"id":"g2"},{"id":"g8"},{"id":"g13"}],"new":[]},{"id":"이/가","kind":"particle","forms":[{"c":"после согласной","f":"이","ex":"책이 · 사람이 · 물이"},{"c":"после гласной","f":"가","ex":"친구가 · 차가 · 커피가"},{"c":"누구","f":"누가","ex":"누가 있어요?"}],"func":"Частица подлежащего. Помечает того, кто или что есть либо отсутствует (있다/없다), и существительное перед 아니에요. Выделяет новое, сообщаемое; при противопоставлении уступает место 은/는.","usage":[{"id":"u1","sit":"Наличие","phrase":"차가 있어요.","note":"","ex":[{"ko":"저는 한국 친구가 있어요.","ru":"У меня есть друг-кореец."}]},{"id":"u2","sit":"Отсутствие","phrase":"물이 없어요.","note":"","ex":[{"ko":"사람이 없어요.","ru":"Никого нет."}]},{"id":"u3","sit":"В отрицании связки","phrase":"학생이 아니에요.","note":"Та же частица — обязательная часть конструкции.","ex":[]},{"id":"u4","sit":"Кто? что?","phrase":"누가 있어요?","note":"누구 → 누가, 뭐 → 뭐가.","ex":[{"ko":"뭐가 있어요?","ru":"Что есть?"}]}],"ex":[{"ko":"커피가 있어요?","ru":"Кофе есть?"}],"topic":2,"rel":[{"id":"은/는"},{"id":"아니에요"},{"id":"을/를"},{"id":"도","label":"도 · тема 14"},{"id":"만","label":"만 · тема 14"},{"id":"g1"},{"id":"g4"}],"new":["u4"]},{"id":"아요/어요","kind":"ending","forms":[{"c":"основа на ㅏ, ㅗ","f":"-아요","ex":"사요 · 봐요 · 가요"},{"c":"другой гласный","f":"-어요","ex":"먹어요 · 읽어요 · 마셔요"},{"c":"하다","f":"해요","ex":"공부해요 · 일해요"}],"func":"Окончание 해요-формы. Вежливый разговорный стиль, настоящее время: действие сейчас и привычное. Одно на все лица и числа; вопрос — та же форма с подъёмом тона. Гласные на стыке сливаются: 가요, 봐요, 줘요, 마셔요.","usage":[{"id":"u1","sit":"Сейчас","phrase":"밥을 먹어요.","note":"","ex":[]},{"id":"u2","sit":"Обычно","phrase":"저는 도서관에서 공부해요.","note":"","ex":[]},{"id":"u3","sit":"Вопрос","phrase":"일해요?","note":"","ex":[{"ko":"어디에 가요?","ru":"Куда идёшь?"}]}],"ex":[{"ko":"친구를 기다려요.","ru":"Жду друга."},{"ko":"영화를 봐요.","ru":"Смотрю фильм."}],"topic":3,"rel":[{"id":"이에요/예요"},{"id":"았/었","label":"았/었 · прошедшее (тема 6)"},{"id":"g5"},{"id":"g4"},{"id":"g6"}],"new":[]},{"id":"을/를","kind":"particle","forms":[{"c":"после согласной","f":"을","ex":"밥을 · 책을 · 신문을"},{"c":"после гласной","f":"를","ex":"커피를 · 친구를 · 우유를"}],"func":"Винительная частица. Помечает прямой объект действия: что едят, пьют, читают, покупают; кого встречают, ждут. С 만나다 и 기다리다 тоже 을/를, хотя по-русски «с кем» / «кого».","usage":[{"id":"u1","sit":"Что делаю с чем","phrase":"신문을 읽어요.","note":"","ex":[{"ko":"우유를 마셔요.","ru":"Пью молоко."}]},{"id":"u2","sit":"Встреча, ожидание","phrase":"친구를 만나요.","note":"«С другом» — но 을/를.","ex":[{"ko":"선생님을 기다려요.","ru":"Жду учителя."}]},{"id":"u3","sit":"Вопрос об объекте","phrase":"뭐를 먹어요?","note":"뭐를, 무엇을, 누구를.","ex":[{"ko":"누구를 만나요?","ru":"С кем встречаешься?"}]}],"ex":[{"ko":"무엇을 사요?","ru":"Что покупаешь?"}],"topic":3,"rel":[{"id":"이/가"},{"id":"도","label":"도 · тема 14"},{"id":"만","label":"만 · тема 14"}],"new":[]},{"id":"에","kind":"particle","forms":[{"c":"после любого звука","f":"에","ex":"학교에 · 집에 · 한국에"}],"func":"Локатив «куда», «где находится» и «когда». С 가다/오다 — направление, с 있다/없다 — местонахождение, со словами времени — момент (저녁에). Не ставится после 오늘, 어제, 내일, 지금.","usage":[{"id":"u1","sit":"Куда","phrase":"학교에 가요.","note":"","ex":[{"ko":"어디에 가요?","ru":"Куда идёшь?"}]},{"id":"u2","sit":"Где находится","phrase":"집에 있어요.","note":"","ex":[{"ko":"방에 책이 있어요.","ru":"В комнате есть книга."}]},{"id":"u3","sit":"Когда (тема 9)","phrase":"저녁에 만나요.","note":"Но: 오늘, 어제, 내일, 지금 — без 에.","ex":[{"ko":"오늘 아침에 학교에 갔어요.","ru":"Сегодня утром ходил в школу."}]}],"ex":[{"ko":"친구가 집에 와요.","ru":"Друг приходит домой (ко мне)."}],"topic":3,"rel":[{"id":"에서"},{"id":"g9"},{"id":"도"},{"id":"만"}],"new":[]},{"id":"에서","kind":"particle","forms":[{"c":"после любого звука","f":"에서","ex":"도서관에서 · 집에서 · 회사에서"}],"func":"Локатив места действия: где едят, работают, учатся, отдыхают. Не с 있다/없다 и не с движением — там 에.","usage":[{"id":"u1","sit":"Где делаю","phrase":"도서관에서 공부해요.","note":"","ex":[{"ko":"어디에서 일해요?","ru":"Где работаешь?"}]},{"id":"u2","sit":"Откуда","phrase":"친구가 한국에서 와요.","note":"에서 = «из, от».","ex":[]}],"ex":[{"ko":"식당에서 밥을 먹어요.","ru":"Ем в столовой."}],"topic":3,"rel":[{"id":"에"},{"id":"도"},{"id":"만"}],"new":["u2"]},{"id":"았/었","kind":"ending","forms":[{"c":"основа на ㅏ, ㅗ","f":"-았-","ex":"샀어요 · 갔어요 · 봤어요"},{"c":"другой гласный","f":"-었-","ex":"먹었어요 · 마셨어요 · 들었어요"},{"c":"하다","f":"했-","ex":"공부했어요 · 일했어요"},{"c":"связка 이다","f":"이었- / 였-","ex":"학생이었어요 · 친구였어요"},{"c":"아니다","f":"아니었-","ex":"학생이 아니었어요"}],"func":"Показатель прошедшего времени. Встаёт между основой и окончанием: 가 + 았 + 어요. Сам по себе не окончание — после него всегда что-то идёт (в 해요 — 어요). Вид не различает: «делал» и «сделал».","usage":[{"id":"u1","sit":"Рассказ о сделанном","phrase":"친구를 만났어요.","note":"","ex":[{"ko":"영화를 봤어요.","ru":"Посмотрел фильм."}]},{"id":"u2","sit":"Результат","phrase":"친구가 왔어요.","note":"Пришёл — и здесь.","ex":[]},{"id":"u3","sit":"Вопрос","phrase":"밥을 먹었어요?","note":"","ex":[{"ko":"어디에 갔어요?","ru":"Куда ходил?"}]}],"ex":[{"ko":"한국어를 공부했어요.","ru":"Учил корейский."}],"topic":6,"rel":[{"id":"아요/어요"},{"id":"이에요/예요"},{"id":"g7"},{"id":"g8"}],"new":[]},{"id":"안","kind":"adverb","forms":[{"c":"перед глаголом, 형용사","f":"안 + V","ex":"안 가요 · 안 비싸요"},{"c":"하다-глагол","f":"N 안 해요","ex":"운동 안 해요 · 청소 안 해요"}],"func":"Краткое отрицание «не». Действие не совершается по решению или по устройству вещей. С глаголами и 형용사. Не с 있다, 알다, 이다 — у них свои антонимы.","usage":[{"id":"u1","sit":"Не делаю","phrase":"술을 안 마셔요.","note":"","ex":[]},{"id":"u2","sit":"Не такой","phrase":"별로 안 비싸요.","note":"","ex":[]}],"ex":[{"ko":"아침을 안 먹었어요.","ru":"Не завтракал."}],"topic":13,"rel":[{"id":"못"},{"id":"-지 않다"}],"new":[]},{"id":"못","kind":"adverb","forms":[{"c":"перед глаголом","f":"못 + V","ex":"못 가요 · 못 먹어요"},{"c":"하다-глагол","f":"N 못 해요","ex":"요리 못 해요 · 운전 못 해요"}],"func":"Отрицание возможности: «не могу», «не умею», «не получилось». Только с глаголами действия; с 형용사 не употребляется. Произношение меняется по соседнему звуку: [몯까요], [몬머거요], [모태요].","usage":[{"id":"u1","sit":"Обстоятельства","phrase":"내일은 못 가요.","note":"Мягкий отказ.","ex":[]},{"id":"u2","sit":"Нет навыка","phrase":"운전 못 해요.","note":"","ex":[]}],"ex":[{"ko":"어제 청소를 못 했어요.","ru":"Вчера не смог убраться."}],"topic":13,"rel":[{"id":"안"}],"new":[]},{"id":"-지 않다","kind":"ending","forms":[{"c":"любая основа, настоящее","f":"-지 않아요","ex":"가지 않아요 · 먹지 않아요 · 비싸지 않아요"},{"c":"прошедшее","f":"-지 않았어요","ex":"가지 않았어요"}],"func":"Длинное отрицание: основа + 지 + 않다. Смысл как у 안, звучит нейтральнее. Основа не меняется — удобно с неправильными основами (쉽지 않아요).","usage":[{"id":"u1","sit":"Нейтрально","phrase":"술을 마시지 않아요.","note":"","ex":[]},{"id":"u2","sit":"ㅂ-основы","phrase":"어렵지 않아요.","note":"","ex":[]}],"ex":[{"ko":"별로 바쁘지 않아요.","ru":"Не особо занят."}],"topic":13,"rel":[{"id":"안"},{"id":"아니에요"}],"new":[]},{"id":"도","kind":"particle","forms":[{"c":"вместо 은/는, 이/가, 을/를","f":"N도","ex":"저도 · 커피도 · 밥도"},{"c":"после 에 / 에서","f":"에도 · 에서도","ex":"방에도 · 회사에서도"}],"func":"«Тоже, и». Добавляет элемент к сказанному. Замещает 은/는, 이/가, 을/를; после 에/에서 встаёт следом, не вытесняя их. 도…도 — «и… и…», с отрицанием — «ни… ни…».","usage":[{"id":"u1","sit":"Тоже","phrase":"저도 학생이에요.","note":"","ex":[{"ko":"저도요.","ru":"Я тоже."}]},{"id":"u2","sit":"Ни… ни…","phrase":"아버지도 어머니도 없어요.","note":"","ex":[]},{"id":"u3","sit":"Там тоже","phrase":"방에도 책이 있어요.","note":"","ex":[]}],"ex":[{"ko":"오늘도 바빠요.","ru":"И сегодня занят."}],"topic":14,"rel":[{"id":"만"},{"id":"은/는"},{"id":"이/가"},{"id":"을/를"},{"id":"에"},{"id":"에서"}],"new":[]},{"id":"만","kind":"particle","forms":[{"c":"вместо 은/는, 이/가, 을/를","f":"N만","ex":"저만 · 커피만 · 밥만"},{"c":"после 에 / 에서","f":"에만 · 에서만","ex":"저녁에만 · 회사에서만"}],"func":"«Только». Ограничивает: это и ничего больше. Замещение — как у 도: вытесняет 은/는, 이/가, 을/를, но не 에/에서.","usage":[{"id":"u1","sit":"Только это","phrase":"커피만 마셔요.","note":"","ex":[]},{"id":"u2","sit":"Только тогда / там","phrase":"저녁에만 운동해요.","note":"","ex":[]}],"ex":[{"ko":"한 개만 있어요.","ru":"Есть только одна штука."}],"topic":14,"rel":[{"id":"도"},{"id":"은/는"},{"id":"이/가"},{"id":"을/를"},{"id":"에"},{"id":"에서"}],"new":[]},{"id":"하고","kind":"particle","forms":[{"c":"после любого звука","f":"하고","ex":"빵하고 · 친구하고 · 선생님하고"}],"func":"«И» при перечислении и «с» при совместном действии. Разговорная. От 받침 не зависит. При перечислении падежная частица — только на последнем элементе.","usage":[{"id":"u1","s
