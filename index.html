<script type="application/json" id="data">{"meta":{"version":2,"currentBlock":null,"currentGrammar":"g15","posTs":1790860546048},"blocks":[{"id":"base","label":"База","order":0},{"id":"yesno","label":"네, 아니요","order":1},{"id":1,"label":"Блок 1","order":2},{"id":2,"label":"Блок 2","order":3},{"id":3,"label":"Блок 3","order":4},{"id":4,"label":"Блок 4","order":5},{"id":5,"label":"Блок 5","order":6},{"id":6,"label":"Блок 6","order":7},{"id":7,"label":"Блок 7","order":8},{"id":8,"label":"Блок 8","order":9},{"id":9,"label":"Блок 9","order":10},{"id":10,"label":"Блок 10","order":11},{"id":11,"label":"Блок 11","order":12},{"id":12,"label":"Блок 12","order":13},{"id":13,"label":"Блок 13","order":14},{"id":14,"label":"Блок 14","order":15},{"id":15,"label":"Блок 15","order":16},{"id":16,"label":"Блок 16","order":17},{"id":17,"label":"Блок 17","order":18},{"id":18,"label":"Блок 18","order":19},{"id":19,"label":"Блок 19","order":20},{"id":20,"label":"Блок 20","order":21},{"id":21,"label":"Блок 21","order":22},{"id":22,"label":"Блок 22","order":23},{"id":23,"label":"Блок 23","order":24},{"id":24,"label":"Блок 24","order":25}],"notes":{"n1":"식당 — место, где ЕДЯТ (столовая, ресторан). Русское «кафе» в значении «недорогая едальня» = 식당, НЕ 카페.","n2":"카페 — место, где ПЬЮТ кофе/чай. Еда — только десерты.","n3":"밥 — варёный рис / приём пищи («поесть»). 음식 — еда как категория (한국 음식).","n4":"일 — работа как дело/занятие. 회사 — фирма как место работы.","n5":"회의 — деловая встреча, совещание. 만나다 — встречаться с человеком.","n6":"차 — омоним: «чай» и «машина». Различаются по контексту.","n7":"일 — омоним: «работа, дело», «1» (한자어) и «день / число месяца».","n8":"이다 — связка «являться кем/чем». 있다 — «иметься, находиться». Разные глаголы.","n9":"형용사 (좋다, 크다 и т.д.) — «глаголы-прилагательные»: сами являются сказуемым, спрягаются как глаголы, связка 이다 НЕ нужна.","n10":"많다/적다 — 형용사 «много/мало» (сказуемое). Наречие «много» (많이) — отдельное слово, пока не изучено.","n11":"맛있다 = 맛 «вкус» + 있다; спрягается по 있다 (맛있어요).","n12":"아주 — наречие степени, ставится перед 형용사: 아주 크다 «очень большой». Само не спрягается, сказуемым не является.","n13":"새롭다, 쉽다, 어렵다 — 형용사 на ㅂ-основу (ㅂ-불규칙).","n14":"길다, 알다, 만들다 — основы на ㄹ (ㄹ выпадает перед рядом окончаний).","n15":"모르다, 빠르다 — 르-불규칙. 듣다, 걷다 — ㄷ-불규칙. 쓰다, 바쁘다, 아프다, 나쁘다, 크다, 예쁘다 — ㅡ-основы.","n16":"쓰다 — омоним: «писать» и «использовать» (позже добавится «горький»).","n17":"아침/점심/저녁 — двойное значение: часть суток И приём пищи в это время.","n18":"오늘/어제/내일/지금 — употребляются БЕЗ частицы 에. 아침/점심/저녁/밤 — с 에.","n19":"Составные числительные образуются сложением и отдельными словами НЕ считаются: 고유어 열 + единица (열하나, 열둘 … 열아홉), 스물하나, 서른둘 и т.д.; 한자어 십 + единица (십일, 십이 … 십구), 이십, 삼십.","n20":"한자어 vs 고유어 — две параллельные системы счёта. Выбор зависит от счётного слова, не от размера числа.","n21":"Выше 99 исконных числительных не существует: со 100 работает только 한자어 (백, 천, 만).","n22":"영 — «ноль»; 공 — «ноль» в номерах и кодах.","n23":"얼마 — «сколько; сколько стоит»; 몇 — «сколько» о количестве.","n24":"분 — «минута» и уважительный счётчик людей.","n25":"Корейские разряды группируются по ЧЕТЫРЕ знака, а не по три: 만 (10⁴) — самостоятельный разряд, дальше счёт идёт от него (십만, 백만, 천만). Русское «сто тысяч» = 십만, «миллион» = 백만.","n26":"Перед 백/천/만 единица не произносится: 100 = 백 (не 일백), 10 000 = 만 (не 일만). Но 십만, 백만 — с множителем.","n27":"개 — омоним: «собака» и счётчик предметов «штука». Собак при этом считают через 마리, не через 개.","n28":"공 — омоним: «мяч» и «ноль» в номерах.","n29":"잔 — посуда для питья И счётчик порций напитка (커피 한 잔). 컵 — заимствованная чашка/стакан как предмет.","n30":"병 — «бутылка» как предмет; позже работает и как счётчик бутылок.","n31":"전화 — «телефон» и «телефонный звонок».","n32":"번 после 고유어 = «раз» (한 번, 두 번); после 한자어 = «номер» (일 번, 이 번). Система счёта меняет значение.","n39":"알다 ↔ 모르다 — пара слов, как 있다 ↔ 없다. «Не знаю» = 몰라요, а НЕ 안 알아요.","n40":"Номер комнаты/этажа читается как целое число (방 번호가 이백칠이에요), телефон — по цифрам (공일공 오삼팔).","n41":"전혀 и 별로 употребляются ТОЛЬКО с отрицанием. 전혀 — категорический ноль («вообще ни капли»). 별로 — смягчённое «не особо, не очень», НЕ «не совсем».","n42":"자주/가끔/항상 — свободные наречия, ставятся перед сказуемым. Неизменяемые: формы на 다 у них нет.","n43":"하다-глаголы (운동하다, 청소하다, 요리하다, 운전하다, 전화하다): именная часть остаётся существительным и может отделяться — 요리를 하다, 한국 요리를 하다. Отрицание 안 встаёт МЕЖДУ частями: 청소 안 해요.","n44":"고기 — «мясо» шире русского: плоть животного вообще. 물고기 — живая рыба, 생선 — рыба как еда.","n45":"채소 (한자어, письменный, TOPIK) = 야채 (разговорный). Смысл один, регистр разный.","n46":"담배 + 피우다 — устойчивая пара. 피우다 отдельно почти не употребляется.","n47":"술 — алкоголь как категория, не конкретный напиток. Глагол — обычное 마시다.","n48":"형/누나 vs 오빠/언니 — выбор зависит от пола ГОВОРЯЩЕГО, а не адресата: мужчина говорит 형/누나, женщина — 오빠/언니.","n49":"동생 — младший сиблинг без различия пола. Уточнения 남동생/여동생 пока не изучены.","n50":"엄마/아빠 — разговорные, внутрисемейные. 어머니/아버지 — нейтрально-вежливые, при посторонних.","n51":"님 — суффикс вежливости к лицу: 선생님, 사장님, 손님. Без него формы звучат грубо.","n52":"회사원 = 회사 «фирма» + 원 «работник, член». Продуктивный корень 원.","n53":"손님 — и «гость» в доме, и «клиент» в заведении. Одно слово на оба смысла.","n54":"Омонимичные слоги в 한자어: 전 — «электричество» (전화), «вращать, поворачивать» (운전), «перед» (오전). 화 — «речь» (전화), «изображение» (영화). 영 — «проецировать» (영화), «ноль» (числительное). Слог не равен корню. Ещё: 화 — «огонь» (화요일); 금 — «сейчас» (지금) и «металл» (금요일); 주 — «жить» (주소) и «неделя» (주, 주말).","n55":"Этикетные формулы заучиваются целиком, как слова. Окончания в них (합니다-форма, -(으)세요) разбираются задним числом в темах 20 и 25; отдельно от формул пока не употребляются.","n56":"안녕히 가세요 / 안녕히 계세요 — выбор по тому, кто уходит: уходящему — 가세요 («идите спокойно»), остающемуся — 계세요 («оставайтесь спокойно»). Расходятся оба — оба говорят 가세요.","n57":"감사합니다 (한자어) и 고맙습니다 (исконное) — оба вежливые, взаимозаменяемы. 고마워, 미안해 — 반말: только близким и младшим. Старшему и незнакомому — 고맙습니다 / 죄송합니다.","n58":"죄송합니다 — за уже случившееся (вина, неудобство). 실례합니다 — ДО того, как побеспокоить (обратиться, войти). 잠깐만요 — «минутку» и «дайте пройти».","n59":"잘 먹겠습니다 / 잘 먹었습니다 — говорит САМ едящий (до / после еды), тому, кто готовил или угощает. Русское «приятного аппетита» другому — не аналог.","n60":"Дни недели = светило / стихия + 요일: 월 луна, 화 огонь, 수 вода, 목 дерево, 금 металл, 토 земля, 일 солнце. Неделя начинается с 월요일. Все — с 에: 월요일에.","n61":"Срок и момент: 시간 «сколько часов» (한 시간, 고유어) — 시 «который час» (한 시); 달 «сколько месяцев» (한 달, 고유어) — 월 «какой месяц» (일월, 한자어).","n62":"이번 / 다음 / 지난 — только перед существительным: 이번 주, 다음 달, 지난 주말. Слитно пишутся 지난주, 지난달; раздельно — 이번 주, 다음 주, 이번 달, 다음 달. Частица 에 — после всей группы: 다음 주에.","n63":"전 — «перед, до»; после срока — «назад»: 한 시간 전에, 두 달 전에. Слог тот же, что в 오전 («перед полуднем»).","n64":"호 — номер комнаты, квартиры (이백칠 호); 층 — этаж; 번 — номер в очереди, линии, телефоне. Все три — с китайскими числами.","n65":"언제 употребляется без 에, как 오늘/내일. 며칠 — «какое число» и «несколько дней»; пишется 며칠, не 몇 일."},"words":[{"id":"저","ko":"저","tr":"чжо","pr":null,"ru":"я (вежл.); вон тот (перед сущ.)","cat":"pron","sub":null,"tag":null,"block":"base","weak":false,"usage":"","notes":[],"rel":[{"id":"나","t":"register"},{"id":"그","t":"see"},{"id":"저것","t":"see"}],"roots":[],"forms":null,"ex":[{"ko":"저는 학생이에요.","ru":"Я студент."},{"ko":"저 사람은 누구예요?","ru":"Кто вон тот человек?"}],"extra":""},{"id":"나","ko":"나","tr":"на","pr":null,"ru":"я (разг.)","cat":"pron","sub":null,"tag":null,"block":"base","weak":false,"usage":"","notes":[],"rel":[{"id":"저","t":"register"}],"roots":[],"forms":null,"ex":[{"ko":"나도 몰라요.","ru":"Я тоже не знаю."},{"ko":"나는 커피만 마셔요.","ru":"Я пью только кофе. (나 + 해요 встречается в песнях и дневниках; в живой речи с 나 обычно 반말 — тема 45)"}],"extra":""},{"id":"이것","ko":"이것",  так.","schema":[{"title":"1. Связывание (연음)","cols":["Сочетание","Звучит"],"rows":[["받침 + ㅇ → 받침 уходит в следующий слог","한국어 [한구거] · 먹어요 [머거요]"],["겹받침 + ㅇ → уходит вторая согласная","읽어요 [일거요] · 없어요 [업써요]"],["ㅎ · ㄶ · ㅀ + ㅇ → ㅎ выпадает","좋아요 [조아요] · 많아요 [마나요]"],["ㅇ-받침 + ㅇ → не переходит","고양이 [고양이]"]],"note":"На стыке корней 받침 сначала упрощается, потом переходит: 맛없어요 [마덥써요]. 맛있어요 [마시써요] — исключение."},{"title":"2. Упрощение 받침","cols":["Сочетание","Звучит"],"rows":[["ㄱ ㄲ ㅋ → ㄱ","부엌 [부억]"],["ㄷ ㅅ ㅆ ㅈ ㅊ ㅌ ㅎ → ㄷ","옷 [옫] · 있다 [읻따]"],["ㅂ ㅍ → ㅂ","앞 [압]"],["ㄳ → ㄱ · ㄺ → ㄱ","읽다 [익따]"],["ㄵ ㄶ → ㄴ","앉다 [안따] · 많다 [만타]"],["ㄼ ㄽ ㄾ ㅀ → ㄹ","여덟 [여덜] · 짧다 [짤따]"],["ㄻ → ㅁ","삶 [삼]"],["ㅄ ㄿ → ㅂ","없다 [업따]"],["ㄺ + ㄱ → ㄹ","읽고 [일꼬]"],["밟다 → ㅂ (исключение)","밟다 [밥따]"]],"note":""},{"title":"3. Напряжение (경음화)","cols":["Сочетание","Звучит"],"rows":[["ㄱ ㄷ ㅂ + ㄱ ㄷ ㅂ ㅅ ㅈ → ㄲ ㄸ ㅃ ㅆ ㅉ","학교 [학꾜] · 듣다 [듣따] · 잡지 [잡찌]"],["основа на ㄴ ㅁ + ㄱ ㄷ ㅅ ㅈ → напряжённые","앉다 [안따] · 신다 [신따]"],["ㄹ + ㄷ ㅅ ㅈ в 한자어 → ㄸ ㅆ ㅉ","일주일 [일쭈일]"],["-(으)ㄹ + ㄱ ㄷ ㅂ ㅅ ㅈ → напряжённые","갈 거예요 [갈 꺼에요] · 할 수 [할 쑤]"]],"note":"В сложных словах начало второго корня часто напрягается без видимой причины: 비빔밥 [비빔빱]."},{"title":"4. Назализация (비음화)","cols":["Сочетание","Звучит"],"rows":[["ㄱ + ㄴ ㅁ → ㅇ","백만 [뱅만] · 한국말 [한궁말]"],["ㄷ + ㄴ ㅁ → ㄴ","있는 [인는] · 끝나요 [끈나요]"],["ㅂ + ㄴ ㅁ → ㅁ","합니다 [함니다] · 십만 [심만]"],["ㅁ ㅇ + ㄹ → ㄹ становится ㄴ","음료 [음뇨] · 종로 [종노]"],["ㄱ + ㄹ → ㅇㄴ","국립 [궁닙]"],["ㅂ + ㄹ → ㅁㄴ","협력 [혐녁]"]],"note":""},{"title":"5. Уподобление ㄹ (유음화)","cols":["Сочетание","Звучит"],"rows":[["ㄴ + ㄹ → ㄹㄹ","신라 [실라] · 연락 [열락]"],["ㄹ + ㄴ → ㄹㄹ","설날 [설랄] · 일년 [일련]"],["ㄹ + ㄹ → долгое ㄹ [лл]","별로 · 몰라요"]],"note":"В части сложных слов ㄴ + ㄹ → ㄴㄴ: 의견란 [의견난]."},{"title":"6. Придыхание (격음화)","cols":["Сочетание","Звучит"],"rows":[["ㅎ + ㄱ ㄷ ㅈ → ㅋ ㅌ ㅊ","좋다 [조타] · 많고 [만코] · 좋지 [조치]"],["ㄱ ㄷ ㅂ ㅈ + ㅎ → ㅋ ㅌ ㅍ ㅊ","축하 [추카] · 못해요 [모태요] · 입학 [이팍]"],["ㅎ + ㅅ → ㅆ","좋습니다 [조씀니다]"],["ㅎ + ㄴ → ㄴㄴ","놓는 [논는] · 않는 [안는]"]],"note":""},{"title":"7. Ослабление ㅎ","cols":["Сочетание","Звучит"],"rows":[["ㄴ ㅁ ㅇ ㄹ + ㅎ → ㅎ слабеет или выпадает","전화 [저놔] · 영화 [영와] · 일하다 [이라다]"]],"note":"В беглой речи. При чётком произношении ㅎ слышна."},{"title":"8. Палатализация (구개음화)","cols":["Сочетание","Звучит"],"rows":[["ㄷ + 이 → 지","굳이 [구지]"],["ㅌ + 이 → 치","같이 [가치]"],["ㄷ + 히 → 치","닫히다 [다치다]"]],"note":"Только перед частицей или суффиксом, внутри корня нет: 마디 [마디]."},{"title":"9. Вставка ㄴ (ㄴ-첨가)","cols":["Сочетание","Звучит"],"rows":[["받침 + 이 야 여 요 유 на стыке корней → +ㄴ","한여름 [한녀름] · 무슨 일 [무슨닐]"],["ㄹ + 이 야 여 요 유 → +ㄹ","서울역 [서울력] · 할 일 [할릴]"],["ㄱ + вставная ㄴ → ㅇㄴ","색연필 [생년필]"]],"note":"Не регулярно: только в сложных словах и тесных сочетаниях."},{"title":"10. Гласные","cols":["Сочетание","Звучит"],"rows":[["ㅢ в начале слова → [의]","의사 [의사]"],["согласная + ㅢ → [이]","희망 [히망]"],["ㅢ не в начале → [이]","회의 [회이]"],["частица 의 → [에]","저의 [저에]"],["согласная + ㅖ → [ㅔ] (кроме 례)","계란 [게란] · 시계 [시게]"],["ㅈ ㅊ ㅉ + ㅕ → [ㅓ]","가져요 [가저요]"]],"note":""}],"sections":[],"usage":[],"rel":[],"new":[]},{"id":"g1","n":1,"title":"Связка 이다/아니다 + тематическая 은/는","meaning":"Первая опора корейского предложения: «X — это Y» и «X — не Y».\n**이다** — связка «являться». Прирастает к существительному и стоит в конце фразы. **아니다** — её отрицание, отдельное слово.\n**은/는** — частица темы: помечает, о чём идёт речь («что касается X…»), а при сопоставлении даёт «а».\nНа этой тройке держатся знакомство, вопросы «что это?», «кто это?», «где X?» и исправление «не X, а Y». Все формы — вежливый 해요-стиль, настоящее время.","schema":[{"title":"Связка: N + 이에요 / 예요","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N이에요","학생이에요 · 책이에요 · 물이에요"],["гласная","N예요","친구예요 · 커피예요 · 뭐예요"]],"note":"Слитно с существительным. Вопрос — та же форма + «?» и подъём тона."},{"title":"Отрицание: N + 이/가 아니에요","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N이 아니에요","학생이 아니에요 · 책이 아니에요"],["гласная","N가 아니에요","친구가 아니에요 · 커피가 아니에요"]],"note":"이/가 — слитно с существительным, 아니에요 — через пробел."},{"title":"Тема: N + 은 / 는","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N은","선생님은 · 이것은 · 책은"],["гласная","N는","저는 · 친구는 · 여기는"]],"note":""},{"title":"Предложение целиком","cols":["Тема","Сказуемое","Перевод"],"rows":[["저는","학생이에요.","Я студент."],["이것은","책이 아니에요.","Это не книга."],["—","커피예요?","Это кофе?"]],"note":"Тема — первой, сказуемое — последним. Тему можно опустить, сказуемое — нельзя."}],"sections":[{"id":"s1","title":"1. Связка 이다: «X — это Y»","body":"이다 отдельно не живёт: в речи это окончание, приклеенное к существительному. Русское «X — Y» (с тире, без глагола) передаётся именно им: 학생이에요 — буквально «являюсь (является) студентом».\nСказуемое всегда в конце. Лица, числа и рода нет: 학생이에요 — «я студент», «он студент», «они студенты». Кто именно — ясно из темы или ситуации.\nФорма выбирается только по последнему звуку существительного: 받침 → 이에요, гласная → 예요. 예요 — стянутое 이에요: гласная слова «поглощает» 이.\nВопрос не требует ни особого слова, ни перестановки: 학생이에요? — «(ты) студент?». Разница только в интонации и знаке «?».\nНаписание: **이에요** (не 이예요), **예요** (не 에요), хотя 예요 произносится как [에요].","ex":[{"ko":"학생이에요.","ru":"(Я) студент."},{"ko":"친구예요.","ru":"Это друг."},{"ko":"이것은 책이에요.","ru":"Это книга."},{"ko":"선생님이에요?","ru":"Вы учитель?"}]},{"id":"s2","title":"2. Вопросительные слова в связке","body":"Вопросительное слово встаёт на место существительного и тоже получает связку. Порядок слов тот же, что в ответе: 이것은 뭐예요? → 이것은 책이에요.\n뭐 → **뭐예요?** «что это?» (разговорное). 무엇 → **무엇이에요?** (полная, книжная форма).\n누구 → **누구예요?** «кто это?».\n어디 → **어디예요?** «где это? где находится?».","ex":[{"ko":"이것은 뭐예요?","ru":"Что это?"},{"ko":"저것은 무엇이에요?","ru":"Что вон то? (полная форма)"},{"ko":"저 사람은 누구예요?","ru":"Кто вон тот человек?"},{"ko":"학교는 어디예요?","ru":"Где школа?"}]},{"id":"s3","title":"3. Отрицание 아니다: «X — не Y»","body":"Отрицание — отдельное слово **아니에요** (словарная форма 아니다). Существительное перед ним получает частицу 이/가: 받침 → 이, гласная → 가.\nЗдесь 이/가 — обязательная часть конструкции. Как самостоятельная частица подлежащего она разбирается в теме 2.\n아니에요 уже содержит связку внутри — 이에요 к нему не добавляется. Написание: **아니에요** (не 아니예요).\nОтрицательный вопрос строится так же: 학생이 아니에요? — «ты не студент?».","ex":[{"ko":"저는 학생이 아니에요.","ru":"Я не студент."},{"ko":"이것은 커피가 아니에요.","ru":"Это не кофе."},{"ko":"그 사람은 선생님이 아니에요.","ru":"Тот человек не учитель."},{"ko":"여기는 학교가 아니에요.","ru":"Здесь не школа."}]},{"id":"s4","title":"4. Тематическая частица 은/는","body":"은/는 помечает тему — то, о чём дальше будет сказано: 저는 학생이에요 ≈ «что касается меня — студент». В русском эту роль выполняют порядок слов и интонация, отдельного слова нет.\nВыбор: 받침 → 은, гласная → 는. Пишется слитно.\nТема не обязательна. Если из ситуации ясно, о ком речь, её опускают: о себе говорят просто 학생이에요. Повторять 저는 в каждой фразе — признак ученика.\nВторое значение — противопоставление. Когда две темы стоят рядом, 은/는 подчёркивает разницу, по-русски «а»: 저는 학생이에요. 친구는 선생님이에요. — «Я студент, а друг — учитель».","ex":[{"ko":"저는 학생이에요.","ru":"Я студент."},{"ko":"학생이에요.","ru":"(Я) студент. — о себе, тема опущена"},{"ko":"저는 학생이에요. 친구는 선생님이에요.","ru":"Я студент, а друг — учитель."}]},{"id":"s5","title":"5. Указательные: 이것/그것/저것 и 이/그/저 + N","body":"Тройка по дистанции: **이** — рядом со мной, **그** — рядом с тобой или уже упомянутое в разговоре, **저** — далеко от обоих.\nСамостоятельно: 이것 «это», 그것 «то», 저것 «вон то». С 은/는 — тема «что касается этого»: 이것은…\nПеред существительным — просто 이/그/저, без 것: 이 책은, 그 사람은, 저 식당은.\n저 «вон тот» пишется так же, как 저 «я». Различает позиция: перед существительным — указательное. 저는 학생이에요 — «я студент»; 저 사람은 학생이에요 — «вон тот человек — студент».","ex":[{"ko":"이것은 신문이에요.","ru":"Это газета."},{"ko":"그것은 빵이에요.","ru":"То (у тебя) — хлеб."},{"ko":"저 사람은 선생님이에요.","ru":"Вон тот человек — учитель."},{"ko":"이 식당은 한국 식당이에요.","ru":"Этот ресторан — корейский."}]},{"id":"s6","title":"6. Произношение","body":"받침 перетекает в следующий слог, если тот начинается с гласной (ㅇ в начале слога немая): 책이에요 [채기에요], 집이에요 [지비에요], 이것은 [이거슨], 선생님은 [선생니믄].\nПишется по-прежнему раздельно по морфемам: 책이에요, а не 채기에요.\n예요 в живой речи звучит [에요]: 친구예요 [친구에요]. На письме — только 예요.\nВопрос — подъём тона на последнем слоге: 학생이에요↗","ex":[]}],"usage":[{"id":"u1","sit":"Представиться: кто я","phrase":"저는 학생이에요.","note":"Базовая формула знакомства. 저 — вежливое «я». Дальше в разговоре 저는 обычно опускают.","ex":[{"ko":"저는 선생님이에요.","ru":"Я учитель."},{"ko":"저는 한국 사람이에요.","ru":"Я кореец."},{"ko":"학생이에요.","ru":"(Я) студент. — тема уже ясна"}]},{"id":"u2","sit":"Назвать своё имя","phrase":"저는 민수예요.","note":"Имя — обычное существительное: форма по последнему слогу имени. 민수 (гласная) → 예요, 지민 (ㄴ) → 이에요. 민수, 지민 — корейские имена.","ex":[{"ko":"저는 지민이에요.","ru":"Я Чимин (имя)."},{"ko":"저는 민수예요.","ru":"Я Минсу (имя)."}]},{"id":"u3","sit":"Спросить имя","phrase":"이름이 뭐예요?","note":"«Как вас зовут?», буквально «имя — что?». 이 после 이름 — частица подлежащего (тема 2); в вопросе об имени обычна именно она, а не 은.","ex":[{"ko":"이름이 뭐예요? — 민수예요.","ru":"Как вас зовут? — Минсу."},{"ko":"이름이 뭐예요? — 저는 지민이에요.","ru":"Как вас зовут? — Я Чимин."}]},{"id":"u4","sit":"Спросить о собеседнике без «ты/вы»","phrase":"학생이에요?","note":"Местоимения «ты/вы» в вежливой речи избегают: вопрос строят без подлежащего, кого спрашивают — ясно из ситуации. Русское «Вы студент?» = 학생이에요?","ex":[{"ko":"학생이에요?","ru":"Вы студент?"},{"ko":"선생님이에요?","ru":"Вы учитель?"}]},{"id":"u5","sit":"Национальность","phrase":"저는 러시아 사람이에요.","note":"Страна + 사람 = житель страны. Отдельных слов «русский», «кореец» нет. 러시아 — Россия (не изучено).","ex":[{"ko":"한국 사람이에요?","ru":"Вы кореец?"},{"ko":"친구는 한국 사람이에요.","ru":"Друг — кореец."}]},{"id":"u6","sit":"Что это?","phrase":"이것은 뭐예요?","note":"О предмете рядом с собой. О вещи у собеседника — 그것은 뭐예요?, о далёкой — 저것은 뭐예요? Отвечают без темы: просто N이에요/예요.","ex":[{"ko":"이것은 뭐예요? — 빵이에요.","ru":"Что это? — Хлеб."},{"ko":"그것은 뭐예요? — 한국어 책이에요.","ru":"Что это у тебя? — Книга по корейскому."},{"ko":"저것은 뭐예요? — 학교예요.","ru":"Что вон то? — Школа."}]},{"id":"u7","sit":"Кто это?","phrase":"저 사람은 누구예요?","note":"누구 + 예요. Указательное — перед 사람: 이 사람 «этот человек», 그 사람 «тот, о ком говорили», 저 사람 «вон тот».","ex":[{"ko":"이 사람은 누구예요? — 친구예요.","ru":"Кто это? — Друг."},{"ko":"그 사람은 누구예요? — 선생님이에요.","ru":"А тот человек кто? — Учитель."}]},{"id":"u8","sit":"Проверить догадку","phrase":"이것은 커피예요?","note":"Утверждение + вопросительная интонация = «это ведь X?». Ответ — 네 + повтор формы или 아니요 + отрицание.","ex":[{"ko":"이것은 커피예요? — 네, 커피예요.","ru":"Это кофе? — Да, кофе."},{"ko":"여기는 도서관이에요? — 아니요, 도서관이 아니에요. 학교예요.","ru":"Здесь библиотека? — Нет, не библиотека, а школа."}]},{"id":"u15","sit":"Ответить «да» / «нет»","phrase":"네, 학생이에요. / 아니요, 학생이 아니에요.","note":"네/아니요 + полная фраза — обычный вежливый ответ. Голое 네 или 아니요 без фразы звучит суховато. На отрицательный вопрос 네 подтверждает сказанное: 학생이 아니에요? — 네 = «да, не студент».","ex":[{"ko":"선생님이에요? — 네, 선생님이에요.","ru":"Вы учитель? — Да, учитель."},{"ko":"한국 사람이에요? — 아니요, 한국 사람이 아니에요.","ru":"Вы кореец? — Нет, не кореец."},{"ko":"학생이 아니에요? — 네, 학생이 아니에요.","ru":"Вы не студент? — Да, не студент."}]},{"id":"u9","sit":"Исправить: «не X, а Y»","phrase":"커피가 아니에요. 차예요.","note":"Русское «не X, а Y» — две фразы подряд: сначала отрицание, потом правильный вариант. Союз «а» не нужен.","ex":[{"ko":"저는 선생님이 아니에요. 학생이에요.","ru":"Я не учитель, а студент."},{"ko":"이것은 물이 아니에요. 우유예요.","ru":"Это не вода, а молоко."},{"ko":"여기는 식당이 아니에요. 카페예요.","ru":"Здесь не ресторан, а кафе."}]},{"id":"u10","sit":"Где X?","phrase":"도서관은 어디예요?","note":"Простой вопрос о месте — X은/는 어디예요?, буквально «X — где?». Ответ тоже связкой: 여기예요 «здесь», 거기예요 «там (у тебя)», 저기예요 «вон там». Глагол «находиться» (있다) — тема 2.","ex":[{"ko":"식당은 어디예요? — 저기예요.","ru":"Где ресторан? — Вон там."},{"ko":"학교는 어디예요? — 여기예요.","ru":"Где школа? — Здесь."}]},{"id":"u11","sit":"Что это за место?","phrase":"여기는 어디예요?","note":"Спросить, куда попал: «Где мы? Что это за место?». Ответ — (여기는) N이에요. По телефону о месте собеседника — 거기는…","ex":[{"ko":"여기는 어디예요? — 공원이에요.","ru":"Где мы? — В парке."},{"ko":"여기는 학교예요.","ru":"Это школа (здесь школа)."},{"ko":"거기는 한국 식당이에요?","ru":"Там у вас корейский ресторан?"}]},{"id":"u12","sit":"Противопоставить: «а X — …»","phrase":"저는 학생이에요. 친구는 선생님이에요.","note":"Две темы рядом — 은/는 даёт контраст, по-русски «а».","ex":[{"ko":"이것은 차예요. 저것은 커피예요.","ru":"Это чай, а вон то — кофе."},{"ko":"저는 한국 사람이 아니에요. 친구는 한국 사람이에요.","ru":"Я не кореец, а друг — кореец."}]},{"id":"u13","sit":"Вернуть вопрос: «а вы?»","phrase":"선생님은요?","note":"N은/는요? — «а как насчёт N?»: короткий встречный вопрос без повтора сказуемого. К собеседнику обращаются по имени или статусу, не «ты/вы».","ex":[{"ko":"저는 한국 사람이에요. 선생님은요?","ru":"Я кореец. А вы?"},{"ko":"이것은 빵이에요. 저것은요?","ru":"Это хлеб. А вон то?"}]},{"id":"u14","sit":"Уточнить, какой именно","phrase":"이 책은 한국어 책이에요.","note":"Существительное перед существительным работает как определение: 한국어 책 «книга по корейскому», 한국 식당 «корейский ресторан». Связка — только в самом конце.","ex":[{"ko":"그것은 한국 신문이에요.","ru":"То — корейская газета."},{"ko":"이 식당은 한국 식당이 아니에요.","ru":"Этот ресторан не корейский."}]}],"rel":[{"id":"은/는"},{"id":"이에요/예요"},{"id":"아니에요"},{"id":"이/가","label":"이/가 · тема 2"},{"id":"g2","label":"Тема 2: 있다/없다 + 이/가"},{"id":"g8"},{"id":"g20","label":"Тема 20: 합니다-форма (입니다)"},{"id":"g46","label":"Тема 46: 은/는 vs 이/가"},{"id":"g13"},{"id":"g14"}],"new":["u13"]},{"id":"g2","n":2,"title":"있다/없다 + частица подлежащего 이/가","meaning":"Существование и обладание: «есть X», «нет X», «у меня есть X».\n**있다** — «есть, имеется». **없다** — «нет, отсутствует». Это два разных глагола-антонима, а не утверждение и отрицание одного.\nТо, что есть или отсутствует, помечается **이/가** — частицей подлежащего. Она уже встречалась внутри 아니에요.\nЗдесь же первое различие двух частиц: 은/는 — о чём речь, 이/가 — что именно, новое.","schema":[{"title":"Подлежащее: N + 이 / 가","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N이","책이 · 사람이 · 물이"],["гласная","N가","친구가 · 차가 · 커피가"]],"note":"Слитно с существительным."},{"title":"Наличие: N이/가 있어요 / 없어요","cols":["Смысл","Форма","Пример"],"rows":[["есть","N이/가 있어요","차가 있어요."],["нет","N이/가 없어요","차가 없어요."],["есть ли?","N이/가 있어요?","차가 있어요?"]],"note":"Произношение: 있어요 [이써요], 없어요 [업써요]."},{"title":"Обладание: X은/는 N이/가 있어요","cols":["Перевод","Фраза"],"rows":[["У меня есть машина.","저는 차가 있어요."],["У друга нет дома.","친구는 집이 없어요."],["(У тебя) есть машина?","차가 있어요?"]],"note":"Владелец — тема (은/는), предмет — подлежащее (이/가)."},{"title":"이다 или 있다","cols":["По-русски","По-корейски"],"rows":[["(Он) студент. — 이다","학생이에요."],["Студент есть (на месте). — 있다","학생이 있어요."],["Это не книга. — 아니다","책이 아니에요."],["Книги нет. — 없다","책이 없어요."]],"note":"이다/아니다 — кто/что это. 있다/없다 — есть ли."}],"sections":[{"id":"s1","title":"1. 있다 / 없다: «есть» и «нет»","body":"있다 — «есть, имеется». 없다 — «нет, отсутствует». Пара антонимов, как «иметь» — «не иметь»: «нет» не строится отрицанием от 있다. Только 없어요.\nФорма 해요: 있어요, 없어요 (как устроено окончание -어요 — тема 3). Пишется 있어요, 없어요; звучит [이써요], [업써요].\nВопрос — та же форма с подъёмом тона: 있어요? — «есть?».\nКороткий ответ — одно сказуемое: 있어요 / 없어요. Предмет уже назван в вопросе.","ex":[{"ko":"책이 있어요.","ru":"Есть книга."},{"ko":"물이 없어요.","ru":"Воды нет."},{"ko":"커피가 있어요? — 네, 있어요.","ru":"Кофе есть? — Да, есть."}]},{"id":"s2","title":"2. Частица подлежащего 이/가","body":"이/가 помечает подлежащее — то, что есть или чего нет. Выбор: 받침 → 이, гласная → 가. Пишется слитно.\nВ 아니에요 (тема 1) это та же частица: 학생이 아니에요 — «студентом не является».\nПодлежащее с 이/가 не опускается так легко, как тема: это и есть сообщаемое.","ex":[{"ko":"친구가 있어요.","ru":"Есть друг."},{"ko":"사람이 없어요.","ru":"Никого нет (людей нет)."},{"ko":"차가 있어요?","ru":"Машина есть?"}]},{"id":"s3","title":"3. «У меня есть»: X은/는 N이/가 있어요","body":"Русское «у меня есть машина» по-корейски звучит как «что касается меня — машина есть». Владелец — тема (은/는), предмет — подлежащее (이/가). Две разные частицы в одной фразе — норма.\nВладелец, как любая тема, опускается, если ясен: 차가 있어요? — «(У тебя) есть машина?». Это тот же приём, что вопрос без «ты/вы» в теме 1.","ex":[{"ko":"저는 한국 친구가 있어요.","ru":"У меня есть друг-кореец."},{"ko":"선생님은 차가 없어요.","ru":"У учителя нет машины."},{"ko":"친구는 집이 있어요?","ru":"У друга есть дом?"}]},{"id":"s4","title":"4. 은/는 или 이/가: первое различие","body":"Обе частицы могут стоять на месте «кто/что». Разница в том, что выделено.\n**이/가** — новое, сообщаемое: 커피가 있어요 — «есть кофе».\n**은/는** — тема, известное или сопоставляемое: 커피는 있어요 — «кофе-то есть» (а чего-то другого, похоже, нет).\nОтсюда частый приём: 커피는 있어요. 우유는 없어요. — «Кофе есть, а молока нет». Замена 이/가 на 은/는 сразу даёт контраст.\nРабочее правило: наличие или отсутствие чего-то нового — 이/가; противопоставление — 은/는. Полное различие — тема 46.","ex":[{"ko":"빵이 있어요.","ru":"Есть хлеб."},{"ko":"빵은 있어요. 밥은 없어요.","ru":"Хлеб есть, а риса нет."}]},{"id":"s5","title":"5. 이다 или 있다","body":"Самая частая путаница начала.\n이다 отвечает на «кто/что это?»: 학생이에요 — «(он) студент».\n있다 отвечает на «есть ли?»: 학생이 있어요 — «студент есть, присутствует».\nОтрицания тоже разные: 학생이 아니에요 — «не студент»; 학생이 없어요 — «студента нет».\nПроверка: если по-русски можно вставить «является» — 이다; если «имеется, присутствует» — 있다.","ex":[{"ko":"선생님이에요.","ru":"Это учитель."},{"ko":"선생님이 있어요.","ru":"Учитель есть (на месте)."},{"ko":"선생님이 아니에요.","ru":"Это не учитель."},{"ko":"선생님이 없어요.","ru":"Учителя нет."}]},{"id":"s6","title":"6. Особые случаи","body":"누구 + 가 → **누가**: 누가 있어요? — «кто есть / находится?» (не «кто там?» у двери). Не 누구가.\n뭐 + 가 → **뭐가**: 뭐가 있어요? — «что есть?».\nВ живой речи 이/가 часто выпадает, особенно в магазине и кафе: 우유 있어요? вместо 우유가 있어요?\n**여기 있어요** — «вот, пожалуйста», когда протягиваешь вещь (буквально «здесь есть»).","ex":[{"ko":"방에 누가 있어요?","ru":"Кто в комнате?"},{"ko":"뭐가 있어요?","ru":"Что есть?"},{"ko":"우유 있어요?","ru":"Молоко есть?"},{"ko":"여기 있어요.","ru":"Вот, пожалуйста."}]}],"usage":[{"id":"u1","sit":"Спросить, есть ли товар","phrase":"빵이 있어요?","note":"В магазине, кафе, у хозяина. Ответ: 네, 있어요 / 아니요, 없어요.","ex":[{"ko":"커피가 있어요? — 네, 있어요.","ru":"Кофе есть? — Да, есть."},{"ko":"우유가 있어요? — 아니요, 없어요.","ru":"Молоко есть? — Нет."}]},{"id":"u2","sit":"Сказать, что чего-то нет","phrase":"물이 없어요.","note":"Жалоба, объяснение, просьба помочь. 없어요 закрывает фразу — никакого «не».","ex":[{"ko":"밥이 없어요.","ru":"Еды нет."},{"ko":"책이 없어요.","ru":"У меня нет книги."}]},{"id":"u3","sit":"«У меня есть / нет»","phrase":"저는 차가 있어요.","note":"Владелец — тема 저는, предмет — с 이/가.","ex":[{"ko":"저는 한국 친구가 있어요.","ru":"У меня есть друг-кореец."},{"ko":"저는 차가 없어요.","ru":"У меня нет машины."}]},{"id":"u4","sit":"Спросить, есть ли у собеседника","phrase":"차가 있어요?","note":"Без «у тебя»: владелец опущен, как «ты/вы» в теме 1.","ex":[{"ko":"한국 친구가 있어요? — 네, 있어요.","ru":"У вас есть друзья-корейцы? — Да, есть."},{"ko":"한국어 책이 있어요? — 아니요, 없어요.","ru":"У тебя есть книга по корейскому? — Нет."}]},{"id":"u5","sit":"Есть дела, встреча","phrase":"회의가 있어요.","note":"있다 и про события: «у меня совещание», «есть работа». 일 здесь — «дела, работа».","ex":[{"ko":"일이 있어요.","ru":"У меня дела (есть работа)."},{"ko":"회의가 없어요? — 네, 없어요.","ru":"Совещания нет? — Да, нет."}]},{"id":"u6","sit":"Это есть, а того нет","phrase":"커피는 있어요. 우유는 없어요.","note":"은/는 вместо 이/가 — контраст, по-русски «а».","ex":[{"ko":"빵은 있어요. 밥은 없어요.","ru":"Хлеб есть, а риса нет."},{"ko":"책은 있어요. 신문은 없어요.","ru":"Книги есть, а газет нет."}]},{"id":"u7","sit":"Короткий ответ","phrase":"있어요. / 없어요.","note":"Предмет назван в вопросе — отвечают сказуемым с 네/아니요. На отрицательный вопрос 네 подтверждает отсутствие.","ex":[{"ko":"물이 있어요? — 아니요, 없어요.","ru":"Вода есть? — Нет."},{"ko":"차가 없어요? — 네, 없어요.","ru":"У тебя нет машины? — Да, нет."}]},{"id":"u8","sit":"«Есть кто-нибудь?»","phrase":"사람이 있어요?","note":"사람이 없어요 — «никого нет», буквально «людей нет». Отдельное «никто» не нужно.","ex":[{"ko":"사람이 있어요? — 아니요, 없어요.","ru":"Есть кто-нибудь? — Нет, никого."}]},{"id":"u9","sit":"Кто есть / находится?","phrase":"누가 있어요?","note":"누구 + 가 → 누가. Про людей в месте; не «кто там?» у двери. Ответ — N이/가 있어요.","ex":[{"ko":"방에 누가 있어요? — 친구가 있어요.","ru":"Кто в комнате? — Друг."}]},{"id":"u10","sit":"Что есть?","phrase":"뭐가 있어요?","note":"Спросить про ассортимент, меню, что есть в доме.","ex":[{"ko":"뭐가 있어요? — 빵이 있어요.","ru":"Что есть? — Есть хлеб."}]},{"id":"u11","sit":"«Вот, пожалуйста»","phrase":"여기 있어요.","note":"Протягивая вещь или деньги. Синоним — 여기요.","ex":[{"ko":"책이 있어요? — 네, 여기 있어요.","ru":"Книга есть? — Да, вот, пожалуйста."}]},{"id":"u12","sit":"Не путать: кто это / есть ли","phrase":"선생님이에요. / 선생님이 있어요.","note":"Первое — «это учитель», второе — «учитель есть, на месте».","ex":[{"ko":"선생님이 아니에요.","ru":"Это не учитель."},{"ko":"선생님이 없어요.","ru":"Учителя нет."}]}],"rel":[{"id":"이/가"},{"id":"은/는"},{"id":"아니에요"},{"id":"g1"},{"id":"g4"},{"id":"g3","label":"Тема 3: 에 — где находится"},{"id":"g46","label":"Тема 46: 은/는 vs 이/가"},{"id":"g12"},{"id":"g13"}],"new":["s6","u9","u10","u11"]},{"id":"g3","n":3,"title":"해요-форма + винительная 을/를 + локативы 에/에서","meaning":"Первые глаголы действия: «ем», «читаю», «иду в школу», «работаю в компании».\n**해요-форма** — вежливая разговорная форма глагола: основа + 아요/어요, у 하다-глаголов — 해요. Основной стиль речи с незнакомыми и старшими в быту.\n**을/를** помечает объект: что едят, читают, кого встречают.\n**에** — «куда» и «где находится», **에서** — «где происходит действие». Русское «в» делится между ними.","schema":[{"title":"해요-форма: основа + окончание","cols":["Последний гласный основы","Окончание","Примеры"],"rows":[["ㅏ, ㅗ","-아요","사다 → 사요 · 보다 → 봐요"],["любой другой","-어요","먹다 → 먹어요 · 읽다 → 읽어요 · 마시다 → 마셔요"],["глаголы на 하다","해요","공부하다 → 공부해요 · 일하다 → 일해요"]],"note":"Основа — всё, что перед 다. Смотрят на её последний гласный."},{"title":"Слияние гласных","cols":["Стык","Результат","Примеры"],"rows":[["ㅏ + 아요","-ㅏ요","가요 · 사요 · 자요 · 만나요"],["ㅗ + 아요","-ㅘ요","봐요 · 와요"],["ㅜ + 어요","-ㅝ요","줘요"],["ㅣ + 어요","-ㅕ요","마셔요 · 기다려요"],["ㅟ + 어요","не сливается","쉬어요"]],"note":""},{"title":"Объект: N + 을 / 를","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N을","밥을 · 책을 · 신문을"],["гласная","N를","커피를 · 친구를 · 우유를"]],"note":""},{"title":"에 или 에서","cols":["Вопрос","Частица","Пример"],"rows":[["куда?","에","학교에 가요."],["где находится?","에","집에 있어요."],["где происходит действие?","에서","도서관에서 공부해요."]],"note":"От 받침 не зависят: одна форма после любого звука."}],"sections":[{"id":"s1","title":"1. 해요-форма: как строится","body":"Словарная форма (가다, 먹다) в речи не употребляется. 다 отбрасывается, к основе прибавляется окончание.\nВыбор по последнему гласному основы: ㅏ или ㅗ → **아요**; любой другой → **어요**; все глаголы на 하다 → **해요**.\nОдна форма на все лица и числа: 먹어요 — «ем, ешь, ест, едим…». Кто — ясно из темы или ситуации.\nВремя — настоящее: действие сейчас и привычное («я (обычно) читаю»). Вопрос — та же форма + «?».\n받침 основы перетекает в окончание: 먹어요 [머거요], 읽어요 [일거요]. Пишется по основе: 먹어요.","ex":[{"ko":"밥을 먹어요.","ru":"Ем (рис, еду)."},{"ko":"책을 읽어요.","ru":"Читаю книгу."},{"ko":"한국어를 공부해요.","ru":"Учу корейский."},{"ko":"일해요?","ru":"Ты работаешь?"}]},{"id":"s2","title":"2. Слияние гласных","body":"Если основа кончается на гласный, он сливается с окончанием:\n가 + 아요 → **가요** (не 가아요); 만나 + 아요 → **만나요**.\n보 + 아요 → **봐요**; 오 + 아요 → **와요**.\n주 + 어요 → **줘요**.\n마시 + 어요 → **마셔요**; 기다리 + 어요 → **기다려요**.\n쉬다 не сливается: **쉬어요**.\nОстальные типы основ (ㄷ, ㄹ, 르, ㅡ) — тема 5.","ex":[{"ko":"친구를 만나요.","ru":"Встречаюсь с другом."},{"ko":"영화를 봐요.","ru":"Смотрю фильм."},{"ko":"친구가 와요.","ru":"Друг приходит."},{"ko":"친구를 기다려요.","ru":"Жду друга."}]},{"id":"s3","title":"3. Винительная частица 을/를","body":"을/를 помечает прямой объект — то, на что направлено действие. Выбор: 받침 → 을, гласная → 를. Слово не меняется, частица просто приклеивается.\nРасхождения с русским: 만나다 — «встречаться **с** кем-то», но объект с 을/를: 친구를 만나요. Так же 기다리다: 친구를 기다려요 — «жду друга».\nВопрос об объекте: 뭐를 / 무엇을 …? — «что?»; 누구를 …? — «кого? с кем?».\nПроизношение: 밥을 [바블], 책을 [채글].","ex":[{"ko":"신문을 읽어요.","ru":"Читаю газету."},{"ko":"우유를 마셔요.","ru":"Пью молоко."},{"ko":"무엇을 사요?","ru":"Что покупаешь?"},{"ko":"누구를 만나요?","ru":"С кем встречаешься?"}]},{"id":"s4","title":"4. 에: куда и где находится","body":"에 отвечает на два вопроса.\n**Куда?** — с 가다, 오다: 학교에 가요 — «иду в школу». Одна частица на русские «в», «на», «к»: 회사에 가요 — «иду на работу».\n**Где находится?** — с 있다/없다: 집에 있어요 — «я дома». Продолжение темы 2: место + 에, предмет + 이/가.\nПорядок: [место에] [что이/가] 있어요 — «в комнате есть книга». [что은/는] [место에] 있어요 — «книга — в комнате».\nВопрос: 어디에 가요? — «куда идёшь?»; 어디에 있어요? — «где?».","ex":[{"ko":"한국에 가요.","ru":"Еду в Корею."},{"ko":"집에 가요.","ru":"Иду домой."},{"ko":"방에 책이 있어요.","ru":"В комнате есть книга."},{"ko":"도서관은 어디에 있어요?","ru":"Где библиотека?"}]},{"id":"s5","title":"5. 에서: где происходит действие","body":"에서 помечает место действия: где едят, работают, учатся, отдыхают. 도서관에서 공부해요 — «занимаюсь в библиотеке».\nВопрос: 어디에서 …? — 어디에서 일해요? «где работаешь?».","ex":[{"ko":"회사에서 일해요.","ru":"Работаю в компании."},{"ko":"식당에서 밥을 먹어요.","ru":"Ем в столовой."},{"ko":"카페에서 커피를 마셔요.","ru":"Пью кофе в кафе."},{"ko":"집에서 쉬어요.","ru":"Отдыхаю дома."}]},{"id":"s6","title":"6. 에 или 에서","body":"Русское «в» делится надвое:\nнаходиться (있다/없다) или двигаться (가다, 오다) → **에**;\nлюбое другое действие → **에서**.\n집에 있어요 — «я дома» (нахожусь). 집에서 쉬어요 — «отдыхаю дома» (действие).\n학교에 가요 — «иду в школу» (направление). 학교에서 공부해요 — «учусь в школе» (действие).","ex":[{"ko":"도서관에 가요.","ru":"Иду в библиотеку."},{"ko":"도서관에서 책을 읽어요.","ru":"Читаю в библиотеке."},{"ko":"친구가 집에 있어요.","ru":"Друг дома."},{"ko":"친구가 집에서 자요.","ru":"Друг спит дома."}]},{"id":"s7","title":"7. Порядок слов","body":"Глагол — всегда последним. Обычный порядок перед ним: тема — место — объект — глагол.\n저는 도서관에서 책을 읽어요. — «Я читаю книгу в библиотеке».\nРоли держат частицы, поэтому середину можно переставить: 책을 도서관에서 읽어요 — тоже правильно. С конца глагол не уходит.","ex":[{"ko":"저는 카페에서 친구를 만나요.","ru":"Я встречаюсь с другом в кафе."},{"ko":"친구는 회사에서 일해요.","ru":"Друг работает в компании."}]},{"id":"s8","title":"8. Особые случаи","body":"В живой речи частицы часто выпадают: 밥 먹어요 вместо 밥을 먹어요; 어디 가요? вместо 어디에 가요?\n**뭐 해요?** — «что делаешь?», устойчивая фраза: 뭐 без 를.\n에서 значит ещё «из, от»: 친구가 한국에서 와요 — «друг приезжает из Кореи».","ex":[{"ko":"밥 먹어요.","ru":"Ем. (без 을)"},{"ko":"어디 가요?","ru":"Куда идёшь? (без 에)"},{"ko":"뭐 해요?","ru":"Что делаешь?"},{"ko":"친구가 한국에서 와요.","ru":"Друг приезжает из Кореи."}]}],"usage":[{"id":"u1","sit":"Что делаешь?","phrase":"뭐 해요?","note":"Самый частый бытовой вопрос. Ответ — глагол с объектом или местом.","ex":[{"ko":"뭐 해요? — 책을 읽어요.","ru":"Что делаешь? — Читаю."},{"ko":"뭐 해요? — 한국어를 공부해요.","ru":"Что делаешь? — Учу корейский."}]},{"id":"u2","sit":"Куда идёшь?","phrase":"어디에 가요?","note":"Ответ — N에 가요. 집에 가요 — «домой», 회사에 가요 — «на работу».","ex":[{"ko":"어디에 가요? — 학교에 가요.","ru":"Куда идёшь? — В школу."},{"ko":"회사에 가요.","ru":"Иду на работу."},{"ko":"집에 가요.","ru":"Иду домой."}]},{"id":"u3","sit":"Где ты? Где находится?","phrase":"어디에 있어요?","note":"О человеке — «где ты?», о месте — «где находится?». Ответ — N에 있어요 или 여기에/저기에 있어요.","ex":[{"ko":"어디에 있어요? — 집에 있어요.","ru":"Ты где? — Дома."},{"ko":"식당은 어디에 있어요? — 저기에 있어요.","ru":"Где ресторан? — Вон там."},{"ko":"선생님은 학교에 있어요.","ru":"Учитель в школе."}]},{"id":"u4","sit":"Где работаешь / учишься?","phrase":"어디에서 일해요?","note":"Место действия — 에서.","ex":[{"ko":"어디에서 일해요? — 회사에서 일해요.","ru":"Где работаешь? — В компании."},{"ko":"어디에서 한국어를 공부해요? — 학교에서 공부해요.","ru":"Где учишь корейский? — В школе."}]},{"id":"u5","sit":"Что ешь / пьёшь?","phrase":"뭐를 마셔요?","note":"Вопросительное слово + 을/를. 무엇을 — полная форма.","ex":[{"ko":"뭐를 마셔요? — 커피를 마셔요.","ru":"Что пьёшь? — Кофе."},{"ko":"무엇을 먹어요? — 빵을 먹어요.","ru":"Что ешь? — Хлеб."}]},{"id":"u6","sit":"Рассказать о привычке","phrase":"저는 도서관에서 공부해요.","note":"해요-форма — и «сейчас», и «обычно». Какое значение — ясно из разговора.","ex":[{"ko":"저는 카페에서 커피를 마셔요.","ru":"Я (обычно) пью кофе в кафе."},{"ko":"친구는 집에서 일해요.","ru":"Друг работает из дома."}]},{"id":"u7","sit":"С кем встречаешься?","phrase":"누구를 만나요?","note":"Русское «с кем» = 누구를. Где встречаются — 에서.","ex":[{"ko":"누구를 만나요? — 친구를 만나요.","ru":"С кем встречаешься? — С другом."},{"ko":"카페에서 선생님을 만나요.","ru":"Встречаюсь с учителем в кафе."}]},{"id":"u8","sit":"Кого / что ждёшь?","phrase":"친구를 기다려요.","note":"기다리다 + 을/를: «ждать кого-то».","ex":[{"ko":"누구를 기다려요? — 선생님을 기다려요.","ru":"Кого ждёшь? — Учителя."}]},{"id":"u9","sit":"Есть ли что-то в каком-то месте","phrase":"가게에 우유가 있어요?","note":"Место + 에, предмет + 이/가, в конце 있어요/없어요.","ex":[{"ko":"가게에 우유가 있어요? — 네, 있어요.","ru":"В магазине есть молоко? — Да."},{"ko":"집에 사람이 없어요.","ru":"Дома никого нет."}]},{"id":"u10","sit":"Кто-то приходит","phrase":"친구가 집에 와요.","note":"오다 — «приходить сюда, ко мне». Куда — 에.","ex":[{"ko":"선생님이 학교에 와요.","ru":"Учитель приходит в школу."},{"ko":"선생님이 와요?","ru":"Учитель придёт?"}]},{"id":"u11","sit":"Нахожусь / делаю","phrase":"집에 있어요. 집에서 쉬어요.","note":"Одно и то же место: с 있다 — 에, с действием — 에서.","ex":[{"ko":"도서관에 있어요. 도서관에서 공부해요.","ru":"Я в библиотеке. Занимаюсь в библиотеке."}]},{"id":"u12","sit":"Смотреть фильм","phrase":"영화를 봐요.","note":"보다 → 봐요.","ex":[{"ko":"집에서 영화를 봐요.","ru":"Смотрю фильм дома."},{"ko":"뭐를 봐요? — 한국 영화를 봐요.","ru":"Что смотришь? — Корейский фильм."}]},{"id":"u13","sit":"Кто что делает","phrase":"저는 책을 읽어요. 친구는 신문을 읽어요.","note":"은/는 из темы 1 — контраст между людьми, «а».","ex":[{"ko":"저는 커피를 마셔요. 친구는 우유를 마셔요.","ru":"Я пью кофе, а друг — молоко."}]},{"id":"u14","sit":"Предложить / попросить","phrase":"같이 공원에 가요!","note":"해요 собеседнику: по интонации — «давай…» или мягкое «…те» (여기에 써요). Разбор — Практикум 1, часть «Договориться».","ex":[{"ko":"저하고 영화를 봐요.","ru":"Давай посмотрим фильм (со мной)."},{"ko":"여기에서 기다려요.","ru":"Ждите здесь."}]}],"rel":[{"id":"아요/어요"},{"id":"을/를"},{"id":"에"},{"id":"에서"},{"id":"g2"},{"id":"g4"},{"id":"g5","label":"Тема 5: 해요 для ㄷ-, ㄹ-, 르-, ㅡ-основ"},{"id":"g6","label":"Тема 6: прошедшее 았/었어요"},{"id":"g9"},{"id":"g14"}],"new":["s8","u1","u14"]},{"id":"g4","n":4,"title":"형용사 как сказуемое + наречие степени 아주","meaning":"Признаки: «кофе дорогой», «очень вкусно», «людей много», «мне нравится».\n**형용사** — глаголы-прилагательные: 좋다 «быть хорошим», 비싸다 «быть дорогим». Сами являются сказуемым и спрягаются как глаголы: 좋아요, 비싸요. Связка 이다 не нужна.\n**아주** — «очень», ставится прямо перед 형용사.","schema":[{"title":"형용사 в 해요-форме","cols":["Последний гласный основы","Окончание","Примеры"],"rows":[["ㅏ, ㅗ","-아요","좋아요 · 작아요 · 많아요 · 짧아요 · 비싸요 · 싸요"],["любой другой","-어요","적어요 · 맛있어요 · 느려요"]],"note":"Правила те же, что у глаголов (тема 3). Основы на ㅡ, 르, ㄹ — тема 5; на ㅂ (쉽다, 어렵다, 새롭다) — тема 18."},{"title":"Предложение","cols":["По-русски","По-корейски"],"rows":[["Кофе дорогой.","커피가 비싸요."],["Этот ресторан хороший.","이 식당은 좋아요."],["Очень вкусно!","아주 맛있어요."],["Мне нравится кофе.","저는 커피가 좋아요."]],"note":"Носитель признака — 이/가 или 은/는. 형용사 — последним."},{"title":"Существительное или 형용사","cols":["По-русски","По-корейски"],"rows":[["(Это) студент.","학생이에요."],["(Это) дорого.","비싸요."]],"note":"Существительное + 이다; 형용사 — без связки."}],"sections":[{"id":"s1","title":"1. Что такое 형용사","body":"Прилагательных в русском смысле в корейском нет. «Хороший», «дорогой» — это глаголы состояния: 좋다 «быть хорошим», 비싸다 «быть дорогим». В словаре — на 다, как глаголы.\nОни сами — сказуемое и стоят в конце фразы. Связка 이다 не нужна: 비싸요 — «дорого», без 이에요.\nПереводить удобно через «быть»: 커피가 비싸요 — «кофе является дорогим» = «кофе дорогой».\n«Дорогой кофе» — признак перед существительным — особая форма, тема 39.","ex":[{"ko":"비싸요.","ru":"Дорого."},{"ko":"좋아요.","ru":"Хорошо."},{"ko":"커피가 비싸요.","ru":"Кофе дорогой."}]},{"id":"s2","title":"2. Спряжение — как у глаголов","body":"해요-форма строится по правилам темы 3: ㅏ/ㅗ → 아요, другое → 어요, гласные сливаются.\n좋다 → 좋아요 [조아요]: ㅎ между гласными не читается. 많다 → 많아요 [마나요]. 작다 → 작아요, 짧다 → 짧아요 [짤바요], 비싸다 → 비싸요, 싸다 → 싸요.\n적다 → 적어요, 맛있다 → 맛있어요 [마시써요], 느리다 → 느려요.\nВопрос — та же форма с подъёмом тона: 비싸요? — «дорого?».","ex":[{"ko":"빵이 싸요.","ru":"Хлеб дешёвый."},{"ko":"사람이 많아요.","ru":"Людей много."},{"ko":"이 차는 느려요.","ru":"Эта машина медленная."},{"ko":"우유가 적어요.","ru":"Молока мало."}]},{"id":"s3","title":"3. Подлежащее и тема","body":"Носитель признака — подлежащее с 이/가 или тема с 은/는, как в темах 1–2.\n**이/가** — сообщаю новое: 커피가 맛있어요 — «кофе вкусный».\n**은/는** — говорю о теме или сопоставляю: 이 식당은 싸요 — «этот ресторан — дешёвый»; 커피는 비싸요. 빵은 싸요. — «кофе дорогой, а хлеб дешёвый».\nЕсли предмет ясен, его опускают: 맛있어요! — «вкусно!».","ex":[{"ko":"커피가 맛있어요.","ru":"Кофе вкусный."},{"ko":"이 식당은 싸요.","ru":"Этот ресторан дешёвый."},{"ko":"커피는 비싸요. 빵은 싸요.","ru":"Кофе дорогой, а хлеб дешёвый."}]},{"id":"s4","title":"4. 아주 — «очень»","body":"아주 ставится непосредственно перед 형용사: 아주 좋아요 — «очень хорошо». Само не спрягается и сказуемым не бывает.\nПорядок: [что이/가] 아주 [형용사]. 커피가 아주 비싸요 — наречие рядом со сказуемым.","ex":[{"ko":"아주 맛있어요.","ru":"Очень вкусно."},{"ko":"이 식당은 아주 좋아요.","ru":"Этот ресторан очень хороший."},{"ko":"사람이 아주 많아요.","ru":"Людей очень много."}]},{"id":"s5","title":"5. 많다 / 적다 — «много / мало»","body":"Русское «много» — наречие, корейское 많다 — сказуемое: «людей много» = 사람이 많아요, буквально «люди многочисленны». Чего много — подлежащее с 이/가.\n적다 — «мало» так же: 사람이 적어요 — «людей мало».\n«Много + действие» («много ем») — другое слово, 많이; пока не изучено.","ex":[{"ko":"식당이 많아요.","ru":"Ресторанов много."},{"ko":"사람이 적어요.","ru":"Людей мало."},{"ko":"식당에 사람이 많아요.","ru":"В ресторане много людей."}]},{"id":"s6","title":"6. 좋다: «хороший» и «нравится»","body":"좋다 — «хороший, хорошо».\nС темой-человеком получается «нравится»: 저는 커피가 좋아요 — «мне нравится кофе», буквально «что касается меня — кофе хорош». Схема та же, что у «у меня есть» (тема 2): кому — 은/는, что — 이/가.\nОбъект с 을/를 здесь не ставится: 좋다 — состояние, а не действие.","ex":[{"ko":"저는 한국 음식이 좋아요.","ru":"Мне нравится корейская еда."},{"ko":"저는 커피가 좋아요. 친구는 차가 좋아요.","ru":"Мне нравится кофе, а другу — чай."},{"ko":"이 카페가 좋아요.","ru":"Мне нравится это кафе."}]},{"id":"s7","title":"7. 맛있다","body":"맛있다 = 맛 «вкус» + 있다 «есть» → «вкусный». Спрягается как 있다: 맛있어요 [마시써요].\nГлавная фраза за столом — и похвала, и ответ на вопрос «как?».","ex":[{"ko":"이 빵은 맛있어요.","ru":"Этот хлеб вкусный."},{"ko":"한국 음식이 맛있어요?","ru":"Корейская еда вкусная?"}]}],"usage":[{"id":"u1","sit":"Похвалить еду","phrase":"아주 맛있어요!","note":"За столом, в кафе, в гостях. Предмет не называют — он перед глазами.","ex":[{"ko":"이 빵이 아주 맛있어요.","ru":"Этот хлеб очень вкусный."},{"ko":"한국 음식은 맛있어요.","ru":"Корейская еда вкусная."}]},{"id":"u2","sit":"Спросить о цене","phrase":"비싸요?","note":"«Дорого?» Ответ — 네, 비싸요 / 아니요, 싸요.","ex":[{"ko":"커피가 비싸요? — 아니요, 싸요.","ru":"Кофе дорогой? — Нет, дешёвый."},{"ko":"이 가게는 싸요.","ru":"В этом магазине дёшево."}]},{"id":"u3","sit":"Сказать, что нравится","phrase":"저는 커피가 좋아요.","note":"Кому — 은/는, что — 이/가.","ex":[{"ko":"저는 한국 영화가 좋아요.","ru":"Мне нравятся корейские фильмы."},{"ko":"저는 이 공원이 좋아요.","ru":"Мне нравится этот парк."}]},{"id":"u4","sit":"Оценить место","phrase":"이 식당은 좋아요.","note":"Место — тема. Двойная схема «X은/는 Y이/가 형용사» — «в X (какой-то) Y»: 이 공원은 사람이 많아요 — «в этом парке много людей».","ex":[{"ko":"이 카페는 아주 좋아요.","ru":"Это кафе очень хорошее."},{"ko":"이 공원은 사람이 많아요.","ru":"В этом парке много людей."},{"ko":"이 식당은 커피가 비싸요.","ru":"В этом ресторане дорогой кофе."}]},{"id":"u5","sit":"Много / мало людей","phrase":"사람이 많아요.","note":"Где — 에: 카페에 사람이 많아요.","ex":[{"ko":"카페에 사람이 적어요.","ru":"В кафе мало людей."},{"ko":"학교에 학생이 많아요.","ru":"В школе много учеников."}]},{"id":"u6","sit":"Сопоставить","phrase":"커피는 비싸요. 차는 싸요.","note":"은/는 на обоих — «а».","ex":[{"ko":"이 식당은 비싸요. 저 식당은 싸요.","ru":"Этот ресторан дорогой, а вон тот — дешёвый."}]},{"id":"u7","sit":"«Хорошо! Отлично!»","phrase":"좋아요.","note":"Одно слово — отклик: «хорошо», «отлично», «согласен».","ex":[{"ko":"여기는 공원이에요. — 좋아요!","ru":"Здесь парк. — Отлично!"}]},{"id":"u8","sit":"Спросить впечатление","phrase":"한국 음식이 맛있어요?","note":"«Как тебе…?» — вопрос с 형용사.","ex":[{"ko":"이 책이 좋아요? — 네, 아주 좋아요.","ru":"Книга хорошая? — Да, очень."},{"ko":"그 식당은 비싸요? — 아니요, 싸요.","ru":"Тот ресторан дорогой? — Нет, дешёвый."}]},{"id":"u9","sit":"Объяснить выбор","phrase":"이 식당은 싸요. 여기에서 밥을 먹어요.","note":"Признак + действие — две фразы, связок пока нет.","ex":[{"ko":"이 카페는 커피가 맛있어요. 여기에서 친구를 만나요.","ru":"В этом кафе вкусный кофе. Встречаюсь здесь с другом."}]},{"id":"u10","sit":"Короткое / медленное","phrase":"이 영화는 짧아요.","note":"짧다 → 짧아요 [짤바요]; 느리다 → 느려요.","ex":[{"ko":"이름이 짧아요.","ru":"Имя короткое."},{"ko":"이 차는 아주 느려요.","ru":"Эта машина очень медленная."}]}],"rel":[{"id":"아요/어요"},{"id":"이/가"},{"id":"은/는"},{"id":"g2"},{"id":"g3"},{"id":"g7"},{"id":"g5","label":"Тема 5: 크다, 바쁘다, 빠르다, 길다…"},{"id":"g18","label":"Тема 18: ㅂ-불규칙 (쉽다, 어렵다)"},{"id":"g39","label":"Тема 39: «дорогой кофе» — причастие"},{"id":"g42","label":"Тема 42: сравнение 보다, 제일"}],"new":["u7"]},{"id":"g5","n":5,"title":"해요-форма новых типов основ (ㄷ-, ㄹ-, 르-, ㅡ-)","meaning":"Основы, которые при встрече с 아요/어요 меняются или ведут себя по-особому.\n**ㄷ** (듣다, 걷다): ㄷ → ㄹ. **ㄹ** (알다, 만들다, 길다): в 해요 — как обычно. **르** (모르다, 빠르다): 르 → ㄹㄹ. **ㅡ** (쓰다, 크다, 바쁘다…): ㅡ выпадает.\nОкончание то же — 아요/어요; меняется только стык с основой. Среди этих слов — самые частые в быту: 몰라요, 바빠요, 아파요, 예뻐요.","schema":[{"title":"Сводка","cols":["Тип","Правило","Примеры"],"rows":[["ㄷ (часть глаголов)","ㄷ → ㄹ + 어요","듣다 → 들어요 · 걷다 → 걸어요"],["ㄹ","как обычно","알다 → 알아요 · 만들다 → 만들어요 · 길다 → 길어요"],["르","ㄹ + ㄹ + 아/어요","모르다 → 몰라요 · 빠르다 → 빨라요"],["ㅡ","без ㅡ + 아/어요","바쁘다 → 바빠요 · 크다 → 커요"]],"note":""},{"title":"ㅡ: выбор 아 / 어","cols":["Слог перед ㅡ","Окончание","Примеры"],"rows":[["гласный ㅏ, ㅗ","-아요","바빠요 · 아파요 · 나빠요"],["другой гласный","-어요","예뻐요"],["слова нет (один слог)","-어요","써요 · 커요"]],"note":"Смотрят на гласный слога ПЕРЕД ㅡ: 바쁘 → 바 → 아요."},{"title":"르: выбор 라 / 러","cols":["Гласный перед 르","Результат","Примеры"],"rows":[["ㅏ, ㅗ","-ㄹ라요","모르다 → 몰라요 · 빠르다 → 빨라요"],["другой","-ㄹ러요","부르다 → 불러요 (не изучено)"]],"note":"ㄹ от 르 уходит в 받침 предыдущего слога, вторая ㄹ начинает окончание."}],"sections":[{"id":"s1","title":"1. ㄷ-основы: ㄷ → ㄹ","body":"У 듣다 и 걷다 перед гласным окончания ㄷ превращается в ㄹ: 듣 + 어요 → **들어요**, 걷 + 어요 → **걸어요**.\nПроизношение: 들어요 [드러요], 걸어요 [거러요].\nПравило касается не всех глаголов на ㄷ: есть и обычные (받다 → 받아요, не изучено). Тип запоминается со словом.","ex":[{"ko":"한국어를 들어요.","ru":"Слушаю корейскую речь."},{"ko":"공원에서 걸어요.","ru":"Гуляю (хожу пешком) в парке."}]},{"id":"s2","title":"2. ㄹ-основы: в 해요 — как обычно","body":"알다, 만들다, 길다 в 해요-форме спрягаются по общему правилу: 알 + 아요 → **알아요**, 만들 + 어요 → **만들어요**, 길 + 어요 → **길어요**.\nОсобенность ㄹ-основ — выпадение ㄹ перед некоторыми окончаниями (перед ㄴ, ㅂ, ㅅ). В 해요 этого нет; встретится в темах 20 и 25.\nПроизношение: 알아요 [아라요], 만들어요 [만드러요], 길어요 [기러요].","ex":[{"ko":"그 사람을 알아요.","ru":"Я знаю того человека."},{"ko":"집에서 빵을 만들어요.","ru":"Пеку хлеб дома."},{"ko":"이름이 길어요.","ru":"Имя длинное."}]},{"id":"s3","title":"3. 르-основы: 르 → ㄹㄹ","body":"Перед 아/어 слог 르 распадается: ㄹ уходит в 받침 предыдущего слога, к окончанию добавляется ещё одна ㄹ.\n모르 + 아요 → 몰 + 라요 → **몰라요**. 빠르 + 아요 → 빨 + 라요 → **빨라요**.\n아 или 어 выбирается по гласному перед 르: 모 (ㅗ), 빠 (ㅏ) → 라요.","ex":[{"ko":"몰라요.","ru":"Не знаю."},{"ko":"이 차는 아주 빨라요.","ru":"Эта машина очень быстрая."}]},{"id":"s4","title":"4. ㅡ-основы: ㅡ выпадает","body":"Если основа кончается на ㅡ, он выпадает, а окончание выбирается по гласному предыдущего слога.\n바쁘 → 바 (ㅏ) → **바빠요**; 아프 → **아파요**; 나쁘 → **나빠요**.\n예쁘 → 예 (ㅖ) → **예뻐요**.\nОдносложные (쓰다, 크다): предыдущего слога нет → 어요: **써요**, **커요**.","ex":[{"ko":"저는 아주 바빠요.","ru":"Я очень занят."},{"ko":"친구가 아파요.","ru":"Друг болеет."},{"ko":"공원이 예뻐요.","ru":"Парк красивый."},{"ko":"이 방은 커요.","ru":"Эта комната большая."}]},{"id":"s5","title":"5. 알다 ↔ 모르다","body":"«Знать» и «не знать» — пара отдельных глаголов, как 있다 ↔ 없다. «Не знаю» — только **몰라요**; отрицание от 알다 так не говорят (отрицание — тема 13).\nЧто знают — объект с 을/를: 그 사람을 알아요. Если объект ясен, одно слово: 알아요 / 몰라요.","ex":[{"ko":"이름을 알아요? — 아니요, 몰라요.","ru":"Знаешь имя? — Нет, не знаю."},{"ko":"저는 한국어를 몰라요.","ru":"Я не знаю корейского."}]},{"id":"s6","title":"6. Как определить тип","body":"Смотри на конец основы (перед 다):\nㅡ (쓰, 크, 바쁘) → ㅡ-тип.\n르 (모르, 빠르) → 르-тип.\nㄹ (알, 만들, 길) → в 해요 — как обычно.\nㄷ (듣, 걷) → проверять по словарю: ㄷ-тип или обычный.\nОстальные — общие правила темы 3. ㅂ-основы (쉽다, 어렵다, 새롭다) — тема 18.","ex":[]}],"usage":[{"id":"u1","sit":"Знаю / не знаю","phrase":"몰라요.","note":"Самый частый ответ ученика. Вежливо и нейтрально.","ex":[{"ko":"이름을 알아요? — 아니요, 몰라요.","ru":"Знаешь, как его зовут? — Нет."},{"ko":"저는 그 식당을 알아요.","ru":"Я знаю этот ресторан."}]},{"id":"u2","sit":"Я занят","phrase":"바빠요.","note":"Отказ, объяснение, ответ на «как дела». Кто занят — тема или опущено.","ex":[{"ko":"저는 아주 바빠요.","ru":"Я очень занят."},{"ko":"선생님은 바빠요? — 네, 바빠요.","ru":"Учитель занят? — Да."}]},{"id":"u3","sit":"Мне плохо / болеет","phrase":"아파요.","note":"Без подлежащего — «мне плохо, болит». О другом — с 이/가.","ex":[{"ko":"아주 아파요.","ru":"Очень больно / очень плохо."},{"ko":"친구가 아파요.","ru":"Друг болеет."}]},{"id":"u4","sit":"Красиво","phrase":"예뻐요!","note":"О вещах, местах, людях. Частый комплимент.","ex":[{"ko":"공원이 아주 예뻐요.","ru":"Парк очень красивый."},{"ko":"옷이 예뻐요.","ru":"Красивая одежда."}]},{"id":"u5","sit":"Большой / маленький","phrase":"커요. / 작아요.","note":"크다 → 커요 (ㅡ-тип), 작다 → 작아요 (обычный).","ex":[{"ko":"이 방은 커요. 저 방은 작아요.","ru":"Эта комната большая, а вон та — маленькая."},{"ko":"집이 아주 커요.","ru":"Дом очень большой."}]},{"id":"u6","sit":"Быстро / медленно","phrase":"빨라요.","note":"빠르다 → 빨라요, 느리다 → 느려요.","ex":[{"ko":"이 차는 빨라요. 저 차는 느려요.","ru":"Эта машина быстрая, а та — медленная."}]},{"id":"u7","sit":"Длинно","phrase":"길어요.","note":"길다 → 길어요, пара — 짧아요.","ex":[{"ko":"영화가 아주 길어요.","ru":"Фильм очень длинный."},{"ko":"이 이름은 길어요. 그 이름은 짧아요.","ru":"Это имя длинное, а то — короткое."}]},{"id":"u8","sit":"Писать","phrase":"이름을 써요.","note":"쓰다 → 써요. Второе значение 쓰다 — «использовать».","ex":[{"ko":"여기에 이름을 써요.","ru":"Пишу имя здесь."},{"ko":"친구는 책을 써요.","ru":"Друг пишет книгу."}]},{"id":"u9","sit":"Делать, готовить","phrase":"빵을 만들어요.","note":"만들다 — сделать своими руками: еду, вещь.","ex":[{"ko":"뭐를 만들어요? — 빵을 만들어요.","ru":"Что делаешь? — Пеку хлеб."},{"ko":"집에서 한국 음식을 만들어요.","ru":"Готовлю дома корейскую еду."}]},{"id":"u10","sit":"Гулять пешком","phrase":"공원에서 걸어요.","note":"걷다 → 걸어요. Место действия — 에서.","ex":[{"ko":"친구는 공원에서 걸어요.","ru":"Друг гуляет в парке."}]},{"id":"u11","sit":"Плохой","phrase":"나빠요.","note":"나쁘다 → 나빠요. Пара — 좋아요.","ex":[{"ko":"그 사람은 나빠요.","ru":"Он плохой человек."},{"ko":"이 식당은 좋아요. 저 식당은 나빠요.","ru":"Этот ресторан хороший, а тот — плохой."}]}],"rel":[{"id":"아요/어요"},{"id":"g3"},{"id":"g4"},{"id":"g6"},{"id":"g7"},{"id":"g13"},{"id":"g18","label":"Тема 18: ㅂ-불규칙"},{"id":"g19","label":"Тема 19: ㅅ-불규칙 + сводная"},{"id":"g20","label":"Тема 20: 합니다 (ㄹ выпадает)"}],"new":[]},{"id":"g6","n":6,"title":"Прошедшее время глаголов действия 았/었어요","meaning":"«Ел», «пошёл», «встретился», «купил» — рассказ о сделанном.\nПрошедшее строится вставкой **았/었** между основой и 어요: 가 + 았 + 어요 → 갔어요. Выбор 았/었 — по тем же правилам, что 아요/어요.\nСовершенного и несовершенного вида нет: 먹었어요 — и «ел», и «поел».","schema":[{"title":"Основа + 았/었 + 어요","cols":["Последний гласный основы","Окончание","Примеры"],"rows":[["ㅏ, ㅗ","-았어요","샀어요 · 갔어요 · 봤어요 · 왔어요"],["любой другой","-었어요","먹었어요 · 읽었어요 · 마셨어요 · 줬어요"],["하다","했어요","공부했어요 · 일했어요"]],"note":"После ㅆ всегда 어요."},{"title":"Короткий путь: от 해요-формы","cols":["Настоящее","Прошедшее"],"rows":[["가요","갔어요"],["봐요","봤어요"],["마셔요","마셨어요"],["해요","했어요"],["들어요","들었어요"],["몰라요","몰랐어요"],["써요","썼어요"],["쉬어요","쉬었어요"]],"note":"Убрать 요, дописать ㅆ в 받침 последнего слога, добавить 어요. Работает для всех типов основ."}],"sections":[{"id":"s1","title":"1. Как строится","body":"Между основой и 어요 вставляется показатель прошедшего 았/었.\nㅏ или ㅗ в последнем слоге → **았**: 사 + 았 → 샀어요, 보 + 았 → 봤어요.\nлюбой другой → **었**: 먹 + 었 → 먹었어요, 마시 + 었 → 마셨어요.\n하다 → **했어요**: 공부했어요, 일했어요.\nСлияние гласных — как в настоящем: 가 + 았 → 갔 (не 가았), 주 + 었 → 줬.","ex":[{"ko":"밥을 먹었어요.","ru":"Я поел."},{"ko":"친구를 만났어요.","ru":"Встретился с другом."},{"ko":"한국어를 공부했어요.","ru":"Учил корейский."}]},{"id":"s2","title":"2. Короткий путь через 해요-форму","body":"Если 해요-форма уже известна, прошедшее получается из неё механически: убрать 요, добавить ㅆ в 받침 последнего слога, дописать 어요.\n가요 → 가 → 갔 → **갔어요**. 마셔요 → 마셔 → 마셨 → **마셨어요**. 먹어요 → 먹어 → 먹었 → **먹었어요**.\nТак же со всеми типами основ из темы 5: 들어요 → 들었어요, 몰라요 → 몰랐어요, 써요 → 썼어요.","ex":[{"ko":"영화를 봤어요.","ru":"Посмотрел фильм."},{"ko":"커피를 마셨어요.","ru":"Выпил кофе."}]},{"id":"s3","title":"3. Типы основ темы 5 в прошедшем","body":"Изменения основы те же, что в настоящем:\nㄷ → ㄹ: 듣다 → **들었어요**, 걷다 → **걸었어요**.\nㄹ — как обычно: 알다 → **알았어요**, 만들다 → **만들었어요**.\n르 → ㄹㄹ: 모르다 → **몰랐어요**.\nㅡ выпадает: 쓰다 → **썼어요**.","ex":[{"ko":"한국어를 들었어요.","ru":"Слушал корейскую речь."},{"ko":"공원에서 걸었어요.","ru":"Гулял в парке."},{"ko":"빵을 만들었어요.","ru":"Испёк хлеб."},{"ko":"이름을 썼어요.","ru":"Написал имя."}]},{"id":"s4","title":"4. Значение: вида нет","body":"Русское различие «делал / сделал» корейское прошедшее не передаёт: 책을 읽었어요 — «читал книгу» и «прочитал книгу». Нужный смысл — из контекста.\nЧасто прошедшее описывает результат, который есть сейчас: 친구가 왔어요 — «друг пришёл» (и он здесь).\nОдна форма на все лица: 갔어요 — «я пошёл», «ты пошёл», «они пошли».","ex":[{"ko":"책을 읽었어요.","ru":"Читал / прочитал книгу."},{"ko":"친구가 왔어요.","ru":"Друг пришёл."}]},{"id":"s5","title":"5. Произношение и написание","body":"ㅆ стоит в 받침 и перетекает в 어요: 갔어요 [가써요], 했어요 [해써요], 먹었어요 [머거써요], 봤어요 [봐써요].\nПишется по составу: 갔어요, 먹었어요 — ㅆ на своём месте, в 받침.","ex":[]}],"usage":[{"id":"u1","sit":"Что делал?","phrase":"뭐 했어요?","note":"Прошедшее от «뭐 해요?». Ответ — любой глагол в прошедшем.","ex":[{"ko":"뭐 했어요? — 영화를 봤어요.","ru":"Что делал? — Смотрел фильм."},{"ko":"뭐 했어요? — 집에서 쉬었어요.","ru":"Что делал? — Отдыхал дома."}]},{"id":"u2","sit":"«Ты поел?»","phrase":"밥을 먹었어요?","note":"Частый вопрос-забота, почти как «как дела». Буквально про еду, но по смыслу — внимание к человеку.","ex":[{"ko":"밥을 먹었어요? — 네, 먹었어요.","ru":"Поел? — Да, поел."}]},{"id":"u3","sit":"Куда ходил?","phrase":"어디에 갔어요?","note":"Ответ — N에 갔어요.","ex":[{"ko":"어디에 갔어요? — 도서관에 갔어요.","ru":"Куда ходил? — В библиотеку."},{"ko":"친구 집에 갔어요.","ru":"Ходил к другу домой."}]},{"id":"u4","sit":"С кем встречался?","phrase":"누구를 만났어요?","note":"만나다 → 만났어요.","ex":[{"ko":"카페에서 선생님을 만났어요.","ru":"Встретился с учителем в кафе."},{"ko":"누구를 만났어요? — 친구를 만났어요.","ru":"С кем встречался? — С другом."}]},{"id":"u5","sit":"Что купил?","phrase":"뭐를 샀어요?","note":"사다 → 샀어요.","ex":[{"ko":"가게에서 빵을 샀어요.","ru":"Купил хлеб в магазине."},{"ko":"옷을 샀어요.","ru":"Купил одежду."}]},{"id":"u6","sit":"Смотрел, читал","phrase":"영화를 봤어요.","note":"보다 → 봤어요, 읽다 → 읽었어요.","ex":[{"ko":"집에서 한국 영화를 봤어요.","ru":"Смотрел дома корейский фильм."},{"ko":"신문을 읽었어요.","ru":"Читал газету."}]},{"id":"u7","sit":"Кто-то пришёл","phrase":"친구가 왔어요.","note":"Прошедшее = результат: пришёл и сейчас здесь.","ex":[{"ko":"선생님이 왔어요? — 네, 왔어요.","ru":"Учитель пришёл? — Да."}]},{"id":"u8","sit":"«Не знал»","phrase":"몰랐어요.","note":"Реакция на новость: «я не знал (а теперь знаю)».","ex":[{"ko":"아, 몰랐어요.","ru":"А, я не знал."}]},{"id":"u9","sit":"«Понял, хорошо»","phrase":"알았어요.","note":"Ответ на просьбу или указание: «понял, принято». Не «знал».","ex":[{"ko":"여기에 이름을 써요. — 네, 알았어요.","ru":"Здесь пишете имя. — Да, понял."}]},{"id":"u10","sit":"Работал, учился","phrase":"회사에서 일했어요.","note":"하다 → 했어요.","ex":[{"ko":"도서관에서 공부했어요.","ru":"Занимался в библиотеке."},{"ko":"한국에서 한국어를 공부했어요.","ru":"Учил корейский в Корее."}]},{"id":"u11","sit":"Отдыхал, спал","phrase":"집에서 쉬었어요.","note":"쉬다 → 쉬었어요 (без слияния), 자다 → 잤어요.","ex":[{"ko":"집에서 잤어요.","ru":"Спал дома."}]},{"id":"u12","sit":"Сделал, приготовил","phrase":"빵을 만들었어요.","note":"만들다 → 만들었어요.","ex":[{"ko":"한국 음식을 만들었어요.","ru":"Приготовил корейскую еду."}]},{"id":"u13","sit":"Я — одно, друг — другое","phrase":"저는 커피를 마셨어요. 친구는 차를 마셨어요.","note":"은/는 — контраст.","ex":[{"ko":"저는 책을 읽었어요. 친구는 영화를 봤어요.","ru":"Я читал, а друг смотрел фильм."}]}],"rel":[{"id":"았/었"},{"id":"아요/어요"},{"id":"g3"},{"id":"g5"},{"id":"g7"},{"id":"g8"},{"id":"g9"},{"id":"g13"}],"new":["u1","u9"]},{"id":"g7","n":7,"title":"Прошедшее время 형용사","meaning":"«Было вкусно», «было дорого», «был занят», «людей было много» — оценка и состояние в прошлом.\n형용사 получают тот же показатель 았/었, что и глаголы действия. Русскому «был, было» отдельное слово не соответствует: 비쌌어요 = «было дорого».","schema":[{"title":"Основа + 았/었 + 어요","cols":["Последний гласный основы","Окончание","Примеры"],"rows":[["ㅏ, ㅗ","-았어요","좋았어요 · 작았어요 · 많았어요 · 짧았어요 · 비쌌어요 · 쌌어요"],["любой другой","-었어요","적었어요 · 맛있었어요 · 느렸어요 · 길었어요"]],"note":""},{"title":"Типы основ темы 5","cols":["Настоящее","Прошедшее"],"rows":[["바빠요","바빴어요"],["아파요","아팠어요"],["예뻐요","예뻤어요"],["커요","컸어요"],["나빠요","나빴어요"],["빨라요","빨랐어요"],["길어요","길었어요"]],"note":"Короткий путь из темы 6: убрать 요, ㅆ в 받침, 어요."},{"title":"있다 / 없다","cols":["Настоящее","Прошедшее"],"rows":[["있어요","있었어요"],["없어요","없었어요"],["맛있어요","맛있었어요"]],"note":"Звучат [이써써요], [업써써요], [마시써써요]."}],"sections":[{"id":"s1","title":"1. Как строится","body":"Как у глаголов (тема 6): основа + 았/었 + 어요.\nㅏ, ㅗ → **았어요**: 좋았어요, 작았어요, 많았어요, 짧았어요; со слиянием — 비쌌어요, 쌌어요.\nдругой гласный → **었어요**: 적었어요, 맛있었어요, 길었어요; 느리 + 었 → 느렸어요.","ex":[{"ko":"커피가 비쌌어요.","ru":"Кофе был дорогой."},{"ko":"사람이 많았어요.","ru":"Людей было много."},{"ko":"이름이 길었어요.","ru":"Имя было длинное."}]},{"id":"s2","title":"2. Типы основ темы 5","body":"Изменения основы те же:\nㅡ выпадает: 바쁘다 → **바빴어요**, 아프다 → **아팠어요**, 나쁘다 → **나빴어요**, 예쁘다 → **예뻤어요**, 크다 → **컸어요**.\n르 → ㄹㄹ: 빠르다 → **빨랐어요**.\nㄹ — как обычно: 길다 → **길었어요**.\nㅂ-основы (쉽다, 어렵다, 새롭다) — тема 18.","ex":[{"ko":"저는 아주 바빴어요.","ru":"Я был очень занят."},{"ko":"공원이 예뻤어요.","ru":"Парк был красивый."},{"ko":"방이 컸어요.","ru":"Комната была большая."}]},{"id":"s3","title":"3. 있다 / 없다 и 맛있다","body":"있다 и 없다 спрягаются по тому же правилу: **있었어요** «был, имелся», **없었어요** «не было».\n맛있다 идёт за 있다: **맛있었어요** — «было вкусно».\nПроизношение: 있었어요 [이써써요], 없었어요 [업써써요].","ex":[{"ko":"집에 친구가 있었어요.","ru":"Дома был друг."},{"ko":"가게에 우유가 없었어요.","ru":"В магазине не было молока."},{"ko":"아주 맛있었어요.","ru":"Было очень вкусно."}]},{"id":"s4","title":"4. Значение","body":"Прошедшее 형용사 описывает состояние или оценку в прошлом: каким что-то было тогда.\nРазница с настоящим важна в оценках: 맛있어요 — «вкусно» (ем сейчас); 맛있었어요 — «было вкусно» (уже поел).\n비싸요 — «дорого» (сейчас, вообще); 비쌌어요 — «было дорого» (когда покупал).","ex":[{"ko":"맛있어요.","ru":"Вкусно (ем сейчас)."},{"ko":"맛있었어요.","ru":"Было вкусно (уже поел)."}]},{"id":"s5","title":"5. Произношение","body":"ㅎ в 좋다, 많다 между гласными не читается: 좋았어요 [조아써요], 많았어요 [마나써요].\nㅆ перетекает: 비쌌어요 [비싸써요], 바빴어요 [바빠써요].","ex":[]}],"usage":[{"id":"u1","sit":"Поблагодарить за еду — похвалой","phrase":"맛있었어요!","note":"После еды — прошедшее: еда уже съедена. Во время еды — 맛있어요.","ex":[{"ko":"한국 음식이 아주 맛있었어요.","ru":"Корейская еда была очень вкусная."}]},{"id":"u2","sit":"Сколько стоило","phrase":"비쌌어요?","note":"О покупке: «дорого было?».","ex":[{"ko":"옷이 비쌌어요? — 아니요, 쌌어요.","ru":"Одежда была дорогая? — Нет, дешёвая."}]},{"id":"u3","sit":"Был занят","phrase":"바빴어요.","note":"Объяснение, почему не ответил или не пришёл.","ex":[{"ko":"저는 아주 바빴어요.","ru":"Я был очень занят."},{"ko":"선생님이 바빴어요.","ru":"Учитель был занят."}]},{"id":"u4","sit":"Болел","phrase":"아팠어요.","note":"아프다 → 아팠어요.","ex":[{"ko":"친구가 아팠어요.","ru":"Друг болел."}]},{"id":"u5","sit":"Впечатление от места","phrase":"공원이 예뻤어요.","note":"После поездки или прогулки.","ex":[{"ko":"그 식당은 좋았어요.","ru":"Тот ресторан был хороший."},{"ko":"식당에 사람이 많았어요.","ru":"В ресторане было много людей."}]},{"id":"u6","sit":"Впечатление от фильма","phrase":"영화가 좋았어요?","note":"Вопрос о впечатлении — прошедшее 형용사.","ex":[{"ko":"영화가 좋았어요? — 네, 아주 좋았어요.","ru":"Фильм понравился? — Да, очень."},{"ko":"영화가 길었어요.","ru":"Фильм был длинный."}]},{"id":"u7","sit":"Было / не было","phrase":"사람이 없었어요.","note":"있었어요 / 없었어요.","ex":[{"ko":"가게에 빵이 없었어요.","ru":"В магазине не было хлеба."},{"ko":"집에 친구가 있었어요.","ru":"Дома был друг."}]},{"id":"u8","sit":"Рассказ: действие + оценка","phrase":"친구를 만났어요. 아주 좋았어요.","note":"Две фразы: что делал — каково было.","ex":[{"ko":"카페에서 커피를 마셨어요. 커피가 맛있었어요.","ru":"Пил кофе в кафе. Кофе был вкусный."}]},{"id":"u9","sit":"Тогда и сейчас","phrase":"그 식당은 비쌌어요. 이 식당은 싸요.","note":"Время у каждого сказуемого своё.","ex":[{"ko":"방이 작았어요. 이 방은 커요.","ru":"Та комната была маленькая, а эта большая."}]},{"id":"u10","sit":"Быстро / медленно было","phrase":"차가 빨랐어요.","note":"빠르다 → 빨랐어요, 느리다 → 느렸어요.","ex":[{"ko":"그 차는 아주 느렸어요.","ru":"Та машина была очень медленная."}]}],"rel":[{"id":"았/었"},{"id":"g4"},{"id":"g5"},{"id":"g6"},{"id":"g8"},{"id":"g18","label":"Тема 18: ㅂ-불규칙"}],"new":[]},{"id":"g8","n":8,"title":"Прошедшее время связки 이다 / 아니다","meaning":"«Это был друг», «я был студентом», «здесь был ресторан», «это был не кофе».\nСвязка получает тот же показатель 었: 이 + 었 + 어요. После гласной 이 сливается с ним — 였어요. Отрицание — **아니었어요**.","schema":[{"title":"Связка: N + 이었어요 / 였어요","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N이었어요","학생이었어요 · 선생님이었어요 · 책이었어요"],["гласная","N였어요","친구였어요 · 커피였어요 · 누구였어요"]],"note":"Не 이였어요 — ни после согласной, ни после гласной."},{"title":"Отрицание: N + 이/가 아니었어요","cols":["Конец слова","Форма","Примеры"],"rows":[["согласная (받침)","N이 아니었어요","학생이 아니었어요"],["гласная","N가 아니었어요","친구가 아니었어요"]],"note":""},{"title":"Настоящее → прошедшее","cols":["Настоящее","Прошедшее"],"rows":[["학생이에요","학생이었어요"],["친구예요","친구였어요"],["학생이 아니에요","학생이 아니었어요"]],"note":""}],"sections":[{"id":"s1","title":"1. 이었어요 / 였어요","body":"이다 → основа 이 + 었 + 어요 → **이었어요**. Прирастает к существительному, как 이에요.\nПосле согласной — полностью: 학생이었어요, 선생님이었어요.\nПосле гласной 이 + 었 сливаются в **였**: 친구였어요, 커피였어요. Так же в настоящем 이에요 стягивается в 예요.\nВопрос — та же форма с подъёмом тона.","ex":[{"ko":"저는 학생이었어요.","ru":"Я был студентом."},{"ko":"그 사람은 친구였어요.","ru":"Тот человек был другом."},{"ko":"선생님이었어요?","ru":"Это был учитель?"}]},{"id":"s2","title":"2. Отрицание 아니었어요","body":"아니 + 었 + 어요 → **아니었어요**. Существительное перед ним — с 이/가, как в настоящем: 학생이 아니었어요.\nОтдельное слово, через пробел.","ex":[{"ko":"그 사람은 선생님이 아니었어요.","ru":"Тот человек не был учителем."},{"ko":"그것은 커피가 아니었어요.","ru":"Это был не кофе."}]},{"id":"s3","title":"3. Написание","body":"Частая ошибка — лишний 이: *학생이였어요, *친구이였어요.\nПосле согласной: 이**었**어요 — 이 и 었 раздельно.\nПосле гласной: **였**어요 — одно 였, без 이.\nПроверка: 이 в форме встречается ровно один раз — отдельно (이었) или внутри 였.","ex":[]},{"id":"s4","title":"4. Вопросительные слова","body":"뭐 → **뭐였어요?** «что это было?». 누구 → **누구였어요?** «кто это был?». 어디 → **어디였어요?** «где это было?».\nПорядок тот же, что в темах 1 и 2.","ex":[{"ko":"그것은 뭐였어요?","ru":"Что это было?"},{"ko":"누구였어요?","ru":"Кто это был?"},{"ko":"어디였어요?","ru":"Где это было?"}]},{"id":"s5","title":"5. Произношение","body":"받침 перетекает: 학생이었어요 [학쌩이어써요], 책이었어요 [채기어써요].\n친구였어요 [친구여써요], 아니었어요 [아니어써요].","ex":[]}],"usage":[{"id":"u1","sit":"Кем был раньше","phrase":"저는 학생이었어요.","note":"О прошлом статусе.","ex":[{"ko":"그 사람은 선생님이었어요.","ru":"Тот человек был учителем."},{"ko":"친구는 학생이었어요.","ru":"Друг был студентом."}]},{"id":"u2","sit":"Кто это был?","phrase":"누구였어요?","note":"Про звонок, гостя, человека на улице.","ex":[{"ko":"누구였어요? — 친구였어요.","ru":"Кто это был? — Друг."},{"ko":"그 사람은 누구였어요? — 선생님이었어요.","ru":"Кто был тот человек? — Учитель."}]},{"id":"u3","sit":"Что это было?","phrase":"그것은 뭐였어요?","note":"О съеденном, увиденном.","ex":[{"ko":"그것은 뭐였어요? — 한국 음식이었어요.","ru":"Что это было? — Корейская еда."}]},{"id":"u4","sit":"Какое это было место","phrase":"어디였어요?","note":"Ответ — N이었어요/였어요.","ex":[{"ko":"어디였어요? — 공원이었어요.","ru":"Где это было? — В парке."}]},{"id":"u5","sit":"Здесь раньше было","phrase":"여기는 식당이었어요.","note":"Тема 여기는 + прошедшее связки.","ex":[{"ko":"여기는 카페예요. 식당이었어요.","ru":"Здесь кафе. Раньше был ресторан."},{"ko":"거기는 학교였어요.","ru":"Там раньше была школа."}]},{"id":"u6","sit":"«Это был не X, а Y»","phrase":"커피가 아니었어요. 차였어요.","note":"Две фразы подряд, как в теме 1.","ex":[{"ko":"그 사람은 선생님이 아니었어요. 학생이었어요.","ru":"Он был не учитель, а студент."}]},{"id":"u7","sit":"Ответ да / нет","phrase":"네, 친구였어요.","note":"Полная фраза после 네/아니요.","ex":[{"ko":"친구였어요? — 아니요, 친구가 아니었어요.","ru":"Это был друг? — Нет, не друг."}]},{"id":"u8","sit":"Рассказ: действие + что это было","phrase":"영화를 봤어요. 한국 영화였어요.","note":"Глагол в прошедшем + связка в прошедшем.","ex":[{"ko":"식당에서 밥을 먹었어요. 한국 식당이었어요.","ru":"Ел в ресторане. Это был корейский ресторан."}]},{"id":"u9","sit":"Вспомнить имя","phrase":"이름이 뭐였어요?","note":"«Как его звали?» — прошедшее, если имя было названо раньше или забыто.","ex":[{"ko":"그 사람 이름이 뭐였어요? — 민수였어요.","ru":"Как звали того человека? — Минсу."}]}],"rel":[{"id":"이에요/예요"},{"id":"아니에요"},{"id":"았/었"},{"id":"g1"},{"id":"g6"},{"id":"g7"},{"id":"g20","label":"Тема 20: 이었습니다"},{"id":"g10"}],"new":[]},{"id":"g9","n":9,"title":"Слова времени + частица 에","meaning":"«Когда»: утром, вечером, сегодня, вчера, завтра.\nВремя отмечается той же частицей **에**, что «куда» и «где находится» (тема 3): 저녁에 만나요 — «встречаемся вечером».\nНо 오늘, 어제, 내일, 지금 идут **без 에**. С 내일 форма настоящего времени обозначает будущее.","schema":[{"title":"С 에 и без","cols":["Слово","Как употребляется","Пример"],"rows":[["아침 · 점심 · 저녁 · 밤","+ 에","아침에 · 저녁에 · 밤에"],["오늘 · 어제 · 내일 · 지금","без 에","오늘 · 어제 · 내일 · 지금"]],"note":"*오늘에, *어제에 — ошибка."},{"title":"Сочетания","cols":["По-русски","По-корейски"],"rows":[["сегодня утром","오늘 아침에"],["вчера вечером","어제 저녁에"],["завтра ночью","내일 밤에"]],"note":"에 — один раз, в конце группы."},{"title":"Время и форма глагола","cols":["Слово","Форма","Пример"],"rows":[["어제","прошедшее","어제 영화를 봤어요."],["오늘, 지금","настоящее / прошедшее","오늘 바빠요. · 오늘 친구를 만났어요."],["내일","настоящее = будущее","내일 친구를 만나요."]],"note":""}],"sections":[{"id":"s1","title":"1. 에 отвечает на «когда?»","body":"Частица 에 после слова времени — «в (такое-то время)»: 저녁에 — «вечером», 밤에 — «ночью».\nЭто та же 에, что в 학교에 가요 и 집에 있어요: точка — в пространстве или во времени.\nВ одной фразе может быть два 에 с разными ролями: 아침에 학교에 가요 — «утром иду в школу».","ex":[{"ko":"저녁에 친구를 만나요.","ru":"Вечером встречаюсь с другом."},{"ko":"밤에 책을 읽어요.","ru":"Ночью читаю."},{"ko":"아침에 학교에 가요.","ru":"Утром иду в школу."}]},{"id":"s2","title":"2. Без 에: 오늘, 어제, 내일, 지금","body":"Эти слова сами работают как наречия — «сегодня», «вчера», «завтра», «сейчас». 에 к ним не добавляется: 오늘 가요, не *오늘에 가요.\nЗапомнить четвёрку целиком: 오늘, 어제, 내일, 지금 — без частицы. Части суток (아침, 점심, 저녁, 밤) — с 에.","ex":[{"ko":"오늘 바빠요.","ru":"Сегодня занят."},{"ko":"어제 영화를 봤어요.","ru":"Вчера смотрел фильм."},{"ko":"지금 집에 있어요.","ru":"Сейчас дома."}]},{"id":"s3","title":"3. Части суток","body":"아침에 — утром, 점심에 — днём (в обед), 저녁에 — вечером, 밤에 — ночью.\n점심에 — «в обеденное время», около полудня; не «после обеда».","ex":[{"ko":"아침에 커피를 마셔요.","ru":"Утром пью кофе."},{"ko":"점심에 식당에 가요.","ru":"В обед иду в столовую."},{"ko":"저녁에 집에서 쉬어요.","ru":"Вечером отдыхаю дома."}]},{"id":"s4","title":"4. Сочетания: 오늘 아침에","body":"Слово без 에 + часть суток: 에 ставится один раз, в конце: 오늘 아침에, 어제 저녁에, 내일 밤에.\nПорядок как в русском: сначала день, потом часть суток.","ex":[{"ko":"오늘 아침에 학교에 갔어요.","ru":"Сегодня утром ходил в школу."},{"ko":"어제 저녁에 영화를 봤어요.","ru":"Вчера вечером смотрел фильм."},{"ko":"내일 밤에 친구가 와요.","ru":"Завтра ночью приезжает друг."}]},{"id":"s5","title":"5. Время и форма глагола","body":"어제 — прошедшее: 어제 친구를 만났어요.\n오늘, 지금 — по смыслу: 오늘 바빠요 / 오늘 친구를 만났어요.\n**내일 + настоящее = будущее**: 내일 친구를 만나요 — «завтра встречусь с другом». Для запланированного это норма. Отдельная форма будущего — тема 22.","ex":[{"ko":"내일 회사에 가요.","ru":"Завтра иду на работу."},{"ko":"내일 저녁에 한국 음식을 만들어요.","ru":"Завтра вечером готовлю корейскую еду."}]},{"id":"s6","title":"6. 아침 / 점심 / 저녁 — время и еда","body":"Эти слова значат и часть суток, и приём пищи: 아침 — «утро» и «завтрак», 점심 — «полдень» и «обед», 저녁 — «вечер» и «ужин».\nРазличает частица: 아침에 — «утром» (время), 아침을 먹어요 — «завтракаю» (объект).\nВозможно и так: 저녁에 저녁을 먹어요 — «вечером ужинаю».","ex":[{"ko":"아침을 먹었어요?","ru":"Завтракал?"},{"ko":"점심을 먹어요.","ru":"Обедаю."},{"ko":"저녁에 저녁을 먹어요.","ru":"Вечером ужинаю."}]},{"id":"s7","title":"7. Время как тема: 오늘은","body":"Слово времени может стать темой с 은/는 — для противопоставления дней: 어제는 바빴어요. 오늘은 집에 있어요. — «Вчера был занят, а сегодня дома».\nЭто те же 은/는 из темы 1; слова без 에 принимают их напрямую: 오늘은, 어제는, 내일은.","ex":[{"ko":"어제는 집에 있었어요. 오늘은 회사에 가요.","ru":"Вчера был дома, а сегодня иду на работу."},{"ko":"오늘은 회의가 있어요.","ru":"Сегодня (именно сегодня) совещание."}]},{"id":"s8","title":"8. Порядок слов","body":"Время обычно стоит в начале — до места и объекта: [тема] [время] [место] [объект] глагол.\n저는 저녁에 집에서 책을 읽어요. Время можно поставить и перед темой: 어제 저는 영화를 봤어요.","ex":[{"ko":"저는 아침에 카페에서 커피를 마셔요.","ru":"Утром я пью кофе в кафе."},{"ko":"어제 저는 친구를 만났어요.","ru":"Вчера я встретился с другом."}]}],"usage":[{"id":"u1","sit":"Договориться о встрече","phrase":"내일 저녁에 만나요.","note":"내일 + настоящее — план.","ex":[{"ko":"내일 아침에 만나요.","ru":"Встречаемся завтра утром."},{"ko":"오늘 저녁에 친구를 만나요.","ru":"Сегодня вечером встречаюсь с другом."}]},{"id":"u2","sit":"Что делал вчера?","phrase":"어제 뭐 했어요?","note":"Ответ — прошедшее.","ex":[{"ko":"어제 뭐 했어요? — 영화를 봤어요.","ru":"Что делал вчера? — Смотрел фильм."}]},{"id":"u3","sit":"Планы на завтра","phrase":"내일 회사에 가요.","note":"Настоящее время о будущем.","ex":[{"ko":"내일 친구가 와요.","ru":"Завтра приезжает друг."},{"ko":"내일 회의가 있어요.","ru":"Завтра совещание."}]},{"id":"u4","sit":"Сейчас","phrase":"지금 집에 있어요.","note":"지금 — без 에.","ex":[{"ko":"지금 바빠요? — 네, 바빠요.","ru":"Сейчас занят? — Да."},{"ko":"지금 밥을 먹어요.","ru":"Сейчас ем."}]},{"id":"u5","sit":"Поел ли?","phrase":"점심을 먹었어요?","note":"아침/점심/저녁 + 을 — приём пищи.","ex":[{"ko":"점심을 먹었어요? — 네, 먹었어요.","ru":"Пообедал? — Да."},{"ko":"아침을 먹었어요?","ru":"Завтракал?"}]},{"id":"u6","sit":"Сегодня занят","phrase":"오늘은 바빠요.","note":"은/는 выделяет день: «сегодня (в отличие от других дней)».","ex":[{"ko":"오늘은 회의가 있어요.","ru":"Сегодня у меня совещание."},{"ko":"어제는 바빴어요.","ru":"Вчера был занят."}]},{"id":"u7","sit":"Распорядок дня","phrase":"저는 아침에 커피를 마셔요.","note":"Привычка — настоящее.","ex":[{"ko":"저녁에 집에서 쉬어요.","ru":"Вечером отдыхаю дома."},{"ko":"밤에 책을 읽어요.","ru":"Ночью читаю."}]},{"id":"u8","sit":"Когда именно было","phrase":"어제 저녁에 영화를 봤어요.","note":"День + часть суток + 에.","ex":[{"ko":"오늘 아침에 학교에 갔어요.","ru":"Сегодня утром ходил в школу."},{"ko":"어제 밤에 친구가 왔어요.","ru":"Вчера ночью пришёл друг."}]},{"id":"u9","sit":"Вчера — одно, сегодня — другое","phrase":"어제는 집에 있었어요. 오늘은 회사에 가요.","note":"은/는 на обоих словах времени.","ex":[{"ko":"어제는 아팠어요. 오늘은 좋아요.","ru":"Вчера болел, а сегодня хорошо."}]}],"rel":[{"id":"에"},{"id":"g3"},{"id":"g6"},{"id":"g14"},{"id":"g16","label":"Тема 16: часы, даты, дни недели"},{"id":"g17","label":"Тема 17: 쯤, 동안, 마다"},{"id":"g22","label":"Тема 22: будущее -(으)ㄹ 거예요"}],"new":["u2"]},{"id":"g10","n":10,"title":"Китайские числительные (한자어)","meaning":"Одна из двух систем счёта — заимствованная из китайского. Нужна для денег, номеров, а позже для минут и дат.\nЧисла строятся из 10 цифр и разрядов 십, 백, 천, 만 сложением и умножением, без союзов.\nГлавное отличие от русского — **группировка по четыре знака**: 10 000 — отдельное слово 만, а «сто тысяч» — 십만, «десять по десять тысяч».","schema":[{"title":"Цифры","cols":["Число","Слово"],"rows":[["0","영 · 공 (в номерах)"],["1","일"],["2","이"],["3","삼"],["4","사"],["5","오"],["6","육"],["7","칠"],["8","팔"],["9","구"],["10","십"]],"note":""},{"title":"Составные","cols":["Число","Слово","Устройство"],"rows":[["11","십일","10 + 1"],["20","이십","2 × 10"],["35","삼십오","3 × 10 + 5"],["99","구십구","9 × 10 + 9"]],"note":""},{"title":"Разряды","cols":["Число","Слово"],"rows":[["100","백"],["1 000","천"],["10 000","만"],["100 000","십만"],["1 000 000","백만"]],"note":"Перед 백, 천, 만 единица не говорится: 백, не 일백; 만, не 일만."},{"title":"Большие числа: по четыре знака","cols":["Число","Разбивка","Чтение"],"rows":[["25 000","2 | 5000","이만 오천"],["150 000","15 | 0000","십오만"],["1 200 000","120 | 0000","백이십만"],["35 500","3 | 5500","삼만 오천오백"]],"note":"Отделить четыре знака справа: слева — сколько 만, справа — остаток."}],"sections":[{"id":"s1","title":"1. Две системы счёта","body":"В корейском две параллельные системы числительных: **한자어** (китайские: 일, 이, 삼…) и **고유어** (исконные: 하나, 둘, 셋… — тема 11).\nВыбор зависит не от величины числа, а от того, что считают. 한자어 — деньги, номера, цифры в кодах; позже — минуты, даты, этажи.","ex":[{"ko":"오천 원","ru":"5 000 вон"}]},{"id":"s2","title":"2. Цифры 0–10","body":"영 (0), 일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십 (10).\nОмонимы: 일 — «1» и «работа»; 이 — «2» и «этот». Различает контекст: рядом с 원 и другими числами — число.","ex":[]},{"id":"s3","title":"3. Десятки и составные","body":"Десятки — умножением: 이십 (2 × 10), 삼십, 구십.\nЕдиницы — сложением, в конец: 십일 (11), 이십오 (25), 구십구 (99).\nНикаких «и» между частями. Пишется слитно в пределах четырёх знаков.","ex":[{"ko":"십오","ru":"15"},{"ko":"사십이","ru":"42"},{"ko":"칠십팔","ru":"78"}]},{"id":"s4","title":"4. Сотни и тысячи","body":"백 — 100, 천 — 1 000. Множитель — впереди: 이백 (200), 삼천 (3 000).\nЕдиница перед разрядом не произносится: 100 = **백**, 1 000 = **천** (не 일백, не 일천).\nДальше — тем же сложением: 백오십 (150), 천이백 (1 200), 오천오백 (5 500).","ex":[{"ko":"백","ru":"100"},{"ko":"이백칠","ru":"207"},{"ko":"천이백","ru":"1 200"}]},{"id":"s5","title":"5. 만 и группировка по четыре","body":"Русский счёт идёт тройками: тысяча, миллион. Корейский — четвёрками: 만 = 10 000 — самостоятельный разряд, дальше счёт идёт от него.\n10 000 = **만** (не 일만). 100 000 = **십만** («10 만»). 1 000 000 = **백만** («100 만»).\nКак читать: отделить четыре знака справа. Левая часть — сколько 만, правая — остаток: 25 000 → 2 | 5000 → 이만 오천.\n**Как писать:** каждая группа из четырёх знаков пишется слитно, после разряда 만 — пробел. Групп две — пробел один.\n1 234 567 → 123 | 4567 → **백이십삼만 사천오백육십칠**: слева «сколько 만» (백이십삼만), справа остаток (사천오백육십칠).\nЧисло меньше 10 000 — одна группа, без пробелов: 사천오백육십칠, 천오백.\nСлитное 만오천 — ошибка оформления; в рукописи и чатах встречается часто, в упражнениях засчитывается как описка.","ex":[{"ko":"만","ru":"10 000"},{"ko":"이만 오천","ru":"25 000"},{"ko":"십오만","ru":"150 000"},{"ko":"백이십만","ru":"1 200 000"},{"ko":"백이십삼만 사천오백육십칠","ru":"1 234 567"}]},{"id":"s6","title":"6. Деньги: 원","body":"Число + 원 через пробел: 천 원, 오천 원, 만 원.\nЦена в предложении — со связкой: 원 кончается на согласную → **원이에요**, в прошедшем **원이었어요**.\nВопрос о цене — **얼마예요?** «сколько стоит?».","ex":[{"ko":"천 원이에요.","ru":"1 000 вон."},{"ko":"삼만 오천 원이에요.","ru":"35 000 вон."},{"ko":"얼마예요?","ru":"Сколько стоит?"}]},{"id":"s7","title":"7. 영 и 공","body":"Оба — «ноль». **영** — в счёте и математике. **공** — в номерах и кодах, которые читают по цифрам: 010 → 공일공.\nНомер телефона читают по одной цифре; номер комнаты или этажа — целым числом: 207 → 이백칠.","ex":[{"ko":"공일공","ru":"010 (по цифрам)"},{"ko":"이백칠","ru":"207 (комната)"}]},{"id":"s8","title":"8. Произношение","body":"십육 [심뉵], 이십육 [이심뉵]: перед 육 после согласной добавляется [н].\n십만 [심만], 백만 [뱅만]: 받침 уподобляется ㅁ.\nСвязывание с 원: 백 원 [배권], 만 원 [마눤], 천 원 [처눤], 삼십 원 [삼시붠].\n십일 [시빌], 삼십일 [삼시빌].","ex":[]}],"usage":[{"id":"u1","sit":"Сколько стоит?","phrase":"이 책은 얼마예요?","note":"Предмет — тема, 얼마 + 예요. Ответ — сумма + 원이에요.","ex":[{"ko":"이 책은 얼마예요? — 만 오천 원이에요.","ru":"Сколько стоит эта книга? — 15 000 вон."},{"ko":"커피는 얼마예요? — 사천오백 원이에요.","ru":"Сколько стоит кофе? — 4 500 вон."}]},{"id":"u2","sit":"Реакция на цену","phrase":"만 원이에요? 비싸요!","note":"Переспрос суммы + 형용사.","ex":[{"ko":"천 원이에요? 아주 싸요.","ru":"1 000 вон? Очень дёшево."}]},{"id":"u3","sit":"Сколько заплатил","phrase":"얼마였어요?","note":"Прошедшее связки (тема 8).","ex":[{"ko":"얼마였어요? — 삼천 원이었어요.","ru":"Сколько стоило? — 3 000 вон."},{"ko":"옷은 삼만 원이었어요.","ru":"Одежда стоила 30 000 вон."}]},{"id":"u4","sit":"Есть ли деньги","phrase":"돈이 없어요.","note":"돈 + 있다/없다; сумма — подлежащее с 이/가.","ex":[{"ko":"돈이 있어요? — 네, 만 원이 있어요.","ru":"Деньги есть? — Да, 10 000 вон."},{"ko":"돈이 적어요.","ru":"Денег мало."}]},{"id":"u5","sit":"Крупная сумма","phrase":"십만 원이에요.","note":"Сотни тысяч — через 만: 십만, 이십만, 백만.","ex":[{"ko":"이 옷은 십이만 원이에요.","ru":"Эта одежда стоит 120 000 вон."},{"ko":"이 차는 천만 원이에요.","ru":"Эта машина стоит 10 000 000 вон."}]},{"id":"u6","sit":"Сравнить цены","phrase":"빵은 천 원이에요. 커피는 오천 원이에요.","note":"은/는 — сопоставление.","ex":[{"ko":"이 식당은 만 원이에요. 저 식당은 오천 원이에요.","ru":"Здесь 10 000 вон, а там — 5 000."}]},{"id":"u7","sit":"Продиктовать номер","phrase":"공일공 오삼팔","note":"Телефон — по цифрам, 0 = 공; группы разделяют паузой.","ex":[{"ko":"공일공 칠팔구","ru":"010 789"}]}],"rel":[{"id":"g8"},{"id":"g11"},{"id":"g12"},{"id":"g16","label":"Тема 16: минуты, даты"}],"new":[]},{"id":"g11","n":11,"title":"Исконные числительные (고유어)","meaning":"Вторая система счёта — собственно корейская: 하나, 둘, 셋… Ей считают предметы и людей, называют возраст, позже — часы.\nСуществует только до 99: со 100 работает 한자어.\nПеред счётным словом пять числительных сокращаются: 한, 두, 세, 네, 스무. Первое такое слово — 살 «лет»: 스무 살, 서른두 살.","schema":[{"title":"1–10","cols":["Число","Слово","Перед счётным"],"rows":[["1","하나","한"],["2","둘","두"],["3","셋","세"],["4","넷","네"],["5","다섯","다섯"],["6","여섯","여섯"],["7","일곱","일곱"],["8","여덟","여덟"],["9","아홉","아홉"],["10","열","열"]],"note":"Сокращаются только 1–4."},{"title":"Десятки","cols":["Число","Слово"],"rows":[["10","열"],["20","스물 (перед счётным — 스무)"],["30","서른"],["40","마흔"],["50","쉰"],["60","예순"],["70","일흔"],["80","여든"],["90","아흔"]],"note":"Каждый десяток — отдельное слово, не «два-десять»."},{"title":"Возраст","cols":["Число","С 살"],"rows":[["1","한 살"],["20","스무 살"],["21","스물한 살"],["25","스물다섯 살"],["32","서른두 살"],["44","마흔네 살"]],"note":"Сокращается последняя часть: 스물한, 서른두, 마흔네."}],"sections":[{"id":"s1","title":"1. Зачем вторая система","body":"한자어 (тема 10) — деньги, номера, цифры. 고유어 — счёт штук и людей, возраст, позже часы.\nВыбор определяет то, что считают, а не величина числа: 스무 살 — «20 лет» (고유어), 이십 원 — «20 вон» (한자어).\n고유어 доходит только до 99. Со 100 — только 한자어: 백 살.","ex":[{"ko":"스무 살","ru":"20 лет"},{"ko":"이십 원","ru":"20 вон"}]},{"id":"s2","title":"2. 1–10 и десятки","body":"하나, 둘, 셋, 넷, 다섯, 여섯, 일곱, 여덟, 아홉, 열.\nДесятки — самостоятельные слова: 열 (10), 스물 (20), 서른 (30), 마흔 (40), 쉰 (50), 예순 (60), 일흔 (70), 여든 (80), 아흔 (90).\nИх нельзя вывести из цифр — только выучить.","ex":[]},{"id":"s3","title":"3. Составные","body":"Десяток + единица, слитно: 열하나 (11), 열둘 (12), 스물다섯 (25), 서른둘 (32), 아흔아홉 (99).\nОтдельными словами составные не считаются: это сумма двух выученных.","ex":[{"ko":"열다섯","ru":"15"},{"ko":"스물여덟","ru":"28"},{"ko":"마흔하나","ru":"41"}]},{"id":"s4","title":"4. Сокращение перед счётным словом","body":"Перед счётным словом (살, а в теме 12 — 개, 명 и др.) четыре числительных теряют конец: 하나 → **한**, 둘 → **두**, 셋 → **세**, 넷 → **네**.\n스물 → **스무**, но только ровно 20: 스무 살. В составных сокращается последняя часть: 스물한 살, 서른두 살, 마흔세 살.\nОстальные (다섯…아홉, 열 и десятки) не меняются: 다섯 살, 서른 살.","ex":[{"ko":"한 살","ru":"1 год"},{"ko":"스무 살","ru":"20 лет"},{"ko":"스물한 살","ru":"21 год"},{"ko":"서른네 살","ru":"34 года"}]},{"id":"s5","title":"5. Возраст: 살 и 몇","body":"Возраст — число + 살 через пробел, со связкой:
